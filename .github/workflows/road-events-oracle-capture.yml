name: Road Events Oracle Capture

on:
  push:
    branches:
      - arch/0.6.6.26-road-events-oracle

permissions:
  contents: write

jobs:
  capture:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Freeze released Road Events fixture
        shell: pwsh
        run: |
          $env:DICEBOUND_CAPTURE_ROAD_EVENTS = "1"
          node tools/test_road_events_oracle.js | Tee-Object -FilePath road-events-capture.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Remove-Item Env:DICEBOUND_CAPTURE_ROAD_EVENTS -ErrorAction SilentlyContinue

          @'
          from pathlib import Path
          text = Path("road-events-capture.log").read_text(encoding="utf-8-sig")
          begin = "ROAD_EVENTS_FIXTURE_BEGIN"
          end = "ROAD_EVENTS_FIXTURE_END"
          if begin not in text or end not in text:
              raise SystemExit("Road Events fixture markers missing from capture output")
          payload = text.split(begin, 1)[1].split(end, 1)[0].strip()
          out = Path("tools/fixtures/road_events_0_6_6_25.json")
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text(payload + "\n", encoding="utf-8")
          '@ | python -

      - name: Verify frozen oracle and adjacent owners
        shell: pwsh
        run: |
          node tools/test_road_events_oracle.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/test_event_reward_policy.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/test_board_tile_dispatch.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/test_run_facade.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Materialize fixture commit object
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          @'
          import base64
          import json
          import os
          import subprocess
          import urllib.request
          from pathlib import Path

          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          parent = os.environ["GITHUB_SHA"]
          api_root = f"https://api.github.com/repos/{repo}/git"

          def post(path, payload):
              req = urllib.request.Request(
                  api_root + path,
                  data=json.dumps(payload).encode("utf-8"),
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "Content-Type": "application/json",
                  },
                  method="POST",
              )
              with urllib.request.urlopen(req) as response:
                  return json.load(response)

          fixture = Path("tools/fixtures/road_events_0_6_6_25.json")
          if not fixture.is_file():
              raise SystemExit("Road Events fixture was not produced")
          blob = post("/blobs", {
              "content": base64.b64encode(fixture.read_bytes()).decode("ascii"),
              "encoding": "base64",
          })
          base_tree = subprocess.check_output(["git", "rev-parse", "HEAD^{tree}"], text=True).strip()
          tree = post("/trees", {
              "base_tree": base_tree,
              "tree": [{
                  "path": "tools/fixtures/road_events_0_6_6_25.json",
                  "mode": "100644",
                  "type": "blob",
                  "sha": blob["sha"],
              }],
          })
          commit = post("/commits", {
              "message": "test: freeze Road Events 0.6.6.25 oracle",
              "tree": tree["sha"],
              "parents": [parent],
          })
          print(f"REMOTE_COMMIT_SHA={commit['sha']}")
          '@ | python -
