name: Temporary canonical debug UI materializer

on:
  push:
    branches:
      - refactor/0.6.6.38-canonical-functions
    paths:
      - .github/workflows/tmp-canonical-debug-ui.yml

permissions:
  contents: read

jobs:
  materialize:
    runs-on: windows-latest
    steps:
      - name: Mint repository App token
        id: app
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.DICEBOUND_RELEASE_APP_ID }}
          private-key: ${{ secrets.DICEBOUND_RELEASE_APP_PRIVATE_KEY }}
          owner: Krtz
          repositories: DiceBound
          permission-contents: write
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.app.outputs.token }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rewrite and validate Debug UI chains
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python tools/tmp_materialize_debug_ui.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/refresh_runtime_manifest.py --version 0.6.6.38 --channel Beta --development-state Unreleased
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/test_canonical_debug_action.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/test_canonical_debug_ui.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/test_historical_layer_census.py --markdown docs/HISTORICAL_LAYER_CENSUS.md
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check runtime/js/dicebound.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/validate_runtime_architecture.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/validate_version_identity.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Commit exact validated tree
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Remove-Item tools/tmp_materialize_debug_ui.py
          Remove-Item .github/workflows/tmp-canonical-debug-ui.yml
          git config user.name "dicebound-manifest-publisher[bot]"
          git config user.email "323488390+dicebound-manifest-publisher[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Beta 0.6.6.38: canonicalize debug UI history"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git push origin HEAD:refactor/0.6.6.38-canonical-functions
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
