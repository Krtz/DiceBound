name: Temporary Nature VFX rescue

on:
  push:
    branches:
      - "tmp/nature-rescue-0.6.3.11"

permissions:
  contents: write

jobs:
  materialize:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Materialize and validate
        run: python tools/tmp_nature_rescue.py
