name: Temporary canonical return-to-road materializer

on:
  push:
    branches:
      - refactor/0.6.6.38-canonical-functions
    paths:
      - .github/workflows/tmp-canonical-return-to-road.yml

permissions:
  contents: read

jobs:
  canonicalize:
    runs-on: windows-latest
    steps:
      - name: Mint repository App token
        id: app
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.DICEBOUND_RELEASE_APP_ID }}
          private-key: ${{ secrets.DICEBOUND_RELEASE_APP_PRIVATE_KEY }}
          owner: Krtz
          repositories: DiceBound
          permission-contents: write
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.app.outputs.token }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Collapse returnToRoad history and validate source
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          @'
          from pathlib import Path
          import re

          root=Path.cwd();p=root/'runtime/js/dicebound.js';text=p.read_text(encoding='utf-8')

          new='''  let dbReturnToRoadTraceReady=false,dbReturnToRoadSafetyReady=false,dbReturnToRoadStoneReady=false,dbReturnToRoadFriendReady=false;
          function returnToRoad(...args){
            if(dbReturnToRoadFriendReady){dbClasses.invokerResetCombat();dbFriendClearCombatPresentation();}
            if(dbReturnToRoadSafetyReady&&!currentEnemy)combatBusy=false;
            const core=()=>{if(pendingLevelUps>0)openLevelUp();else{rollLocked=false;updateHUD();}};
            const result=dbReturnToRoadTraceReady?v25TraceCommand('returnToRoad',core,'detailed',args,this):core();
            if(dbReturnToRoadSafetyReady&&!currentEnemy)combatBusy=false;
            if(dbReturnToRoadStoneReady&&!currentEnemy)v26ClearStoneBattle();
            return result;
          }'''
          base=re.compile(r'''  function\s+returnToRoad\s*\(\s*\)\s*\{\s*if\s*\(pendingLevelUps\s*>\s*0\)\s*openLevelUp\(\)\s*;\s*else\s*\{\s*rollLocked\s*=\s*false\s*;\s*updateHUD\(\)\s*;\s*\}\s*\}''',re.S)
          text,n=base.subn(new,text,count=1)
          if n!=1: raise SystemExit(f'expected one base returnToRoad, replaced {n}')

          new_wrap='''  function v25WrapCommand(name,level='detailed'){
            const fn=({rollDice,rollTwoDice,applyUpgrade,equipItem})[name];if(typeof fn!=='function')return;
            const wrapped=function(...args){return v25TraceCommand(name,fn,level,args,this);};
            if(name==='rollDice')rollDice=wrapped;else if(name==='rollTwoDice')rollTwoDice=wrapped;else if(name==='applyUpgrade')applyUpgrade=wrapped;else if(name==='equipItem')equipItem=wrapped;
          }
          ['rollDice','rollTwoDice','applyUpgrade','equipItem'].forEach(n=>v25WrapCommand(n,n==='rollDice'||n==='rollTwoDice'?'events':'detailed'));
          dbReturnToRoadTraceReady=true;'''
          wrap=re.compile(r'''  function\s+v25WrapCommand\s*\(name,level='detailed'\)\s*\{.*?\n\s*\}\s*\n\s*\['rollDice','rollTwoDice','returnToRoad','applyUpgrade','equipItem'\]\.forEach\(n=>v25WrapCommand\(n,n==='rollDice'\|\|n==='rollTwoDice'\?'events':'detailed'\)\);''',re.S)
          text,n=wrap.subn(new_wrap,text,count=1)
          if n!=1: raise SystemExit(f'expected one v25 command wrapper block, replaced {n}')

          safety=re.compile(r'''  const\s+returnToRoadV251Base\s*=\s*returnToRoad\s*;\s*returnToRoad\s*=\s*function\s*\(\.\.\.args\)\s*\{\s*if\s*\(!currentEnemy\)\s*combatBusy\s*=\s*false\s*;\s*const\s+result\s*=\s*returnToRoadV251Base\.apply\(this,args\)\s*;\s*if\s*\(!currentEnemy\)\s*combatBusy\s*=\s*false\s*;\s*return\s+result\s*;\s*\}\s*;''',re.S)
          text,n=safety.subn('  dbReturnToRoadSafetyReady=true;',text,count=1)
          if n!=1: raise SystemExit(f'expected one v2.5.1 road-return layer, removed {n}')

          stone=re.compile(r'''  const\s+returnToRoadV26Base\s*=\s*returnToRoad\s*;\s*returnToRoad\s*=\s*function\s*\(\.\.\.args\)\s*\{\s*const\s+r\s*=\s*returnToRoadV26Base\.apply\(this,args\)\s*;\s*if\s*\(!currentEnemy\)\s*v26ClearStoneBattle\(\)\s*;\s*return\s+r\s*;\s*\}\s*;''',re.S)
          text,n=stone.subn('  dbReturnToRoadStoneReady=true;',text,count=1)
          if n!=1: raise SystemExit(f'expected one v26 road-return layer, removed {n}')

          friend=re.compile(r'''  const\s+dbFriendReturnToRoadBase\s*=\s*returnToRoad\s*;\s*returnToRoad\s*=\s*function\s*\(\.\.\.args\)\s*\{\s*dbClasses\.invokerResetCombat\(\)\s*;\s*dbFriendClearCombatPresentation\(\)\s*;\s*return\s+dbFriendReturnToRoadBase\.apply\(this,args\)\s*;\s*\}\s*;''',re.S)
          text,n=friend.subn('  dbReturnToRoadFriendReady=true;',text,count=1)
          if n!=1: raise SystemExit(f'expected one Friends road-return layer, removed {n}')
          p.write_text(text,encoding='utf-8',newline='\n')

          test=root/'tools/test_canonical_return_to_road.py'
          test.write_text(r'''from pathlib import Path
          import re

          ROOT=Path(__file__).resolve().parents[1]
          SOURCE=(ROOT/'runtime/js/dicebound.js').read_text(encoding='utf-8')
          if len(re.findall(r'\bfunction\s+returnToRoad\s*\(',SOURCE))!=1:
              raise SystemExit('returnToRoad must have exactly one canonical declaration')
          if re.search(r'\breturnToRoad\s*=\s*function\b',SOURCE):
              raise SystemExit('historical returnToRoad function replacement returned')
          if re.search(r'\b(?:const|let|var)\s+[A-Za-z_$][\w$]*\s*=\s*returnToRoad\s*;',SOURCE):
              raise SystemExit('historical returnToRoad predecessor capture returned')
          for alias in ('returnToRoadV251Base','returnToRoadV26Base','dbFriendReturnToRoadBase'):
              if re.search(rf'\b{alias}\b',SOURCE): raise SystemExit(f'retired returnToRoad alias returned: {alias}')

          start=SOURCE.find('function returnToRoad(...args)')
          end=SOURCE.find('function livingEnemies()',start)
          if start<0 or end<0: raise SystemExit('could not isolate canonical returnToRoad region')
          body=SOURCE[start:end]
          required=(
              'if(dbReturnToRoadFriendReady){dbClasses.invokerResetCombat();dbFriendClearCombatPresentation();}',
              'const core=()=>{if(pendingLevelUps>0)openLevelUp();else{rollLocked=false;updateHUD();}};',
              "v25TraceCommand('returnToRoad',core,'detailed',args,this)",
              'if(dbReturnToRoadStoneReady&&!currentEnemy)v26ClearStoneBattle();',
              'return result;',
          )
          for fragment in required:
              if fragment not in body: raise SystemExit('canonical returnToRoad missing released behavior: '+fragment)
          safety='if(dbReturnToRoadSafetyReady&&!currentEnemy)combatBusy=false;'
          if body.count(safety)!=2: raise SystemExit('canonical returnToRoad must preserve pre/post combatBusy repair')
          positions=[body.find('dbClasses.invokerResetCombat()'),body.find(safety),body.find("v25TraceCommand('returnToRoad'"),body.rfind(safety),body.find('v26ClearStoneBattle()')]
          if positions!=sorted(positions): raise SystemExit('canonical returnToRoad final composition order changed')
          for flag in ('dbReturnToRoadTraceReady=true;','dbReturnToRoadSafetyReady=true;','dbReturnToRoadStoneReady=true;','dbReturnToRoadFriendReady=true;'):
              if SOURCE.count(flag)!=1: raise SystemExit('returnToRoad staged bootstrap gate missing or duplicated: '+flag)
          v25_start=SOURCE.find("function v25WrapCommand(")
          v25_end=SOURCE.find('/* Final UI sync / tests',v25_start)
          v25=SOURCE[v25_start:v25_end]
          if 'returnToRoad' in v25: raise SystemExit('v25 generic command wrapper still owns returnToRoad')
          print('Canonical returnToRoad PASS: base, trace, soft-lock repair, Stone cleanup and Friends presentation reset preserve final order in one function')
          '''.replace('\n          ','\n').lstrip(),encoding='utf-8',newline='\n')
          '@ | Set-Content -Encoding UTF8 .tmp_canonical_road.py
          python .tmp_canonical_road.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Remove-Item .tmp_canonical_road.py

          python tools/test_canonical_return_to_road.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/test_canonical_apply_run_theme.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/test_canonical_debug_action.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/test_canonical_debug_ui.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/test_canonical_tile_meta.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/test_historical_layer_census.py --markdown docs/HISTORICAL_LAYER_CENSUS.md
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check runtime/js/dicebound.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/validate_runtime_architecture.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/validate_version_identity.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Commit canonical road return and remove one-shot workflow
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Remove-Item .github/workflows/tmp-canonical-return-to-road.yml
          git config user.name "dicebound-manifest-publisher[bot]"
          git config user.email "323488390+dicebound-manifest-publisher[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: canonicalize return-to-road composition"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git push origin HEAD:refactor/0.6.6.38-canonical-functions
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
