name: Powerups facade materializer

on:
  push:
    branches:
      - arch/0.6.6.33-powerups-oracle
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.7"

      - name: Apply Powerups facade ownership patch
        shell: pwsh
        run: |
          python tools/materialize_powerups_facade.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check runtime/js/powerups/facade.js
          node --check runtime/js/dicebound.js
          node --check tools/test_powerups_facade.js

      - name: Refresh exact candidate runtime metadata
        shell: pwsh
        run: |
          python tools/refresh_runtime_manifest.py --version 0.6.6.32 --channel Beta --development-state Unreleased --notes "Powerups facade architecture candidate for Beta 0.6.6.33."
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run Powerups facade contract
        shell: pwsh
        run: |
          node tools/test_powerups_facade.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Replay frozen Powerups oracle
        shell: pwsh
        run: |
          node tools/test_powerups_oracle.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run complete JavaScript and Python gate
        shell: pwsh
        run: |
          Get-ChildItem runtime/js -Recurse -Filter *.js | ForEach-Object { node --check $_.FullName; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE } }
          Get-ChildItem tools -Filter test_*.js | ForEach-Object { node $_.FullName; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE } }
          Get-ChildItem tools -Filter test_*.py | ForEach-Object { python $_.FullName; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE } }

      - name: Validate runtime architecture assets and identity
        shell: pwsh
        run: |
          python tools/validate_runtime_architecture.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/validate_asset_architecture.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/validate_version_identity.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/validate_launcher_assets.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Validate installer Go sources
        shell: pwsh
        run: |
          go test .\installer\main_v2.go .\installer\http_policy.go .\installer\main_v2_test.go
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go vet .\installer\main_v2.go .\installer\http_policy.go .\installer\main_v2_test.go
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Materialize exact tested Powerups facade checkpoint
        shell: pwsh
        run: |
          Remove-Item tools/materialize_powerups_facade.py -Force
          Remove-Item .github/workflows/tmp-powerups-facade.yml -Force
          git status --short
          git diff --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git config user.name "dicebound-architecture-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "arch: expose Powerups public facade"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $sha = git rev-parse HEAD
          Write-Host "POWERUPS_FACADE_COMMIT=$sha"
          git push origin "HEAD:arch/0.6.6.33-powerups-oracle"
