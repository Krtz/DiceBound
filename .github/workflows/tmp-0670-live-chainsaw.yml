name: Temporary 0.6.7.0 live chainsaw

on:
  push:
    branches:
      - refactor/0.6.7.0-monolith-chainsaw
    paths:
      - .github/workflows/tmp-0670-live-chainsaw.yml
      - tools/live_chainsaw_*.py
      - tools/bulk_0670_cleanup.py
      - tools/canonical_0670_wave*.py
      - tools/historical_score_wave*.py
      - tools/debug_log_owner_0670.py
      - tools/static_style_extract_0670.py
      - tools/artifact_owner_0670.py
      - tools/comment_cleanup_0670.py
      - tools/*oracle*.js
      - tools/*oracle*.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cut:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - name: Mint repository write token
        id: app_token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.DICEBOUND_RELEASE_APP_ID }}
          private-key: ${{ secrets.DICEBOUND_RELEASE_APP_PRIVATE_KEY }}
          owner: Krtz
          repositories: DiceBound
          permission-contents: write
      - name: Check out current chainsaw branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.app_token.outputs.token }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Cut live monolith
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m pip install --disable-pip-version-check tree-sitter tree-sitter-javascript
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/live_chainsaw_proxy_cleanup.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/live_chainsaw_progression_cleanup.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/live_chainsaw_ultimate_cleanup.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/live_chainsaw_wave1.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/bulk_0670_cleanup.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/live_chainsaw_item_icon_cleanup.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/canonical_0670_wave2.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/static_style_extract_0670.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/artifact_owner_0670.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (Select-String -Path runtime/js/dicebound.js -Pattern 'const showEndV15=showEnd|const handlePlayerDeathV16Base=handlePlayerDeath|const grantXpV15=grantXp|const loseGameV15=loseGame' -Quiet) {
            python tools/canonical_0670_wave3.py
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } else {
            Write-Host 'CANONICAL_0670_WAVE3 already canonical'
          }
          if (Select-String -Path runtime/js/dicebound.js -Pattern 'function v13NormalizeMeta' -Quiet) {
            python tools/canonical_0670_wave4.py
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } else {
            Write-Host 'CANONICAL_0670_WAVE4 already canonical'
          }
          if (Select-String -Path runtime/js/dicebound.js -Pattern 'function tileMeta' -Quiet) {
            python tools/canonical_0670_wave5.py
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } else {
            Write-Host 'CANONICAL_0670_WAVE5 already canonical'
          }
          python tools/canonical_0670_wave5b.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/canonical_0670_wave6.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/historical_score_wave7.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/debug_log_owner_0670.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/comment_cleanup_0670.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/live_chainsaw_whitespace_cleanup.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/live_chainsaw_update_guards.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/test_historical_layer_census.py --markdown docs/HISTORICAL_LAYER_CENSUS.md
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/test_monolith_chainsaw.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Refresh development runtime identity
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python tools/set_project_version.py --version 0.6.7.0 --channel Beta
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/refresh_runtime_manifest.py --version 0.6.7.0 --channel Beta --development-state Unreleased
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Syntax and architecture gates
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Get-ChildItem runtime/js -Recurse -Filter *.js | ForEach-Object { node --check $_.FullName; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE } }
          python tools/validate_runtime_architecture.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/validate_asset_architecture.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/validate_launcher_assets.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/validate_version_identity.py --version 0.6.7.0 --channel Beta
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Frozen behavior oracles
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Get-ChildItem tools -Filter *oracle*.js | ForEach-Object { node $_.FullName; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE } }
          Get-ChildItem tools -Filter *oracle*.py | ForEach-Object { python $_.FullName; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE } }
          git diff --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Commit live chainsaw wave
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name "dicebound-release-bot"
          git config user.email "dicebound-release-bot@users.noreply.github.com"
          git add runtime/js/dicebound.js runtime/js/board/registry.js runtime/js/combat/enemy-scaling-resolution.js runtime/js/module-manifest.json runtime/js/items/generation.js runtime/js/progression/lifecycle.js runtime/js/powerups/presentation.js runtime/css/extracted-monolith.css runtime/build-info.json runtime/build-manifest.json wrapper-source/config/project.json runtime/index.html runtime/js/version.js wrapper-source/wrappers/webview2/native-go/main.go tools/test_items_oracle.js tools/test_monolith_chainsaw.py tools/validate_runtime_architecture.py docs/HISTORICAL_LAYER_CENSUS.md
          git diff --cached --stat
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { throw 'Live chainsaw produced no source changes.' }
          git commit -m "refactor: canonicalize debug logging"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git push origin HEAD:refactor/0.6.7.0-monolith-chainsaw
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
