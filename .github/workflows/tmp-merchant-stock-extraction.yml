name: Temporary Merchant stock extraction

on:
  push:
    branches:
      - arch/0.6.6.24-merchant-stock-resolution
    paths:
      - tools/tmp_apply_merchant_stock_extraction.py
      - .github/workflows/tmp-merchant-stock-extraction.yml

permissions:
  contents: read

jobs:
  apply:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply extraction transform
        shell: pwsh
        run: |
          python tools/tmp_apply_merchant_stock_extraction.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -c 'from pathlib import Path; p=Path("tools/test_merchant_stock_extraction_boundary.py"); lines=p.read_text(encoding="utf-8").splitlines(); p.write_text("\n".join(("    assert js.count(f\"function {name}(\") == 1, f\"expected one thin {name} adapter\"" if "assert len(re.findall" in line else line) for line in lines)+"\n",encoding="utf-8")'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -c 'from pathlib import Path; p=Path("runtime/js/dicebound.js"); lines=p.read_text(encoding="utf-8").splitlines(); p.write_text("\n".join(line.rstrip(" \t") for line in lines)+"\n",encoding="utf-8")'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Focused validation
        shell: pwsh
        run: |
          node --check runtime/js/events/merchant-stock.js
          node --check runtime/js/dicebound.js
          python tools/test_merchant_stock_extraction_boundary.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/test_merchant_stock_resolution_browser.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Stage validated files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force validated/runtime/js/events | Out-Null
          New-Item -ItemType Directory -Force validated/runtime/js | Out-Null
          New-Item -ItemType Directory -Force validated/tools/fixtures | Out-Null
          New-Item -ItemType Directory -Force validated/tools | Out-Null
          Copy-Item runtime/js/dicebound.js validated/runtime/js/dicebound.js
          Copy-Item runtime/js/events/merchant-stock.js validated/runtime/js/events/merchant-stock.js
          Copy-Item runtime/js/module-manifest.json validated/runtime/js/module-manifest.json
          Copy-Item runtime/index.html validated/runtime/index.html
          Copy-Item tools/fixtures/merchant_stock_0_6_6_23.json validated/tools/fixtures/merchant_stock_0_6_6_23.json
          Copy-Item tools/test_merchant_stock_extraction_boundary.py validated/tools/test_merchant_stock_extraction_boundary.py
          Copy-Item tools/test_merchant_stock_resolution_browser.js validated/tools/test_merchant_stock_resolution_browser.js
      - name: Upload validated extraction
        uses: actions/upload-artifact@v4
        with:
          name: merchant-stock-extraction-validated
          path: validated
          if-no-files-found: error
          retention-days: 7
