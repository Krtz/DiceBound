name: Temporary Merchant stock extraction

on:
  push:
    branches:
      - arch/0.6.6.24-merchant-stock-resolution
    paths:
      - tools/tmp_apply_merchant_stock_extraction.py
      - .github/workflows/tmp-merchant-stock-extraction.yml

permissions:
  contents: read

jobs:
  apply:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply extraction transform
        shell: pwsh
        run: |
          python tools/tmp_apply_merchant_stock_extraction.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -c 'from pathlib import Path; p=Path("tools/test_merchant_stock_extraction_boundary.py"); lines=p.read_text(encoding="utf-8").splitlines(); p.write_text("\n".join(("    assert js.count(f\"function {name}(\") == 1, f\"expected one thin {name} adapter\"" if "assert len(re.findall" in line else line) for line in lines)+"\n",encoding="utf-8")'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -c 'from pathlib import Path; p=Path("runtime/js/dicebound.js"); lines=p.read_text(encoding="utf-8").splitlines(); p.write_text("\n".join(line.rstrip(" \t") for line in lines)+"\n",encoding="utf-8")'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Focused validation
        shell: pwsh
        run: |
          node --check runtime/js/events/merchant-stock.js
          node --check runtime/js/dicebound.js
          python tools/test_merchant_stock_extraction_boundary.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/test_merchant_stock_resolution_browser.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Mint release app token
        id: release_app_token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.DICEBOUND_RELEASE_APP_ID }}
          private-key: ${{ secrets.DICEBOUND_RELEASE_APP_PRIVATE_KEY }}
          owner: Krtz
          repositories: DiceBound
          permission-contents: write
      - name: Commit validated extraction
        shell: pwsh
        env:
          APP_TOKEN: ${{ steps.release_app_token.outputs.token }}
        run: |
          Remove-Item tools/tmp_apply_merchant_stock_extraction.py -Force
          Remove-Item .github/workflows/tmp-merchant-stock-extraction.yml -Force
          Remove-Item .github/workflows/tmp-merchant-stock-probe.yml -Force
          git config user.name "DiceBound Release App"
          git config user.email "release-app@users.noreply.github.com"
          git add -A
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { throw "Extraction transform produced no committed changes." }
          git commit -m "Beta 0.6.6.24: wire Merchant stock owner and retire legacy ladder"
          git config --local --unset-all http.https://github.com/.extraheader
          git remote set-url origin "https://x-access-token:$env:APP_TOKEN@github.com/Krtz/DiceBound.git"
          git push origin HEAD:arch/0.6.6.24-merchant-stock-resolution
