name: Runtime boundary cleanup materializer

on:
  push:
    branches:
      - arch/0.6.6.35-runtime-oracle
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize-runtime-boundary:
    runs-on: windows-2022
    timeout-minutes: 55
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.7'
          cache: false

      - name: Materialize Runtime boundary cleanup
        shell: pwsh
        run: |
          python tools/materialize_runtime_boundary_cleanup.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          @'
          from pathlib import Path
          import json

          p=Path('tools/test_runtime_peer_boundaries.js')
          s=p.read_text(encoding='utf-8')
          old='const focusedIds=new Set([...peerIds,"runtime-facade","dicebound-monolith"]);'
          new='const focusedIds=new Set([...peerIds,"native-http-host","wrapper-contract","runtime-facade","dicebound-monolith"]);'
          if old not in s: raise SystemExit('Runtime peer-boundary focused-internal anchor drifted')
          p.write_text(s.replace(old,new,1),encoding='utf-8')

          manifest_path=Path('runtime/js/module-manifest.json')
          manifest=json.loads(manifest_path.read_text(encoding='utf-8'))
          mods={m['id']:m for m in manifest['modules']}
          for module_id in ('run-lifecycle','run-completion'):
              reqs=mods[module_id].setdefault('requires',[])
              if 'runtime-facade' not in reqs: reqs.insert(0,'runtime-facade')
          manifest_path.write_text(json.dumps(manifest,indent=2)+'\n',encoding='utf-8')

          validator=Path('tools/validate_runtime_architecture.py')
          v=validator.read_text(encoding='utf-8')
          replacements={
            '{"run-checkpoint", "board-generation", "board-transition"}':'{"runtime-facade", "board-generation", "board-transition"}',
            'run-lifecycle must provide DiceboundRunLifecycle, require checkpoint/generation/transition, and load before the monolith':'run-lifecycle must provide DiceboundRunLifecycle, require Runtime facade/generation/transition, and load before the monolith',
            '{"run-checkpoint", "run-lifecycle", "board-transition"}':'{"runtime-facade", "run-lifecycle", "board-transition"}',
            'run-completion must provide DiceboundRunCompletion, require checkpoint/lifecycle/transition, and load before the monolith':'run-completion must provide DiceboundRunCompletion, require Runtime facade/lifecycle/transition, and load before the monolith',
          }
          for old,new in replacements.items():
              if v.count(old)!=1: raise SystemExit(f'Runtime architecture Run dependency anchor drifted: {old}')
              v=v.replace(old,new,1)
          validator.write_text(v,encoding='utf-8')
          '@ | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/refresh_runtime_manifest.py --version 0.6.6.34 --channel Beta --development-state Unreleased --notes "Runtime/Core/Persistence facade development for Beta 0.6.6.35."
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --exit-code 7ee569a3fe7068569af65ffe6da339b00d922828 -- tools/test_runtime_oracle.js
          if ($LASTEXITCODE -ne 0) { Write-Error "Released Runtime characterization changed during boundary cleanup"; exit $LASTEXITCODE }

      - name: Focused Runtime boundary gate
        shell: pwsh
        run: |
          node tools/test_runtime_peer_boundaries.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/test_runtime_facade.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/test_runtime_oracle.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/test_core_state.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/test_class_unlock_feedback.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/test_run_lifecycle.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/test_run_completion.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/test_powerup_services.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/test_progression_owner.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Complete repository gate
        shell: pwsh
        run: |
          Get-ChildItem runtime/js -Recurse -Filter *.js | ForEach-Object { node --check $_.FullName; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE } }
          Get-ChildItem tools -Filter test_*.js | Sort-Object Name | ForEach-Object { node $_.FullName; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE } }
          Get-ChildItem tools -Filter test_*.py | Sort-Object Name | ForEach-Object { python $_.FullName; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE } }
          python tools/validate_runtime_architecture.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/validate_asset_architecture.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/validate_launcher_assets.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/validate_version_identity.py --version 0.6.6.34 --channel Beta
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go test .\installer\main_v2.go .\installer\http_policy.go .\installer\main_v2_test.go
          if ($LASTEXITCODE -eq 0) { go vet .\installer\main_v2.go .\installer\http_policy.go .\installer\main_v2_test.go }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Materialize exact tested commit
        shell: pwsh
        run: |
          Remove-Item tools/materialize_runtime_boundary_cleanup.py
          Remove-Item .github/workflows/runtime-boundary-cleanup-materialize.yml
          Remove-Item .github/workflows/tmp-runtime-consumer-audit.yml
          git config user.name "dicebound-architecture-bot"
          git config user.email "dicebound-architecture-bot@users.noreply.github.com"
          git add -A
          git commit -m "architecture: drain Runtime implementation peers from ordinary modules"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $sha = git rev-parse HEAD
          Write-Host "RUNTIME_BOUNDARY_COMMIT=$sha"
          git push origin HEAD:refs/heads/arch/0.6.6.35-runtime-oracle
