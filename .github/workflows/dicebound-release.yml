name: DiceBound validation and release

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    paths-ignore:
      - distribution/latest.json
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish this committed Version/Channel as a prerelease and update latest.json"
        required: true
        type: boolean
        default: false

permissions:
  contents: write

env:
  WEBVIEW2_SDK_VERSION: "1.0.4129.50"

jobs:
  build-and-release:
    runs-on: windows-2022
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.7"

      - name: Resolve authoritative release identity
        id: release
        shell: pwsh
        run: |
          python tools/prepare_release.py `
            --output-dir wrapper-source/release/generated `
            --github-output $env:GITHUB_OUTPUT
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Require protected-main release credential
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish))
        shell: pwsh
        env:
          DICEBOUND_RELEASE_TOKEN: ${{ secrets.DICEBOUND_RELEASE_TOKEN }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:DICEBOUND_RELEASE_TOKEN)) {
            throw "DICEBOUND_RELEASE_TOKEN is required to advance distribution/latest.json on protected main."
          }

      - name: Verify protected-main release credential access
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish))
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.DICEBOUND_RELEASE_TOKEN }}
        run: |
          gh api user *> $null
          if ($LASTEXITCODE -ne 0) {
            throw "DICEBOUND_RELEASE_TOKEN authentication failed. Replace it with a fine-grained PAT owned by Krtz."
          }

          gh api repos/Krtz/DiceBound *> $null
          if ($LASTEXITCODE -ne 0) {
            throw "DICEBOUND_RELEASE_TOKEN cannot access Krtz/DiceBound. Check fine-grained PAT resource owner and repository selection."
          }

          gh api "repos/Krtz/DiceBound/contents/distribution/latest.json?ref=main" *> $null
          if ($LASTEXITCODE -ne 0) {
            throw "DICEBOUND_RELEASE_TOKEN cannot read distribution/latest.json. Check fine-grained PAT Contents read/write permission."
          }

      - name: Enforce unique four-component PR version
        if: github.event_name == 'pull_request'
        shell: pwsh
        run: |
          python tools/validate_pr_version.py --base-ref "origin/${{ github.base_ref }}"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Stage official WebView2 loader
        shell: pwsh
        run: |
          $probe = Join-Path $env:RUNNER_TEMP "dicebound-webview2-sdk"
          dotnet new classlib -n LoaderProbe -o $probe --force | Out-Host
          dotnet add (Join-Path $probe "LoaderProbe.csproj") package Microsoft.Web.WebView2 --version $env:WEBVIEW2_SDK_VERSION | Out-Host
          if ($LASTEXITCODE -ne 0) { throw "Could not restore Microsoft.Web.WebView2." }

          $package = Get-Item (Join-Path $env:USERPROFILE ".nuget\packages\microsoft.web.webview2\$env:WEBVIEW2_SDK_VERSION")
          $loader = Join-Path $package.FullName "build\native\x64\WebView2Loader.dll"
          if (-not (Test-Path $loader)) { throw "Official x64 WebView2Loader.dll was not found at $loader" }
          $sig = Get-AuthenticodeSignature $loader
          if ($sig.Status -ne "Valid") { throw "WebView2Loader.dll signature is not valid: $($sig.Status)" }
          "WEBVIEW2_LOADER_DLL=$loader" >> $env:GITHUB_ENV

      - name: Validate committed identity and source
        shell: pwsh
        run: |
          $version = "${{ steps.release.outputs.version }}"
          $channel = "${{ steps.release.outputs.channel }}"
          python tools/set_project_version.py --version $version --channel $channel
          python tools/refresh_runtime_manifest.py --version $version --channel $channel --development-state Unreleased
          python tools/validate_version_identity.py `
            --version $version `
            --channel $channel `
            --release-spec "${{ steps.release.outputs.spec_path }}" `
            --release-notes "${{ steps.release.outputs.notes_path }}"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          Get-ChildItem runtime/js -Recurse -Filter *.js | ForEach-Object { node --check $_.FullName; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE } }
          Get-ChildItem tools -Filter test_*.js | ForEach-Object { node $_.FullName; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE } }
          Get-ChildItem tools -Filter test_*.py | ForEach-Object { python $_.FullName; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE } }
          python tools/validate_runtime_architecture.py
          python tools/validate_asset_architecture.py
          python tools/validate_launcher_assets.py
          go test .\installer\main_v2.go .\installer\http_policy.go .\installer\main_v2_test.go
          if ($LASTEXITCODE -eq 0) { go vet .\installer\main_v2.go .\installer\http_policy.go .\installer\main_v2_test.go }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          git diff --quiet
          if ($LASTEXITCODE -ne 0) {
            git diff
            throw "Version identity or generated runtime metadata is not committed."
          }
          "RELEASE_SOURCE_SHA=$(git rev-parse HEAD)" >> $env:GITHUB_ENV

      - name: Build and validate native release
        shell: pwsh
        run: |
          .\Build-DiceBoundRelease.ps1 `
            -Version "${{ steps.release.outputs.version }}" `
            -Channel "${{ steps.release.outputs.channel }}" `
            -SkipSourceStamp `
            -RequireSignedLoader

      - name: Upload validation artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.release.outputs.artifact_label }}
          path: |
            wrapper-source/release/DiceBound.exe
            wrapper-source/release/release-metadata.json
            wrapper-source/release/generated/release-spec.json
            wrapper-source/release/generated/release-notes.md
            wrapper-source/dist/browser/build-info.json
            wrapper-source/dist/browser/build-manifest.json
          if-no-files-found: error
          retention-days: 14

      - name: Publish derived prerelease
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish))
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ steps.release.outputs.tag }}"
          $title = "${{ steps.release.outputs.title }}"
          $notes = "${{ steps.release.outputs.notes_path }}"
          $asset = ".\wrapper-source\release\DiceBound.exe"

          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release edit $tag --title $title --notes-file $notes --prerelease
            gh release upload $tag $asset --clobber
          } else {
            gh release create $tag $asset --target "$env:RELEASE_SOURCE_SHA" --title $title --notes-file $notes --prerelease
          }

          $meta = Get-Content .\wrapper-source\release\release-metadata.json -Raw | ConvertFrom-Json
          $release = gh release view $tag --json assets | ConvertFrom-Json
          $published = $release.assets | Where-Object { $_.name -eq "DiceBound.exe" } | Select-Object -First 1
          if ($null -eq $published) { throw "Published release does not contain DiceBound.exe." }
          if ([int64]$published.size -ne [int64]$meta.bytes) { throw "Published release asset size differs from built EXE." }

      - name: Point launcher manifest at verified release
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish))
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.DICEBOUND_RELEASE_TOKEN }}
        run: |
          python tools/write_distribution_manifest.py `
            --release-metadata wrapper-source/release/release-metadata.json `
            --output distribution/latest.json `
            --repository Krtz/DiceBound
          python tools/validate_version_identity.py `
            --version "${{ steps.release.outputs.version }}" `
            --channel "${{ steps.release.outputs.channel }}" `
            --release-spec "${{ steps.release.outputs.spec_path }}" `
            --release-notes "${{ steps.release.outputs.notes_path }}" `
            --release-metadata wrapper-source/release/release-metadata.json `
            --distribution distribution/latest.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $manifestPath = "distribution/latest.json"
          $current = gh api "repos/Krtz/DiceBound/contents/$manifestPath?ref=main" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $encoded = [Convert]::ToBase64String([IO.File]::ReadAllBytes((Resolve-Path $manifestPath)))
          $payload = @{
            message = "distribution: point launcher at ${{ steps.release.outputs.version }}"
            content = $encoded
            sha = $current.sha
            branch = "main"
          } | ConvertTo-Json -Compress
          $payload | gh api --method PUT "repos/Krtz/DiceBound/contents/$manifestPath" --input - *> $null
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $remote = gh api "repos/Krtz/DiceBound/contents/$manifestPath?ref=main" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $remoteText = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String(($remote.content -replace '\s', '')))
          $localText = Get-Content $manifestPath -Raw
          if ($remoteText -ne $localText) {
            throw "Published distribution/latest.json differs from the verified local manifest."
          }
