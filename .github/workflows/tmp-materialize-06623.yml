name: Temporary 0.6.6.23 release materializer

on:
  push:
    branches:
      - arch/0.6.6.23-merchant-ui
    paths:
      - .github/workflows/tmp-materialize-06623.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Materialize and validate release metadata
        shell: pwsh
        run: |
          python tools/tmp_materialize_06623.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check runtime/js/ui/merchant.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/test_merchant_transaction.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/test_merchant_ui_extraction_boundary.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/test_shadow_ownership_drain.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/validate_runtime_architecture.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/test_merchant_browser.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Commit materialized candidate
        shell: pwsh
        run: |
          git status --short
          git config user.name "dicebound-materializer"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Beta 0.6.6.23: materialize Merchant UI release candidate"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git push origin HEAD:arch/0.6.6.23-merchant-ui
