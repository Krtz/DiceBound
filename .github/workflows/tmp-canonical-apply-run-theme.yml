name: Temporary canonical run-theme materializer

on:
  push:
    branches:
      - refactor/0.6.6.38-canonical-functions
    paths:
      - .github/workflows/tmp-canonical-apply-run-theme.yml

permissions:
  contents: read

jobs:
  canonicalize:
    runs-on: windows-latest
    steps:
      - name: Mint repository App token
        id: app
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.DICEBOUND_RELEASE_APP_ID }}
          private-key: ${{ secrets.DICEBOUND_RELEASE_APP_PRIVATE_KEY }}
          owner: Krtz
          repositories: DiceBound
          permission-contents: write
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.app.outputs.token }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Collapse applyRunTheme history and validate source
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          @'
          from pathlib import Path
          import re

          root=Path.cwd()
          p=root/'runtime/js/dicebound.js'
          text=p.read_text(encoding='utf-8')

          canonical='''  function applyRunTheme(){
            const themeByBoard={
              1:{bg1:"#071b0d",bg2:"#031008",glow1:"rgba(82,220,118,.24)",glow2:"rgba(175,255,116,.11)",board1:"#173c20",board2:"#0a2111"},
              2:{bg1:"#1c1708",bg2:"#0c0b05",glow1:"rgba(255,217,123,.23)",glow2:"rgba(137,193,255,.14)",board1:"#43371a",board2:"#1d1910"},
              3:{bg1:"#2a0709",bg2:"#120305",glow1:"rgba(255,67,76,.25)",glow2:"rgba(255,130,57,.12)",board1:"#5c171b",board2:"#2b090c"},
              4:{bg1:"#221109",bg2:"#0d0604",glow1:"rgba(255,118,62,.26)",glow2:"rgba(164,47,36,.16)",board1:"#4f2416",board2:"#20100a"},
              5:{bg1:"#140721",bg2:"#06020d",glow1:"rgba(189,98,255,.28)",glow2:"rgba(87,130,255,.16)",board1:"#351048",board2:"#13061d"},
              6:{bg1:"#03050d",bg2:"#000104",glow1:"rgba(71,92,255,.30)",glow2:"rgba(210,55,255,.17)",board1:"#111947",board2:"#070a1d"}
            };
            const rootStyle=document.documentElement.style,theme=themeByBoard[boardLevel]||themeByBoard[1],scene=window.DiceboundAssets?.resolveBoardBackground?.(boardLevel),sceneUrl=scene?.image?`url("${scene.image}")`:'none';
            for(const [key,value] of Object.entries(theme))rootStyle.setProperty(`--run-${key.replace(/([A-Z])/g,'-$1').toLowerCase()}`,value);
            rootStyle.setProperty("--run-scene-image",sceneUrl);
            rootStyle.setProperty("--run-scene-focus",scene?.focus||"50% 50%");
            const sceneEl=$("boardSceneBg");
            if(sceneEl){
              if(scene?.image&&sceneEl.getAttribute('src')!==scene.image)sceneEl.setAttribute('src',scene.image);
              sceneEl.style.objectPosition=scene?.focus||"50% 50%";
              sceneEl.dataset.board=String(boardLevel||1);
            }
            document.body?.setAttribute('data-board-level',String(boardLevel||1));
            dbBeta01SyncDifficultyAtmosphere();
            beta04SyncWorldScene();
          }'''

          base_pattern=re.compile(r'  function applyRunTheme\(\)\{const themes=.*?\}\n\n  function openInfo\(\)',re.S)
          text,n=base_pattern.subn(canonical+'\n\n  function openInfo()',text,count=1)
          if n!=1: raise SystemExit(f'expected one base applyRunTheme, replaced {n}')

          v19_pattern=re.compile(r'''  // ---- Board 6 -------------------------------------------------------------\n  const applyRunThemeV19Base=applyRunTheme;\n  applyRunTheme=function\(\)\{.*?\n  \};\n\n  // Sixth-road merchant:''',re.S)
          text,n=v19_pattern.subn('  // ---- Board 6 -------------------------------------------------------------\n\n  // Sixth-road merchant:',text,count=1)
          if n!=1: raise SystemExit(f'expected one v19 applyRunTheme layer, removed {n}')

          beta01='''  const applyRunThemeBeta01Base=applyRunTheme;\n  applyRunTheme=function(){const out=applyRunThemeBeta01Base();dbBeta01SyncDifficultyAtmosphere();return out;};\n'''
          if text.count(beta01)!=1: raise SystemExit(f'expected one Beta01 theme layer, found {text.count(beta01)}')
          text=text.replace(beta01,'',1)

          beta04='''  const applyRunThemeBeta04Base=applyRunTheme;\n  applyRunTheme=function(){const r=applyRunThemeBeta04Base();beta04SyncWorldScene();return r;};\n'''
          if text.count(beta04)!=1: raise SystemExit(f'expected one Beta04 theme layer, found {text.count(beta04)}')
          text=text.replace(beta04,'',1)
          p.write_text(text,encoding='utf-8',newline='\n')

          test=root/'tools/test_canonical_apply_run_theme.py'
          test.write_text(r'''from pathlib import Path
          import re

          ROOT=Path(__file__).resolve().parents[1]
          SOURCE=(ROOT/'runtime/js/dicebound.js').read_text(encoding='utf-8')

          if len(re.findall(r'\bfunction\s+applyRunTheme\s*\(',SOURCE))!=1:
              raise SystemExit('applyRunTheme must have exactly one canonical declaration')
          if re.search(r'\bapplyRunTheme\s*=\s*function\b',SOURCE):
              raise SystemExit('historical applyRunTheme replacement returned')
          if re.search(r'\b(?:const|let|var)\s+[A-Za-z_$][\w$]*\s*=\s*applyRunTheme\s*;',SOURCE):
              raise SystemExit('historical applyRunTheme predecessor capture returned')
          for alias in ('applyRunThemeV19Base','applyRunThemeBeta01Base','applyRunThemeBeta04Base'):
              if re.search(rf'\b{alias}\b',SOURCE):
                  raise SystemExit(f'retired run-theme alias returned: {alias}')

          start=SOURCE.find('function applyRunTheme()')
          end=SOURCE.find('function openInfo()',start)
          if start<0 or end<0:
              raise SystemExit('could not isolate canonical applyRunTheme region')
          body=SOURCE[start:end]

          expected={
              1:("#071b0d","#031008","rgba(82,220,118,.24)","rgba(175,255,116,.11)","#173c20","#0a2111"),
              2:("#1c1708","#0c0b05","rgba(255,217,123,.23)","rgba(137,193,255,.14)","#43371a","#1d1910"),
              3:("#2a0709","#120305","rgba(255,67,76,.25)","rgba(255,130,57,.12)","#5c171b","#2b090c"),
              4:("#221109","#0d0604","rgba(255,118,62,.26)","rgba(164,47,36,.16)","#4f2416","#20100a"),
              5:("#140721","#06020d","rgba(189,98,255,.28)","rgba(87,130,255,.16)","#351048","#13061d"),
              6:("#03050d","#000104","rgba(71,92,255,.30)","rgba(210,55,255,.17)","#111947","#070a1d"),
          }
          for board,values in expected.items():
              anchor=f'{board}:{{bg1:"{values[0]}",bg2:"{values[1]}",glow1:"{values[2]}",glow2:"{values[3]}",board1:"{values[4]}",board2:"{values[5]}"}}'
              if anchor not in body:
                  raise SystemExit(f'Board {board} released theme values changed')

          anchors=[
              'rootStyle.setProperty(`--run-${key.replace',
              'rootStyle.setProperty("--run-scene-image",sceneUrl)',
              'rootStyle.setProperty("--run-scene-focus",scene?.focus||"50% 50%")',
              'const sceneEl=$("boardSceneBg")',
              "document.body?.setAttribute('data-board-level',String(boardLevel||1))",
              'dbBeta01SyncDifficultyAtmosphere();',
              'beta04SyncWorldScene();',
          ]
          positions=[]
          for anchor in anchors:
              pos=body.find(anchor)
              if pos<0: raise SystemExit('canonical applyRunTheme missing released behavior: '+anchor)
              positions.append(pos)
          if positions!=sorted(positions):
              raise SystemExit('canonical applyRunTheme composition order changed')

          for fragment in (
              "function dbBeta01SyncDifficultyAtmosphere()",
              "document.body?.setAttribute('data-run-mode',mode)",
              "function beta04SyncWorldScene()",
              "document.getElementById('worldSceneLayer')",
              "layer.style.backgroundImage=sceneUrl",
              "document.body?.setAttribute('data-world-board',String(level))",
              "setTimeout(beta04SyncWorldScene,0)",
          ):
              if fragment not in SOURCE:
                  raise SystemExit('run-theme companion behavior missing: '+fragment)

          print('Canonical applyRunTheme PASS: four generations collapsed to one; Boards 1-6, scene sync and difficulty/world atmosphere preserved')
          '''.replace('\n          ','\n').lstrip(),encoding='utf-8',newline='\n')
          '@ | Set-Content -Encoding UTF8 .tmp_canonical_theme.py
          python .tmp_canonical_theme.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Remove-Item .tmp_canonical_theme.py

          python tools/test_canonical_apply_run_theme.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/test_canonical_debug_action.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/test_canonical_debug_ui.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/test_canonical_tile_meta.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/test_historical_layer_census.py --markdown docs/HISTORICAL_LAYER_CENSUS.md
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check runtime/js/dicebound.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/validate_runtime_architecture.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/validate_version_identity.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Commit canonical run theme and remove one-shot workflow
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Remove-Item .github/workflows/tmp-canonical-apply-run-theme.yml
          git config user.name "dicebound-manifest-publisher[bot]"
          git config user.email "323488390+dicebound-manifest-publisher[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: canonicalize run theme composition"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git push origin HEAD:refactor/0.6.6.38-canonical-functions
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
