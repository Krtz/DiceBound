name: Runtime release metadata reconcile

on:
  push:
    branches:
      - arch/0.6.6.35-runtime-oracle
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reconcile-runtime-metadata:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Reconcile generated metadata exactly as official release gate
        shell: pwsh
        run: |
          python tools/set_project_version.py --version 0.6.6.35 --channel Beta
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/refresh_runtime_manifest.py --version 0.6.6.35 --channel Beta --development-state Unreleased
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/validate_version_identity.py --version 0.6.6.35 --channel Beta
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/test_runtime_peer_boundaries.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/test_runtime_facade.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/test_runtime_oracle.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/validate_runtime_architecture.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Materialize exact reconciled commit
        shell: pwsh
        run: |
          Remove-Item .github/workflows/runtime-metadata-reconcile.yml
          git config user.name "dicebound-architecture-bot"
          git config user.email "dicebound-architecture-bot@users.noreply.github.com"
          git add -A
          git commit -m "release: reconcile Beta 0.6.6.35 generated metadata"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $sha = git rev-parse HEAD
          Write-Host "RUNTIME_METADATA_COMMIT=$sha"
          git push origin HEAD:refs/heads/arch/0.6.6.35-runtime-oracle
