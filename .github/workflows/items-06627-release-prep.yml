name: Items 0.6.6.27 Release Prep

on:
  push:
    branches:
      - arch/0.6.6.27-items-oracle

permissions:
  contents: write

jobs:
  prepare-and-validate:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Stage Beta 0.6.6.27 identity and notes
        shell: pwsh
        run: |
          python tools/prepare_items_06627_release.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/set_project_version.py --version 0.6.6.27 --channel Beta
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/refresh_runtime_manifest.py --version 0.6.6.27 --channel Beta --development-state Unreleased
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          @'
          from pathlib import Path
          for name in ('CHANGELOG.md','runtime/PATCH_NOTES.md','runtime/index.html','runtime/js/version.js','runtime/build-info.json','runtime/build-manifest.json','wrapper-source/config/project.json','wrapper-source/wrappers/webview2/native-go/main.go'):
              p=Path(name); p.write_text(p.read_text(encoding='utf-8'),encoding='utf-8',newline='\n')
          '@ | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/prepare_release.py --output-dir wrapper-source/release/generated
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Validate Beta 0.6.6.27 candidate
        shell: pwsh
        run: |
          python tools/validate_version_identity.py --version 0.6.6.27 --channel Beta --release-spec wrapper-source/release/generated/release-spec.json --release-notes wrapper-source/release/generated/release-notes.md
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/test_items_operations_owner.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/test_items_generation_owner.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/test_items_facade.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/test_items_oracle.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/test_merchant_stock_resolution_browser.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/test_merchant_transaction.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/test_player_initialization.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/test_mana_action_resolution.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/test_effective_stats.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/test_equipment_heirloom_ui.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/validate_runtime_architecture.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/validate_asset_architecture.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/validate_launcher_assets.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/test_runtime_manifest_hash.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Materialize clean validated candidate
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/materialize_items_06627_release.py
