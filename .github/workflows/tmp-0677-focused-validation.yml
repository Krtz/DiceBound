name: Temporary 0.6.7.7 materialize and validate
on:
  push:
    branches:
      - feature/0.6.7.7-luck-combat-feel

permissions:
  contents: write

jobs:
  materialize:
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Materialize 0.6.7.7 identity
        shell: pwsh
        run: |
          python tools/set_project_version.py --version 0.6.7.7 --channel Beta
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/refresh_runtime_manifest.py --version 0.6.7.7 --channel Beta --development-state Unreleased
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/prepare_release.py --version 0.6.7.7 --channel Beta
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/validate_version_identity.py --version 0.6.7.7 --channel Beta --release-spec wrapper-source/release/generated/release-spec.json --release-notes wrapper-source/release/generated/release-notes.md
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Complete source validation
        shell: pwsh
        run: |
          Get-ChildItem runtime/js -Recurse -Filter *.js | ForEach-Object {
            node --check $_.FullName
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          Get-ChildItem tools -Filter test_*.js | ForEach-Object {
            Write-Host "=== $($_.Name) ==="
            node $_.FullName
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          Get-ChildItem tools -Filter test_*.py | ForEach-Object {
            Write-Host "=== $($_.Name) ==="
            python $_.FullName
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Architecture assets and version
        shell: pwsh
        run: |
          python tools/validate_runtime_architecture.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/validate_asset_architecture.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/validate_launcher_assets.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/validate_version_identity.py --version 0.6.7.7 --channel Beta --release-spec wrapper-source/release/generated/release-spec.json --release-notes wrapper-source/release/generated/release-notes.md

      - name: Create materialized commit object
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $paths = @(
            'runtime/index.html',
            'runtime/js/version.js',
            'runtime/build-info.json',
            'runtime/build-manifest.json',
            'wrapper-source/config/project.json',
            'wrapper-source/wrappers/webview2/native-go/main.go',
            'wrapper-source/release/generated/release-spec.json',
            'wrapper-source/release/generated/release-notes.md'
          )
          git add -- $paths
          $changed = @(git diff --cached --name-only)
          if (-not $changed.Count) {
            Write-Host 'MATERIALIZED_COMMIT=ALREADY_MATERIALIZED'
            exit 0
          }
          $entries = @()
          foreach ($path in $changed) {
            $bytes = [IO.File]::ReadAllBytes((Resolve-Path $path))
            $body = @{ content = [Convert]::ToBase64String($bytes); encoding = 'base64' } | ConvertTo-Json -Compress
            $blob = $body | gh api repos/${{ github.repository }}/git/blobs --method POST --input - | ConvertFrom-Json
            $mode = ((git ls-files -s -- $path) -split '\s+')[0]
            if (-not $mode) { $mode = '100644' }
            $entries += @{ path = $path; mode = $mode; type = 'blob'; sha = $blob.sha }
          }
          $baseTree = git rev-parse HEAD^{tree}
          $treeBody = @{ base_tree = $baseTree; tree = $entries } | ConvertTo-Json -Depth 8 -Compress
          $tree = $treeBody | gh api repos/${{ github.repository }}/git/trees --method POST --input - | ConvertFrom-Json
          $commitBody = @{ message = '0.6.7.7: materialize release identity'; tree = $tree.sha; parents = @('${{ github.sha }}') } | ConvertTo-Json -Depth 6 -Compress
          $commit = $commitBody | gh api repos/${{ github.repository }}/git/commits --method POST --input - | ConvertFrom-Json
          Write-Host "MATERIALIZED_COMMIT=$($commit.sha)"
