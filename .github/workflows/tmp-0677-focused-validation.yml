name: Temporary 0.6.7.7 full source validation
on:
  push:
    branches:
      - feature/0.6.7.7-luck-combat-feel
jobs:
  full-source:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax
        shell: pwsh
        run: |
          Get-ChildItem runtime/js -Recurse -Filter *.js | ForEach-Object {
            node --check $_.FullName
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Complete JavaScript suite
        shell: pwsh
        run: |
          Get-ChildItem tools -Filter test_*.js | ForEach-Object {
            Write-Host "=== $($_.Name) ==="
            node $_.FullName
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Complete Python suite
        shell: pwsh
        run: |
          Get-ChildItem tools -Filter test_*.py | ForEach-Object {
            Write-Host "=== $($_.Name) ==="
            python $_.FullName
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Architecture and assets
        shell: pwsh
        run: |
          python tools/validate_runtime_architecture.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/validate_asset_architecture.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/validate_launcher_assets.py
