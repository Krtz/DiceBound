name: Materialize progressed-save Info hotfix

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  materialize:
    if: github.head_ref == 'fix/merchant-tile-visit-state'
    runs-on: windows-2022
    steps:
      - name: Mint DiceBound release App token
        id: release_app
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.DICEBOUND_RELEASE_APP_ID }}
          private-key: ${{ secrets.DICEBOUND_RELEASE_APP_PRIVATE_KEY }}
          owner: Krtz
          repositories: DiceBound
          permission-contents: write
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          token: ${{ steps.release_app.outputs.token }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Update notes and runtime manifest
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          patch = Path('runtime/PATCH_NOTES.md')
          text = patch.read_text(encoding='utf-8')
          text = text.replace('## Beta 0.6.6.18 Merchant tile hotfix (#306)', '## Beta 0.6.6.18 Merchant and Info hotfixes (#306)', 1)
          old = '- Added deterministic transaction coverage plus a real Windows Edge Merchant-arrival regression that renders gear comparison, commits a purchase and rejects road-recovery exceptions.\n'
          new = '- Fixed the Roadkeeper\'s Guide failing to open on progressed saves with Invoker unlocked. The Formula Codex uppercased recipe letters before looking them up in the lowercase colour map, so Guide rendering threw before the overlay could become visible.\n- Added deterministic transaction coverage plus real Windows Edge regressions for Merchant arrival and Info controls, including direct `file://` branch testing with a progressed all-classes profile.\n'
          if old in text:
              text = text.replace(old, new, 1)
          elif 'Formula Codex uppercased recipe letters' not in text:
              raise SystemExit('PATCH_NOTES Merchant regression line missing')
          patch.write_text(text, encoding='utf-8')

          changelog = Path('CHANGELOG.md')
          text = changelog.read_text(encoding='utf-8')
          text = text.replace('### Merchant tile hotfix (#306)', '### Merchant and Info hotfixes (#306)', 1)
          old = '- Added a real Edge regression covering Merchant arrival, generated gear comparison, an actual purchase and absence of tile-error recovery.\n'
          new = '- Fixed the Roadkeeper\'s Guide failing to open for progressed profiles with Invoker unlocked: the Formula Codex converted recipe keys to uppercase before indexing its lowercase colour map.\n- Added real Edge regressions covering Merchant arrival plus Camp/Road Info controls from both HTTP and direct local-file runtime paths, including a progressed all-classes profile.\n'
          if old in text:
              text = text.replace(old, new, 1)
          elif 'Formula Codex converted recipe keys to uppercase' not in text:
              raise SystemExit('CHANGELOG Merchant regression line missing')
          changelog.write_text(text, encoding='utf-8')
          '@ | Set-Content -Encoding utf8 .\materialize_info_hotfix.py
          python .\materialize_info_hotfix.py
          Remove-Item .\materialize_info_hotfix.py
          python tools/refresh_runtime_manifest.py --version 0.6.6.18 --channel Beta --development-state Unreleased
      - name: Commit materialized Info hotfix
        shell: pwsh
        run: |
          git config user.name "dicebound-release-bot"
          git config user.email "actions@users.noreply.github.com"
          git add CHANGELOG.md runtime/PATCH_NOTES.md runtime/build-info.json runtime/build-manifest.json
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { exit 0 }
          git commit -m "Materialize Beta 0.6.6.18 progressed-save Info hotfix"
          git push origin HEAD:${{ github.head_ref }}
