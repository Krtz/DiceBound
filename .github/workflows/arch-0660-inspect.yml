name: 0.6.6.0 combat extraction materializer

on:
  push:
    branches:
      - arch/0.6.6.0-combat-turn-resolution
    paths:
      - .github/workflows/arch-0660-inspect.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Repair one-shot materializer and permanent proof markers
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          materializer=Path('tools/materialize_0660.py')
          t=materializer.read_text(encoding='utf-8')
          stale_anchor='anchor=\'print("Monolith spring-clean guard PASS: DB235/Career harness and retired patch sediment stay deleted")\''
          current_anchor='anchor="print(\'Monolith spring-clean guard PASS\')"'
          if stale_anchor not in t:
              raise SystemExit('expected stale materializer shadow-guard anchor was not found')
          t=t.replace(stale_anchor,current_anchor,1)
          stale_guard='assert "dbCombatTurns=window.DiceboundCombatTurnResolution.configure({" in monolith, "combat turn owner is not configured by the compatibility composition root"'
          current_guard='assert "dbCombatTurns=dbCombatTurnOwner.configure({" in monolith, "combat turn owner is not configured by the compatibility composition root"'
          if stale_guard not in t:
              raise SystemExit('expected stale materializer composition guard was not found')
          materializer.write_text(t.replace(stale_guard,current_guard,1),encoding='utf-8')

          test=Path('tools/test_combat_turn_resolution.js')
          s=test.read_text(encoding='utf-8')
          stale='  "dbCombatTurns=window.DiceboundCombatTurnResolution.configure({"\n'
          current='  "const dbCombatTurnOwner=window.DiceboundCombatTurnResolution;",\n  "dbCombatTurns=dbCombatTurnOwner.configure({"\n'
          if stale not in s:
              raise SystemExit('expected stale Node composition marker was not found')
          test.write_text(s.replace(stale,current,1),encoding='utf-8')
          PY
      - name: Materialize authoritative turn owner
        run: python tools/materialize_0660.py
      - name: Stamp Beta 0.6.6.0 and refresh runtime metadata
        run: |
          python tools/set_project_version.py --version 0.6.6.0 --channel Beta
          python tools/refresh_runtime_manifest.py --version 0.6.6.0 --channel Beta --development-state Unreleased
      - name: Focused syntax and architecture proof
        run: |
          node --check runtime/js/combat/turn-resolution.js
          node --check runtime/js/dicebound.js
          node tools/test_combat_turn_resolution.js
          python tools/test_shadow_ownership_drain.py
          python tools/test_06520_monolith_census.py
          python tools/validate_runtime_architecture.py
          python tools/validate_asset_architecture.py
          python tools/validate_launcher_assets.py
          git diff --check
      - name: Full source regression suite
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do node "$file"; done < <(find tools -maxdepth 1 -name 'test_*.js' -print0 | sort -z)
          while IFS= read -r -d '' file; do python "$file"; done < <(find tools -maxdepth 1 -name 'test_*.py' -print0 | sort -z)
      - name: Report extraction census
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('runtime/js/dicebound.js');t=p.read_text(encoding='utf-8')
          print(f'AFTER bytes={p.stat().st_size} lines={len(t.splitlines())} named_functions={len(re.findall(r"\bfunction\s+[A-Za-z_$][\w$]*\s*\(",t))} base_captures={len(re.findall(r"\bconst\s+[A-Za-z_$][\w$]*Base\s*=",t))}')
          PY
      - name: Remove one-shot materializer machinery
        run: |
          rm -f .github/workflows/arch-0660-inspect.yml tools/materialize_0660.py
          git diff --check
      - name: Commit validated candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "DiceBound Architecture Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "refactor(combat): extract turn resolution for Beta 0.6.6.0"
          git push origin HEAD:arch/0.6.6.0-combat-turn-resolution
