name: 0.6.6.0 combat chain inspection

on:
  push:
    branches:
      - arch/0.6.6.0-combat-turn-resolution
    paths:
      - .github/workflows/arch-0660-inspect.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trace combat helper reachability
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('runtime/js/dicebound.js')
          lines=p.read_text(encoding='utf-8').splitlines()
          names=['v24ApplyDamage','v24ResolveNormalHits','v24AttackPattern','beta03TickEnemyBurns','db0511TickPlayerElementStatuses','db0511PlayerElementDamage','db060HasEffect','db064ResolveWolfEchoes','dbFriendDragoonActive','dbFriendSuccessfulDodgePresentation']
          print(f'dicebound.js lines={len(lines)} bytes={p.stat().st_size}')
          for name in names:
              hits=[(i,line.strip()) for i,line in enumerate(lines,1) if re.search(rf'(?<![\w$]){re.escape(name)}(?![\w$])',line)]
              print(f'\n=== {name} refs={len(hits)} ===')
              for i,line in hits: print(f'{i}: {line[:1000]}')
          PY
