name: 0.6.6.0 combat extraction materializer

on:
  push:
    branches:
      - arch/0.6.6.0-combat-turn-resolution
    paths:
      - .github/workflows/arch-0660-inspect.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Mint protected-ref writer App token
        id: writer_app_token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.DICEBOUND_RELEASE_APP_ID }}
          private-key: ${{ secrets.DICEBOUND_RELEASE_APP_PRIVATE_KEY }}
          owner: Krtz
          repositories: DiceBound
          permission-contents: write
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.writer_app_token.outputs.token }}
      - name: Repair one-shot materializer and permanent proof markers
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          materializer=Path('tools/materialize_0660.py')
          t=materializer.read_text(encoding='utf-8')
          stale_anchor='anchor=\'print("Monolith spring-clean guard PASS: DB235/Career harness and retired patch sediment stay deleted")\''
          current_anchor='anchor="print(\'Monolith spring-clean guard PASS\')"'
          if stale_anchor not in t:
              raise SystemExit('expected stale materializer shadow-guard anchor was not found')
          t=t.replace(stale_anchor,current_anchor,1)
          stale_guard='assert "dbCombatTurns=window.DiceboundCombatTurnResolution.configure({" in monolith, "combat turn owner is not configured by the compatibility composition root"'
          current_guard='assert "dbCombatTurns=dbCombatTurnOwner.configure({" in mono, "combat turn owner is not configured by the compatibility composition root"'
          if stale_guard not in t:
              raise SystemExit('expected stale materializer composition guard was not found')
          t=t.replace(stale_guard,current_guard,1)
          t=t.replace('assert symbol not in monolith, f"retired combat turn owner returned to compatibility monolith: {symbol}"','assert symbol not in mono, f"retired combat turn owner returned to compatibility monolith: {symbol}"',1)
          t=t.replace('assert monolith.count("async function enemyTurn(") == 1','assert mono.count("async function enemyTurn(") == 1',1)
          t=t.replace('assert monolith.count("async function resolveEnemyResponse(") == 1','assert mono.count("async function resolveEnemyResponse(") == 1',1)
          materializer.write_text(t,encoding='utf-8')

          test=Path('tools/test_combat_turn_resolution.js')
          s=test.read_text(encoding='utf-8')
          stale='  "dbCombatTurns=window.DiceboundCombatTurnResolution.configure({"\n'
          current='  "const dbCombatTurnOwner=window.DiceboundCombatTurnResolution;",\n  "dbCombatTurns=dbCombatTurnOwner.configure({"\n'
          if stale not in s:
              raise SystemExit('expected stale Node composition marker was not found')
          test.write_text(s.replace(stale,current,1),encoding='utf-8')
          PY
      - name: Materialize authoritative turn owner
        run: python tools/materialize_0660.py
      - name: Wire extracted owner into browser runtime load order
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('runtime/index.html')
          t=p.read_text(encoding='utf-8')
          anchor='<script src="js/combat/targeting.js"></script>\n'
          line='<script src="js/combat/turn-resolution.js"></script>\n'
          if line not in t:
              if t.count(anchor)!=1:
                  raise SystemExit(f'expected one targeting script anchor, found {t.count(anchor)}')
              t=t.replace(anchor,anchor+line,1)
          p.write_text(t,encoding='utf-8')
          PY
      - name: Add Beta 0.6.6.0 release notes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          changelog=Path('CHANGELOG.md')
          c=changelog.read_text(encoding='utf-8')
          entry='''## Beta 0.6.6.0\n\n### Combat turn-resolution ownership (#40, #209, #267)\n- Extracted enemy-response and enemy-turn orchestration into `runtime/js/combat/turn-resolution.js`, making it the single owner for incoming hit resolution, Guardian specials, response status ticks, Haste/freeze handling, forced-control repeats, Hellfire/enemy Burn follow-up, Glass Fortress, Wolf Echo follow-up and Dragoon Airborne response handling.\n- Retired the historical v1/v2/v24/v25/Beta 0.4.x/DB0511/DB060/DB064/Friends wrapper ladder instead of leaving a second live combat owner in `dicebound.js`; the monolith keeps only narrow forwarding/composition adapters.\n- Added deterministic turn-resolution regression coverage and permanent shadow-ownership guards. Existing gameplay values, RNG draw order, action/event ordering, save/checkpoint behavior and known legacy quirks are intentionally preserved.\n\n'''
          marker='## Beta 0.6.5.20\n'
          if '## Beta 0.6.6.0\n' not in c:
              if c.count(marker)!=1:
                  raise SystemExit(f'expected one changelog 0.6.5.20 marker, found {c.count(marker)}')
              c=c.replace(marker,entry+marker,1)
          changelog.write_text(c,encoding='utf-8')

          notes=Path('runtime/PATCH_NOTES.md')
          p=notes.read_text(encoding='utf-8')
          p=p.replace('# Unreleased — Beta 0.6.5.20','# Unreleased — Beta 0.6.6.0',1)
          entry2='''## Beta 0.6.6.0 Combat turn-resolution ownership (#40, #209, #267)\n- Enemy response/turn sequencing now has one authoritative owner in `combat/turn-resolution.js`, including ordinary incoming hits, Guardian specials, Freeze/Haste response handling, player/enemy status ticks, forced-control repeat turns, Hellfire, Glass Fortress, Wolf Echo follow-up and Dragoon Airborne response handling.\n- Removed the historical enemy-turn/response reassignment chain and retained only thin composition adapters in `dicebound.js`. Existing combat numbers, RNG consumption/order, action/event ordering, saves/checkpoints and intentional legacy behavior are preserved.\n- Added deterministic owner tests plus permanent anti-shadow guards so retired combat ownership cannot quietly return.\n\n'''
          marker2='## Beta 0.6.5.20 Camp + monolith spring clean'
          if '## Beta 0.6.6.0 Combat turn-resolution ownership' not in p:
              idx=p.find(marker2)
              if idx<0:
                  raise SystemExit('expected runtime patch-notes 0.6.5.20 marker')
              p=p[:idx]+entry2+p[idx:]
          notes.write_text(p,encoding='utf-8')
          PY
      - name: Stamp Beta 0.6.6.0 and refresh runtime metadata
        run: |
          python tools/set_project_version.py --version 0.6.6.0 --channel Beta
          python tools/refresh_runtime_manifest.py --version 0.6.6.0 --channel Beta --development-state Unreleased
      - name: Focused syntax and architecture proof
        run: |
          node --check runtime/js/combat/turn-resolution.js
          node --check runtime/js/dicebound.js
          node tools/test_combat_turn_resolution.js
          python tools/test_shadow_ownership_drain.py
          python tools/test_06520_monolith_census.py
          python tools/validate_runtime_architecture.py
          python tools/validate_asset_architecture.py
          python tools/validate_launcher_assets.py
          git diff --check
      - name: Full cross-platform source regression suite
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            if [[ "$file" == "tools/test_file_startup_browser.js" ]]; then
              echo "SKIP on Ubuntu materializer: $file (Windows Edge gate owns this smoke)"
              continue
            fi
            node "$file"
          done < <(find tools -maxdepth 1 -name 'test_*.js' -print0 | sort -z)
          while IFS= read -r -d '' file; do python "$file"; done < <(find tools -maxdepth 1 -name 'test_*.py' -print0 | sort -z)
      - name: Report extraction census
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('runtime/js/dicebound.js');t=p.read_text(encoding='utf-8')
          print(f'AFTER bytes={p.stat().st_size} lines={len(t.splitlines())} named_functions={len(re.findall(r"\bfunction\s+[A-Za-z_$][\w$]*\s*\(",t))} base_captures={len(re.findall(r"\bconst\s+[A-Za-z_$][\w$]*Base\s*=",t))}')
          PY
      - name: Remove one-shot materializer machinery
        run: |
          rm -f .github/workflows/arch-0660-inspect.yml tools/materialize_0660.py
          git diff --check
      - name: Commit validated candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "DiceBound Architecture Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "refactor(combat): extract turn resolution for Beta 0.6.6.0"
          git push origin HEAD:arch/0.6.6.0-combat-turn-resolution
