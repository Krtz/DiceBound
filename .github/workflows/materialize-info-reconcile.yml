name: Materialize Info Guide reconciliation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  materialize:
    if: github.head_ref == 'fix/merchant-tile-visit-state'
    runs-on: windows-2022
    steps:
      - name: Mint DiceBound release App token
        id: release_app
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.DICEBOUND_RELEASE_APP_ID }}
          private-key: ${{ secrets.DICEBOUND_RELEASE_APP_PRIVATE_KEY }}
          owner: Krtz
          repositories: DiceBound
          permission-contents: write
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          token: ${{ steps.release_app.outputs.token }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reconcile Info owner with main and keep Invoker hotfix
        shell: pwsh
        run: |
          git fetch origin main --no-tags
          git checkout origin/main -- runtime/js/ui/info-guide.js
          @'
          from pathlib import Path

          path = Path('runtime/js/ui/info-guide.js')
          text = path.read_text(encoding='utf-8')
          bad = "formula.toUpperCase().split('').map(key=>names[key][0]).join(' + ')"
          good = "formula.split('').map(key=>names[key]?.[0]||key.toUpperCase()).join(' + ')"
          if bad not in text:
              raise SystemExit('Expected Invoker Formula Codex bug not found in main Info owner')
          text = text.replace(bad, good, 1)
          path.write_text(text, encoding='utf-8')
          '@ | Set-Content -Encoding utf8 .\reconcile_info.py
          python .\reconcile_info.py
          Remove-Item .\reconcile_info.py
          python tools/refresh_runtime_manifest.py --version 0.6.6.18 --channel Beta --development-state Unreleased
      - name: Commit reconciled Info owner
        shell: pwsh
        run: |
          git config user.name "dicebound-release-bot"
          git config user.email "actions@users.noreply.github.com"
          git add runtime/js/ui/info-guide.js runtime/build-info.json runtime/build-manifest.json
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { exit 0 }
          git commit -m "Reconcile Beta 0.6.6.18 Info Guide owner with main"
          git push origin HEAD:${{ github.head_ref }}
