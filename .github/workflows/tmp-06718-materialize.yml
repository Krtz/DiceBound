name: Temporary materialize 0.6.7.18 rerun 2

on:
  push:
    branches:
      - feat/0.6.7.18-combat-career-polish
    paths:
      - .github/workflows/tmp-06718-materialize.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/0.6.7.18-combat-career-polish
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Materialize release identity
        shell: pwsh
        run: |
          python tools/set_project_version.py --version 0.6.7.18 --channel Beta
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/refresh_runtime_manifest.py --version 0.6.7.18 --channel Beta --development-state Unreleased
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/prepare_release.py --version 0.6.7.18 --channel Beta --output-dir wrapper-source/release/generated
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/validate_version_identity.py --version 0.6.7.18 --channel Beta --release-spec wrapper-source/release/generated/release-spec.json --release-notes wrapper-source/release/generated/release-notes.md
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/validate_asset_architecture.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Emit materialized tracked files
        shell: pwsh
        run: |
          $files = @(
            "wrapper-source/config/project.json",
            "runtime/index.html",
            "runtime/js/version.js",
            "wrapper-source/wrappers/webview2/native-go/main.go",
            "runtime/build-info.json",
            "runtime/build-manifest.json"
          )
          foreach ($file in $files) {
            $b64 = [Convert]::ToBase64String([IO.File]::ReadAllBytes($file))
            Write-Host "BEGIN_MATERIALIZED::$file"
            for ($i = 0; $i -lt $b64.Length; $i += 4000) {
              Write-Host $b64.Substring($i, [Math]::Min(4000, $b64.Length - $i))
            }
            Write-Host "END_MATERIALIZED::$file"
          }
