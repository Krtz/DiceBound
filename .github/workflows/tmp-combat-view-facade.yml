name: Temporary Combat View facade materializer

on:
  push:
    branches:
      - arch/0.6.6.32-combat-view-oracle
    paths:
      - runtime/js/combat/view-facade.js
      - tools/test_combat_view_facade.js
      - tools/tmp_combat_view_facade_patch.py
      - tools/tmp_combat_view_test_fix.py
      - .github/workflows/tmp-combat-view-facade.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: windows-2022
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.7'

      - name: Apply Combat View facade staging patch
        shell: pwsh
        run: python tools/tmp_combat_view_facade_patch.py

      - name: Update migrated ownership assertions
        shell: pwsh
        run: python tools/tmp_combat_view_test_fix.py

      - name: Refresh runtime build metadata
        shell: pwsh
        run: python tools/refresh_runtime_manifest.py --version 0.6.6.31 --channel Beta --development-state Unreleased

      - name: Syntax-check runtime JavaScript
        shell: pwsh
        run: |
          Get-ChildItem runtime/js -Recurse -Filter *.js | Sort-Object FullName | ForEach-Object {
            node --check $_.FullName
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Run all JavaScript tests
        shell: pwsh
        run: |
          Get-ChildItem tools -Filter 'test_*.js' | Sort-Object Name | ForEach-Object {
            Write-Host "==> $($_.Name)"
            node $_.FullName
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Run all Python tests
        shell: pwsh
        run: |
          Get-ChildItem tools -Filter 'test_*.py' | Sort-Object Name | ForEach-Object {
            Write-Host "==> $($_.Name)"
            python $_.FullName
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Validate runtime architecture
        shell: pwsh
        run: python tools/validate_runtime_architecture.py

      - name: Validate asset architecture
        shell: pwsh
        run: python tools/validate_asset_architecture.py

      - name: Validate version identity
        shell: pwsh
        run: python tools/validate_version_identity.py

      - name: Validate launcher assets
        shell: pwsh
        run: python tools/validate_launcher_assets.py

      - name: Test and vet installer Go sources
        shell: pwsh
        run: |
          go test .\installer\main_v2.go .\installer\http_policy.go .\installer\main_v2_test.go
          if ($LASTEXITCODE -eq 0) { go vet .\installer\main_v2.go .\installer\http_policy.go .\installer\main_v2_test.go }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Check patch cleanliness
        shell: pwsh
        run: git diff --check

      - name: Materialize exact facade checkpoint
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp-combat-view-facade.yml
          git rm tools/tmp_combat_view_facade_patch.py
          git rm tools/tmp_combat_view_test_fix.py
          git add -A
          git commit -m "arch: expose Combat View facade"
          $checkpoint = git rev-parse HEAD
          Write-Host "COMBAT_VIEW_FACADE_CHECKPOINT=$checkpoint"
          git push origin HEAD:arch/0.6.6.32-combat-view-oracle
