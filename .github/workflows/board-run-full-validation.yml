name: Board Run 0.6.6.25 Candidate Validation

on:
  push:
    branches:
      - arch/0.6.6.25-board-run-facade

permissions:
  contents: write

env:
  WEBVIEW2_SDK_VERSION: "1.0.4129.50"
  CANDIDATE_VERSION: "0.6.6.25"
  CANDIDATE_CHANNEL: "Beta"

jobs:
  candidate-validation:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.7"

      - name: Prepare 0.6.6.25 source metadata
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          patch_path = Path("runtime/PATCH_NOTES.md")
          patch = patch_path.read_text(encoding="utf-8")
          patch_block = """# Unreleased — Beta 0.6.6.25

          ## Beta 0.6.6.25 Board + Run subsystem facade (#322)
          - Added `run/facade.js` as the one ordinary public `DiceboundRun` boundary over the existing Board registry, movement, tile dispatch, generation, transition, Player Initialization, Run Lifecycle and Run Completion owners; those focused modules remain authoritative internals.
          - `dicebound.js` now obtains/configures Board + Run behavior through the facade instead of coordinating eight public implementation globals directly, and its manifest dependencies collapse from seven Board/Run implementation modules to one `run-facade` dependency.
          - Permanent facade, anti-shadow, content-registry and architecture guards prevent the old fragmented composition from returning while the existing deterministic Board/Run/checkpoint oracles preserve exact ordering and RNG behavior.
          - Architecture-only: no Board balance, Road Event, Merchant, Combat, class/Pet/powerup, RNG or save/checkpoint redesign is intended. The runtime graph is 71 modules (70 extracted + one compatibility monolith); normalized `dicebound.js` falls from 740,927 bytes / 7,432 lines to 739,724 bytes / 7,426 lines, with 552 named declarations and 108 historical base captures unchanged.

          """
          if not patch.startswith("# Unreleased — Beta 0.6.6.25\n"):
              patch_path.write_text(patch_block + patch, encoding="utf-8", newline="\n")

          changelog_path = Path("CHANGELOG.md")
          changelog = changelog_path.read_text(encoding="utf-8")
          changelog_block = """## Beta 0.6.6.25

          ### Board + Run subsystem facade (#322)
          - Added `runtime/js/run/facade.js` as the single ordinary public `DiceboundRun` subsystem boundary while retaining the eight existing Board/Run files as focused internal owners.
          - Drained direct Board/Run implementation-global coordination from `dicebound.js`: Board registry, movement, tile dispatch, generation, transition, player initialization, fresh-run lifecycle and completion now route through the facade; the monolith's seven direct Board/Run manifest dependencies become one `run-facade` dependency.
          - Added permanent facade delegation and anti-regression guards, and updated existing composition assertions so they protect the new public boundary without weakening the exact Board-generation, movement, dispatch, transition, 24-case Player Initialization, lifecycle, completion and checkpoint oracles.
          - Updated browser/native packaging to include the facade. Direct Windows Edge startup and the native WebView2 release build/validation remain part of the acceptance gate. No gameplay, balance, RNG, save/checkpoint, Road Event, Merchant or Combat behavior change is intended.
          - Architecture measurement: runtime graph 70 → 71 scripts (69 → 70 extracted/internal plus one monolith); normalized `dicebound.js` 740,927 → 739,724 bytes and 7,432 → 7,426 lines; 552 named declarations and 108 historical base captures remain unchanged.

          """
          if "## Beta 0.6.6.25\n" not in changelog:
              marker = "## Beta 0.6.6.24\n"
              if marker not in changelog:
                  raise SystemExit("CHANGELOG.md is missing the expected 0.6.6.24 insertion point")
              changelog = changelog.replace(marker, changelog_block + marker, 1)
              changelog_path.write_text(changelog, encoding="utf-8", newline="\n")
          '@ | python -

          python tools/set_project_version.py --version $env:CANDIDATE_VERSION --channel $env:CANDIDATE_CHANNEL
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/refresh_runtime_manifest.py --version $env:CANDIDATE_VERSION --channel $env:CANDIDATE_CHANNEL --development-state Unreleased
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/prepare_release.py --version $env:CANDIDATE_VERSION --channel $env:CANDIDATE_CHANNEL --output-dir wrapper-source/release/generated
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Stage official WebView2 loader
        shell: pwsh
        run: |
          $probe = Join-Path $env:RUNNER_TEMP "dicebound-webview2-sdk"
          dotnet new classlib -n LoaderProbe -o $probe --force | Out-Host
          dotnet add (Join-Path $probe "LoaderProbe.csproj") package Microsoft.Web.WebView2 --version $env:WEBVIEW2_SDK_VERSION | Out-Host
          if ($LASTEXITCODE -ne 0) { throw "Could not restore Microsoft.Web.WebView2." }
          $package = Get-Item (Join-Path $env:USERPROFILE ".nuget\packages\microsoft.web.webview2\$env:WEBVIEW2_SDK_VERSION")
          $loader = Join-Path $package.FullName "build\native\x64\WebView2Loader.dll"
          if (-not (Test-Path $loader)) { throw "Official x64 WebView2Loader.dll was not found at $loader" }
          $sig = Get-AuthenticodeSignature $loader
          if ($sig.Status -ne "Valid") { throw "WebView2Loader.dll signature is not valid: $($sig.Status)" }
          "WEBVIEW2_LOADER_DLL=$loader" >> $env:GITHUB_ENV

      - name: Validate exact candidate source
        shell: pwsh
        run: |
          python tools/validate_version_identity.py --version $env:CANDIDATE_VERSION --channel $env:CANDIDATE_CHANNEL --release-spec wrapper-source/release/generated/release-spec.json --release-notes wrapper-source/release/generated/release-notes.md
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          Get-ChildItem runtime/js -Recurse -Filter *.js | ForEach-Object { node --check $_.FullName; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE } }
          Get-ChildItem tools -Filter test_*.js | ForEach-Object { node $_.FullName; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE } }
          Get-ChildItem tools -Filter test_*.py | ForEach-Object { python $_.FullName; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE } }

          python tools/validate_runtime_architecture.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/validate_asset_architecture.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/validate_launcher_assets.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          go test .\installer\main_v2.go .\installer\http_policy.go .\installer\main_v2_test.go
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go vet .\installer\main_v2.go .\installer\http_policy.go .\installer\main_v2_test.go
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Materialize validated 0.6.6.25 source commit
        id: materialize
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          @'
          import base64
          import json
          import os
          import subprocess
          import urllib.request
          from pathlib import Path

          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          parent = os.environ["GITHUB_SHA"]
          api_root = f"https://api.github.com/repos/{repo}/git"

          def post(path, payload):
              request = urllib.request.Request(
                  api_root + path,
                  data=json.dumps(payload).encode("utf-8"),
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "Content-Type": "application/json",
                  },
                  method="POST",
              )
              with urllib.request.urlopen(request) as response:
                  return json.load(response)

          changed = subprocess.check_output(
              ["git", "diff", "--name-only", "--diff-filter=ACMRT", "HEAD"], text=True
          ).splitlines()
          if not changed:
              raise SystemExit("candidate preparation produced no tracked source changes")

          entries = []
          for filename in changed:
              blob = post(
                  "/blobs",
                  {
                      "content": base64.b64encode(Path(filename).read_bytes()).decode("ascii"),
                      "encoding": "base64",
                  },
              )
              entries.append({"path": filename, "mode": "100644", "type": "blob", "sha": blob["sha"]})

          base_tree = subprocess.check_output(["git", "rev-parse", "HEAD^{tree}"], text=True).strip()
          tree = post("/trees", {"base_tree": base_tree, "tree": entries})
          commit = post(
              "/commits",
              {
                  "message": "release: prepare Beta 0.6.6.25 Board Run facade",
                  "tree": tree["sha"],
                  "parents": [parent],
              },
          )
          print("CHANGED_FILES=" + ",".join(changed))
          print("REMOTE_COMMIT_SHA=" + commit["sha"])
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"commit_sha={commit['sha']}\n")
          '@ | python -

      - name: Build and validate native 0.6.6.25 candidate
        shell: pwsh
        run: |
          .\Build-DiceBoundRelease.ps1 `
            -Version $env:CANDIDATE_VERSION `
            -Channel $env:CANDIDATE_CHANNEL `
            -SkipSourceStamp `
            -RequireSignedLoader
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload hands-on test candidate
        uses: actions/upload-artifact@v4
        with:
          name: DiceBound-Beta-0.6.6.25-candidate
          path: |
            wrapper-source/release/DiceBound.exe
            wrapper-source/release/release-metadata.json
            wrapper-source/release/generated/release-spec.json
            wrapper-source/release/generated/release-notes.md
          if-no-files-found: error
          retention-days: 14

      - name: Report validated source commit
        shell: pwsh
        run: |
          Write-Host "Validated source commit: ${{ steps.materialize.outputs.commit_sha }}"
