name: Temporary 0.6.7.0 class tag owner cleanup

on:
  push:
    branches:
      - refactor/0.6.7.0-monolith-chainsaw
    paths:
      - .github/workflows/tmp-0670-class-tag-owner.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/0.6.7.0-monolith-chainsaw
          fetch-depth: 0
      - name: Route class tag vocabulary directly through Classes owner
        shell: python
        run: |
          from pathlib import Path

          path = Path("runtime/js/dicebound.js")
          source = path.read_text(encoding="utf-8")
          replacements = [
              (
                  '  const CLASS_TAG_VOCABULARY=[...(window.DiceboundClasses?.tagVocabulary||[])];\n  if(!CLASS_TAG_VOCABULARY.length)throw new Error("DiceboundClasses tag vocabulary must load before dicebound.js");',
                  '  if(!window.DiceboundClasses?.tagVocabulary?.length)throw new Error("DiceboundClasses tag vocabulary must load before dicebound.js");',
              ),
              (
                  'Object.values(CLASS_MECHANICS_REGISTRY).flat().concat([...CLASS_TAG_VOCABULARY],DB317_POWERUPS_RAW.flatMap(u=>u.tags||[])',
                  'Object.values(CLASS_MECHANICS_REGISTRY).flat().concat([...window.DiceboundClasses.tagVocabulary],DB317_POWERUPS_RAW.flatMap(u=>u.tags||[])',
              ),
              (
                  'classTagVocabulary:CLASS_TAG_VOCABULARY',
                  'classTagVocabulary:window.DiceboundClasses.tagVocabulary',
              ),
          ]
          for old, new in replacements:
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"expected exactly one replacement target, found {count}: {old[:80]!r}")
              source = source.replace(old, new, 1)
          if "CLASS_TAG_VOCABULARY" in source:
              raise SystemExit("CLASS_TAG_VOCABULARY local alias still remains")
          path.write_text(source, encoding="utf-8")
      - name: Commit cleanup and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/tmp-0670-class-tag-owner.yml
          git add runtime/js/dicebound.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "refactor: route class tags through Classes owner"
          git push origin HEAD:refactor/0.6.7.0-monolith-chainsaw
