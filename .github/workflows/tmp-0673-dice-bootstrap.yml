name: TEMP 0.6.7.3 Run Dice bootstrap materializer

on:
  push:
    branches:
      - fix/0.6.7.3-double-dice-roll-lock

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Canonicalize Run Dice bootstrap order
        run: |
          python tools/tmp_0673_bootstrap.py
          python tools/refresh_runtime_manifest.py --version 0.6.7.3 --channel Beta --development-state Unreleased
      - name: Validate
        run: |
          node --check runtime/js/run/dice.js
          node --check runtime/js/dicebound.js
          node tools/test_run_dice.js
          node tools/test_board_movement.js
          node tools/test_runtime_oracle.js
          python tools/validate_runtime_architecture.py
          python tools/validate_version_identity.py --version 0.6.7.3 --channel Beta
      - name: Commit exact validated tree
        run: |
          git rm .github/workflows/tmp-0673-dice-bootstrap.yml tools/tmp_0673_bootstrap.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Beta 0.6.7.3 — compose Run Dice before bootstrap HUD (#371)"
          git push origin HEAD:fix/0.6.7.3-double-dice-roll-lock