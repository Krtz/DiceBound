name: Materialize Merchant hotfix identity

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  materialize:
    if: github.head_ref == 'fix/merchant-tile-visit-state'
    runs-on: windows-2022
    steps:
      - name: Mint DiceBound release App token
        id: release_app
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.DICEBOUND_RELEASE_APP_ID }}
          private-key: ${{ secrets.DICEBOUND_RELEASE_APP_PRIVATE_KEY }}
          owner: Krtz
          repositories: DiceBound
          permission-contents: write

      - name: Check out hotfix head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          token: ${{ steps.release_app.outputs.token }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Add release notes and materialize identity
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          patch = Path('runtime/PATCH_NOTES.md')
          patch_text = patch.read_text(encoding='utf-8')
          marker = '## Beta 0.6.6.18 Merchant tile hotfix (#306)'
          if marker not in patch_text:
              section = '''# Unreleased — Beta 0.6.6.18

          ## Beta 0.6.6.18 Merchant tile hotfix (#306)
          - Fixed Merchant arrival crashing during shop-stock construction because two live equipment-identity formatting helper names had been deleted while `formatBonuses()` / `formatGearComparison()` still called them.
          - Restored the narrow compatibility formatting bridge against the authoritative equipment owner, and fixed Merchant transaction visit ownership so one rendered stock array keeps one transaction visit through rerenders and Legendary choices.
          - Added deterministic transaction coverage plus a real Windows Edge Merchant-arrival regression that renders gear comparison, commits a purchase and rejects road-recovery exceptions.
          - Merchant prices, stock composition, RNG, Board generation, secret Merchant-boss behavior, save schema and balance values are unchanged.

          '''
              patch.write_text(section + patch_text, encoding='utf-8')

          changelog = Path('CHANGELOG.md')
          change_text = changelog.read_text(encoding='utf-8')
          change_marker = '## Beta 0.6.6.18'
          if change_marker not in change_text:
              anchor = '# DiceBound Changelog\n\nThis file starts the durable Git-era release history. Earlier Alpha/Beta history exists in recovered project notes; Beta 0.6 is the first release established as the repository baseline.\n\n'
              section = '''## Beta 0.6.6.18

          ### Merchant tile hotfix (#306)
          - Fixed the real Merchant-tile crash: live equipment formatting still referenced two deleted identity-format helpers, causing `openMerchant()` to throw and Board recovery to swallow the shop.
          - Restored only that formatting compatibility seam against `DiceboundEquipment`, and fixed the secondary split-visit transaction defect for exact Merchant stock identity.
          - Added a real Edge regression covering Merchant arrival, generated gear comparison, an actual purchase and absence of tile-error recovery.
          - No Merchant economy, RNG, Board generation, secret-boss, save-schema or balance changes.

          '''
              if anchor not in change_text:
                  raise SystemExit('CHANGELOG anchor missing')
              changelog.write_text(change_text.replace(anchor, anchor + section, 1), encoding='utf-8')

          version = Path('runtime/js/version.js')
          version_text = version.read_text(encoding='utf-8')
          version_text = version_text.replace('const RELEASE_SUMMARY="Info/Guide shadow-ownership cleanup.";', 'const RELEASE_SUMMARY="Merchant tile hotfix.";')
          version.write_text(version_text, encoding='utf-8')
          '@ | Set-Content -Encoding utf8 .\materialize_hotfix.py
          python .\materialize_hotfix.py
          Remove-Item .\materialize_hotfix.py
          python tools/set_project_version.py --version 0.6.6.18 --channel Beta
          python tools/refresh_runtime_manifest.py --version 0.6.6.18 --channel Beta --development-state Unreleased

      - name: Commit generated hotfix identity
        shell: pwsh
        run: |
          git config user.name "dicebound-release-bot"
          git config user.email "actions@users.noreply.github.com"
          git add CHANGELOG.md runtime/PATCH_NOTES.md runtime/index.html runtime/js/version.js runtime/build-info.json runtime/build-manifest.json wrapper-source/config/project.json wrapper-source/wrappers/webview2/native-go/main.go
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Hotfix identity already materialized."
            exit 0
          }
          git commit -m "Materialize Beta 0.6.6.18 Merchant hotfix"
          git push origin HEAD:${{ github.head_ref }}