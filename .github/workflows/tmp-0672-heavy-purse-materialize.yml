name: TEMP 0.6.7.2 Heavy Purse materializer

on:
  push:
    branches:
      - fix/0.6.7.2-heavy-purse-gold-policy

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Patch canonical gold ownership and focused coverage
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match, found {count}: {old[:100]!r}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "runtime/js/core/runtime-services.js",
              '    const goldReward = requireFunction(ports.economy?.goldReward, "economy.goldReward");\n    const isNightmare = requireFunction(ports.economy?.isNightmare, "economy.isNightmare");',
              '    const goldReward = requireFunction(ports.economy?.goldReward, "economy.goldReward");\n    const goldBaseFor = requireFunction(ports.economy?.goldBaseFor, "economy.goldBaseFor");\n    const isNightmare = requireFunction(ports.economy?.isNightmare, "economy.isNightmare");'
          )
          replace_once(
              "runtime/js/core/runtime-services.js",
              '      economy: Object.freeze({ goldReward, isNightmare }),',
              '      economy: Object.freeze({ goldReward, goldBaseFor, isNightmare }),'
          )

          replace_once(
              "runtime/js/powerups/registry.js",
              '      [services.economy?.goldReward, "economy.goldReward"],\n      [services.economy?.isNightmare, "economy.isNightmare"],',
              '      [services.economy?.goldReward, "economy.goldReward"],\n      [services.economy?.goldBaseFor, "economy.goldBaseFor"],\n      [services.economy?.isNightmare, "economy.isNightmare"],'
          )
          replace_once(
              "runtime/js/powerups/registry.js",
              '    const modifiedGold = services.economy.goldReward;\n    const healPlayer = services.combat.heal;',
              '    const modifiedGold = services.economy.goldReward;\n    const goldBaseFor = services.economy.goldBaseFor;\n    const healPlayer = services.combat.heal;'
          )
          replace_once(
              "runtime/js/powerups/registry.js",
              '      get desc(){const total=modifiedGold(100),bonus=Math.round((player.goldBonus||0)*100);return `Gain ${total} gold now (100 base${bonus?`, ${bonus}% Gold bonus`:\'\'}${services.economy.isNightmare()?\', Nightmare reward reduction included\':\'\'}).`;},\n      "apply": function(){player.gold+=modifiedGold(100);},',
              '      get desc(){const base=goldBaseFor("heavyPurse",player.level),total=modifiedGold(base),bonus=Math.round((player.goldBonus||0)*100);return `Gain ${total} gold now (${base} base at Adventurer Level ${Math.max(1,Math.floor(Number(player.level)||1))}${bonus?`, ${bonus}% Gold bonus`:\'\'}${services.economy.isNightmare()?\', Nightmare reward reduction included\':\'\'}).`;},\n      "apply": function(){player.gold+=modifiedGold(goldBaseFor("heavyPurse",player.level));},'
          )

          replace_once(
              "runtime/js/dicebound.js",
              '    economy:{goldReward:amount=>modifiedGold(amount),isNightmare:()=>nightmareMode},',
              '    economy:{goldReward:amount=>modifiedGold(amount),goldBaseFor:(source,level,multiplier)=>window.DiceboundEventRewards.goldBaseFor(source,level,multiplier),isNightmare:()=>nightmareMode},'
          )

          p = Path("runtime/js/events/reward-policy.js")
          text = p.read_text(encoding="utf-8")
          start = text.find('  function bridgeHeavyPurse(){')
          end = text.find('  function installBrowserPolish(){', start)
          if start < 0 or end < 0:
              raise SystemExit("reward-policy.js: Heavy Purse bridge block not found")
          text = text[:start] + text[end:]
          old_tail = '  bridgeHeavyPurse();if(typeof document!=="undefined")setTimeout(installBrowserPolish,0);'
          if text.count(old_tail) != 1:
              raise SystemExit("reward-policy.js: Heavy Purse bridge invocation not found exactly once")
          p.write_text(text.replace(old_tail, '  if(typeof document!=="undefined")setTimeout(installBrowserPolish,0);', 1), encoding="utf-8")

          replace_once(
              "tools/test_powerup_services.js",
              'vm.runInContext(read("core/runtime-services.js"), context, { filename: "core/runtime-services.js" });\nvm.runInContext(read("powerups/registry.js"), context, { filename: "powerups/registry.js" });',
              'vm.runInContext(read("events/reward-policy.js"), context, { filename: "events/reward-policy.js" });\nvm.runInContext(read("core/runtime-services.js"), context, { filename: "core/runtime-services.js" });\nvm.runInContext(read("powerups/registry.js"), context, { filename: "powerups/registry.js" });'
          )
          replace_once(
              "tools/test_powerup_services.js",
              '  attack: 10,\n  defense: 5,',
              '  level: 1,\n  attack: 10,\n  defense: 5,'
          )
          replace_once(
              "tools/test_powerup_services.js",
              '  economy: {\n    goldReward: (amount) => Math.round(amount * (1 + activePlayer.goldBonus)),\n    isNightmare: () => nightmare,\n  },',
              '  economy: {\n    goldReward: (amount) => Math.round(amount * (1 + activePlayer.goldBonus)),\n    goldBaseFor: (source, level, multiplier) => window.DiceboundEventRewards.goldBaseFor(source, level, multiplier),\n    isNightmare: () => nightmare,\n  },'
          )
          replace_once(
              "tools/test_powerup_services.js",
              'assert.match(purse.desc, /Gain 150 gold now/);\nnightmare = true;\nassert.match(purse.desc, /Nightmare reward reduction included/);\npurse.apply();\nassert.equal(activePlayer.gold, 150);\nactivePlayer.goldBonus = 0.8;\nassert.match(purse.desc, /Gain 180 gold now/, "description did not recompute the modified reward");\npurse.apply();\nassert.equal(activePlayer.gold, 330, "mechanic did not consume the same modified reward shown by the description");',
              'assert.match(purse.desc, /Gain 74 gold now \\(49 base at Adventurer Level 1, 50% Gold bonus\\)/);\nnightmare = true;\nassert.match(purse.desc, /Nightmare reward reduction included/);\npurse.apply();\nassert.equal(activePlayer.gold, 74);\nactivePlayer.level = 10;\nactivePlayer.goldBonus = 0.8;\nassert.match(purse.desc, /Gain 315 gold now \\(175 base at Adventurer Level 10, 80% Gold bonus/);\npurse.apply();\nassert.equal(activePlayer.gold, 389, "mechanic did not consume the same level-scaled modified reward shown by the description");'
          )
          replace_once(
              "tools/test_powerup_services.js",
              'const expectedDigest = "e02166a4df15aa1d0a7ff1ff564ce5996d9cef5a870ec508dedd7b1e3f829a8e";',
              'const expectedDigest = "f0905e25117c8d11112e18204d177b64e5ab7f0a22bf73580cf079d287779fe8";'
          )
          replace_once(
              "tools/test_powerup_services.js",
              'assert.doesNotMatch(moduleSource, /\\bnightmareMode\\b/);',
              'assert.doesNotMatch(moduleSource, /\\bnightmareMode\\b/);\nassert.doesNotMatch(moduleSource, /modifiedGold\\(100\\)/, "Heavy Purse must not regress to the flat 100-gold implementation");'
          )

          replace_once(
              "tools/test_event_reward_policy.js",
              'assert.deepEqual(policy.slotMatchOdds(0.5), { secondMatch: 0.78, tripleFromPair: 0.88, pairFromMiss: 0.575 });',
              'assert.deepEqual(policy.slotMatchOdds(0.5), { secondMatch: 0.78, tripleFromPair: 0.88, pairFromMiss: 0.575 });\nassert.doesNotMatch(source, /bridgeHeavyPurse/, "shared reward policy must not monkey-patch the Powerup registry");'
          )
          PY

      - name: Add release notes and materialize 0.6.7.2 identity
        shell: bash
        run: |
          cat > runtime/release-notes/0.6.7.2.md <<'EOF'
          # DiceBound Beta 0.6.7.2

          ## Gold policy regression fix

          - Restored Heavy Purse to the shared level-scaled Gold baseline instead of its stale flat 100-base implementation.
          - Heavy Purse now uses 70% of `50 + 20 × Adventurer Level`, then applies the normal Gold modifier exactly once; its live description reports the same payout it will actually grant.
          - Removed the old Beta 0.6.4.3 global Powerup-registry interception bridge. Shared reward numbers stay in EventRewards while the Powerup registry owns Heavy Purse behavior through an explicit runtime service port.
          - Added direct live-registry regression coverage at Adventurer Levels 1 and 10, including a non-zero Gold bonus so double-modifier regressions are caught.
          - No other Powerup balance, reward tables, Hidden Purse talent values, RNG, save/checkpoint or combat behavior are intentionally changed.
          EOF
          python tools/set_project_version.py --version 0.6.7.2 --channel Beta
          python tools/refresh_runtime_manifest.py --version 0.6.7.2 --channel Beta --development-state Unreleased

      - name: Focused validation
        shell: bash
        run: |
          set -euo pipefail
          node --check runtime/js/core/runtime-services.js
          node --check runtime/js/events/reward-policy.js
          node --check runtime/js/powerups/registry.js
          node --check runtime/js/dicebound.js
          node tools/test_event_reward_policy.js
          node tools/test_powerup_services.js
          node tools/test_powerups_facade.js
          node tools/test_player_initialization.js
          python tools/validate_runtime_architecture.py

      - name: Commit materialized patch and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/tmp-0672-heavy-purse-materialize.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "Beta 0.6.7.2 — restore Heavy Purse gold scaling (#369)"
          git push origin HEAD:fix/0.6.7.2-heavy-purse-gold-policy
