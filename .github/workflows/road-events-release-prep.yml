name: Road Events Release Prep

on:
  push:
    branches:
      - arch/0.6.6.26-road-events-oracle

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Stamp and validate Beta 0.6.6.26
        run: |
          python tools/prepare_road_events_release.py
          python tools/set_project_version.py --version 0.6.6.26 --channel Beta
          python tools/refresh_runtime_manifest.py --version 0.6.6.26 --channel Beta --development-state Unreleased
          python tools/validate_version_identity.py
          python tools/validate_launcher_assets.py
          python tools/validate_runtime_architecture.py
          python tools/test_runtime_manifest_hash.py
          git diff --check
      - name: Materialize validated release-prep commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/materialize_road_events_release.py
