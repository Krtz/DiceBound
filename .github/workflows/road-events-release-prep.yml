name: Road Events Release Prep

on:
  push:
    branches:
      - arch/0.6.6.26-road-events-oracle

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Stamp 0.6.6.26 notes and version identity
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          patch=Path('runtime/PATCH_NOTES.md')
          text=patch.read_text(encoding='utf-8')
          block='''# Unreleased — Beta 0.6.6.26

## Beta 0.6.6.26 Road Events subsystem facade (#324)
- Added the public `DiceboundRoadEvents` facade over focused Treasure and interactive lifecycle internals for Slots, Wheel, Blessing, Mystic, Bloodwell and Gambler; Board + Run remains arrival/routing-only.
- Drained the migrated Road Event lifecycle, patch-wrapper chains, event-local transient state and destination listeners from `dicebound.js`; Treasure retains its exact 0.6 Memory Cache ordering and hidden Bloodmage entry still delegates to Combat.
- Added a permanent 46-case released-0.6.6.25 characterization oracle plus facade, Treasure and anti-shadow guards. Exact observable state, tile/cookie effects, RNG call counts and final RNG state are frozen, including the shipped Slot animation RNG quirk.
- Architecture-only: no event odds/reward values, Board placement, Powerup/Items behavior, Combat behavior, checkpoint/save schema or UI redesign is intended. Runtime graph is 74 modules (73 extracted + one compatibility monolith); normalized `dicebound.js` is 709,513 bytes / 7,267 lines, down from 739,724 bytes / 7,426 lines in released 0.6.6.25.

'''
          if not text.startswith('# Unreleased — Beta 0.6.6.26'):
              patch.write_text(block+text,encoding='utf-8')

          changelog=Path('CHANGELOG.md')
          c=changelog.read_text(encoding='utf-8')
          marker='This file starts the durable Git-era release history. Earlier Alpha/Beta history exists in recovered project notes; Beta 0.6 is the first release established as the repository baseline.\n'
          section='''\n## Beta 0.6.6.26\n\n### Road Events subsystem facade (#324)\n- Added `runtime/js/events/facade.js` as the single ordinary public `DiceboundRoadEvents` boundary, backed by focused Treasure and interactive lifecycle internals rather than duplicated implementations.\n- Routed Slots, Wheel, Treasure, Blessing, Mystic, Bloodwell and Gambler through the subsystem facade while keeping Board + Run responsible only for arrival/routing and leaving Powerups, Items and Combat as separate collaborators.\n- Removed migrated Road Event lifecycle implementations, patch-era wrapper chains, event-local transient state/listeners and stale Slot/Wheel overrides from `dicebound.js`; preserved Merchant ownership after explicitly guarding the extraction boundary.\n- Added a permanent 46-case exact released-0.6.6.25 Road Events oracle covering output/state/RNG behavior, plus facade/Treasure/anti-shadow tests. The shipped Slot animation RNG consumption remains deliberately frozen.\n- Architecture measurement: runtime graph 71 → 74 modules (70 → 73 extracted/internal plus one monolith); normalized `dicebound.js` 739,724 → 709,513 bytes and 7,426 → 7,267 lines. No event balance, reward odds, Board placement, save/checkpoint, Powerup/Items or Combat behavior change is intended.\n'''
          if '\n## Beta 0.6.6.26\n' not in c:
              if marker not in c: raise SystemExit('CHANGELOG insertion marker missing')
              c=c.replace(marker,marker+section,1)
              changelog.write_text(c,encoding='utf-8')
          PY
          python tools/set_project_version.py --version 0.6.6.26 --channel Beta
          python tools/refresh_runtime_manifest.py --version 0.6.6.26 --channel Beta --development-state Unreleased
          python tools/validate_version_identity.py
          python tools/validate_launcher_assets.py
          python tools/validate_runtime_architecture.py
          python tools/test_runtime_manifest_hash.py
          git diff --check

      - name: Materialize validated release-prep commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64,json,os,subprocess,urllib.request
          from pathlib import Path
          repo=os.environ['GITHUB_REPOSITORY']; token=os.environ['GH_TOKEN']; parent=os.environ['GITHUB_SHA']
          api=f'https://api.github.com/repos/{repo}/git'
          def post(path,payload):
              req=urllib.request.Request(api+path,data=json.dumps(payload).encode(),headers={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json'},method='POST')
              with urllib.request.urlopen(req) as r:return json.load(r)
          changed=subprocess.check_output(['git','diff','--name-only','--diff-filter=ACMRT','HEAD'],text=True).splitlines()
          if not changed: raise SystemExit('no release-prep changes produced')
          entries=[]
          for filename in changed:
              raw=Path(filename).read_bytes(); blob=post('/blobs',{'content':base64.b64encode(raw).decode(),'encoding':'base64'})
              entries.append({'path':filename,'mode':'100644','type':'blob','sha':blob['sha']})
          tree=post('/trees',{'base_tree':subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip(),'tree':entries})
          commit=post('/commits',{'message':'release: prepare Beta 0.6.6.26 Road Events facade','tree':tree['sha'],'parents':[parent]})
          print('CHANGED_FILES='+','.join(changed)); print('REMOTE_COMMIT_SHA='+commit['sha'])
          PY
