name: Temporary class unlock extraction

on:
  push:
    branches:
      - arch/0.6.6.22-class-unlock-resolution
    paths:
      - .github/workflows/tmp-class-unlock-census.yml

permissions:
  contents: write

jobs:
  transform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arch/0.6.6.22-class-unlock-resolution
      - name: Apply extraction
        run: python tools/tmp_extract_class_unlock_resolution.py
      - name: Focused rules regression
        run: node tools/test_class_unlock_rules.js
      - name: Existing 0.6.3.1 regression
        run: node tools/test_0631_progression_slime_gear.js
      - name: Print reconciled registry snapshots
        shell: bash
        run: |
          node - <<'NODE'
          const fs=require('fs'),vm=require('vm'),crypto=require('crypto');
          const source=fs.readFileSync('runtime/js/classes/registry.js','utf8');
          const c=vm.createContext({window:{}});vm.runInContext(source,c);
          const C=c.window.DiceboundClasses;
          for(const [name,value] of [['registry',C.createRegistry()],['unlocks',C.createUnlockRegistry()]]){
            const data=JSON.stringify(value);console.log(name,Buffer.byteLength(data),crypto.createHash('sha256').update(data).digest('hex'));
          }
          console.log('rouge',C.createRegistry().rouge.unlock,C.createUnlockRegistry().rouge);
          console.log('alchemist',C.createRegistry().alchemist.unlock,C.createUnlockRegistry().alchemist);
          NODE
      - name: Static sanity
        shell: bash
        run: |
          git diff --check
          node --check runtime/js/progression/class-unlock-rules.js
          node --check runtime/js/dicebound.js
          python tools/validate_runtime_architecture.py
      - name: Commit transformed source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runtime/js/dicebound.js runtime/js/progression/class-unlock-rules.js runtime/js/classes/registry.js tools/test_0631_progression_slime_gear.js
          git commit -m "refactor: extract class unlock resolution"
          git push origin HEAD:arch/0.6.6.22-class-unlock-resolution

# rerun after correcting the historical dynamic-attempt oracle
