name: Temporary class unlock release candidate materializer

on:
  push:
    branches:
      - candidate-0.6.6.22-class-unlock-resolution
    paths:
      - .github/workflows/tmp-class-unlock-census.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: candidate-0.6.6.22-class-unlock-resolution
          fetch-depth: 0

      - name: Add durable release notes and extraction guard
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          root=Path('.')
          changelog=root/'CHANGELOG.md'
          text=changelog.read_text(encoding='utf-8')
          anchor='## Beta 0.6.6.21\n'
          entry='''## Beta 0.6.6.22\n\n### Class Unlock Resolution ownership (#314)\n- `progression/class-unlock-rules.js` is now the authoritative class-unlock eligibility and dynamic-resolution owner; the historical `baseClassUnlocked` / `isClassUnlocked` / `unlockClass` / `checkDynamicClassUnlocks` wrapper ladders are retired from `dicebound.js`.\n- Shipped Beta 0.6.6.21 unlock behavior is preserved, including compound Rogue/Vampire/Pokémon Trainer/Invoker/Dragoon rules, Slime counting semantics, dynamic run-stat unlocks and duplicate historical scan order.\n- Stale registry metadata is reconciled to runtime truth: Alchemist requires 15 lifetime potion uses and Rouge requires 10 Prestige points.\n- Monolith policy ownership drops from roughly 777,065 bytes / 7,620 physical lines to 769,124 bytes / 7,514 physical lines before release metadata, with thin composition/persistence adapters retained only where runtime side effects still belong in the monolith.\n\n'''
          if '## Beta 0.6.6.22' not in text:
              text=text.replace(anchor,entry+anchor,1)
              changelog.write_text(text,encoding='utf-8')

          notes=root/'runtime/PATCH_NOTES.md'
          text=notes.read_text(encoding='utf-8')
          entry='''# Unreleased — Beta 0.6.6.22\n\n## Beta 0.6.6.22 Class Unlock Resolution ownership (#314)\n- `progression/class-unlock-rules.js` now resolves all shipped class-unlock eligibility and the cumulative dynamic scan order from explicit runtime context.\n- Historical class-unlock policy wrappers are removed from `dicebound.js`; runtime persistence, toast/log/reveal and class-choice refresh remain thin injected composition responsibilities.\n- Deterministic tests pin class thresholds, compound gates, one-way persisted unlocks, Slime counting, observed Gold/Lifesteal progression and the exact historical dynamic-attempt order.\n- Registry text/data now matches shipped runtime truth for Alchemist (15 potion uses) and Rouge (10 Prestige points). No gameplay rebalance, RNG or save/checkpoint redesign is intended.\n\n'''
          if not text.startswith('# Unreleased — Beta 0.6.6.22'):
              notes.write_text(entry+text,encoding='utf-8')

          boundary=root/'tools/test_class_unlock_extraction_boundary.py'
          boundary.write_text(r'''#!/usr/bin/env python3
          from pathlib import Path
          import re

          ROOT=Path(__file__).resolve().parents[1]
          mono=(ROOT/'runtime/js/dicebound.js').read_text(encoding='utf-8')
          owner=(ROOT/'runtime/js/progression/class-unlock-rules.js').read_text(encoding='utf-8')
          registry=(ROOT/'runtime/js/classes/registry.js').read_text(encoding='utf-8')

          required_owner=[
              'apiVersion:2',
              'function isBaseUnlocked(',
              'function isUnlocked(',
              'function mayCommitUnlock(',
              'function recordObservedProgress(',
              'function resolveDynamic(',
              'function recordCombatFacts(',
              'function recordManaSpenderCast(',
          ]
          for token in required_owner:
              if token not in owner:
                  raise SystemExit(f'class unlock owner missing responsibility: {token}')

          required_adapters=[
              'function isClassUnlocked(id){return DB_CLASS_UNLOCK_RULES.isUnlocked(id,dbClassUnlockContext());}',
              'function baseClassUnlocked(id){return DB_CLASS_UNLOCK_RULES.isBaseUnlocked(id,dbClassUnlockContext());}',
              'function unlockClass(id){if(!DB_CLASS_UNLOCK_RULES.mayCommitUnlock(id,dbClassUnlockContext()))return false;return commitClassUnlock(id);}',
              'function checkDynamicClassUnlocks(){',
              'DB_CLASS_UNLOCK_RULES.resolveDynamic({getContext:()=>dbClassUnlockContext(),unlock:id=>unlockClass(id)});',
          ]
          for token in required_adapters:
              if token not in mono:
                  raise SystemExit(f'dicebound.js missing thin class-unlock adapter: {token}')

          retired=[
              'baseClassUnlocked=function',
              'isClassUnlocked=function',
              'unlockClass=function',
              'checkDynamicClassUnlocks=function',
              'baseClassUnlockedV15Patch',
              'checkDynamicClassUnlocksV15Patch',
              'baseClassUnlockedV16',
              'checkDynamicClassUnlocksV16',
              'baseClassUnlockedV18Base',
              'checkDynamicClassUnlocksV18Base',
              'checkDynamicClassUnlocksV19Base',
              'baseClassUnlockedV110',
              'checkDynamicClassUnlocksV110',
              'baseClassUnlockedV28Base',
              'checkDynamicClassUnlocksV28Base',
              'db046BaseClassUnlocked',
              'db046CheckDynamicClassUnlocks',
              'db047BaseClassUnlocked',
              'db047CheckDynamicClassUnlocks',
              'db0631IsClassUnlockedBase',
              'db0631BaseClassUnlockedBase',
              'db0631UnlockClassBase',
              'db0631CheckDynamicBase',
              'DB047_ALCHEMIST_REQUIREMENT',
              'V28_ALCHEMIST_REQUIREMENT',
              'alchemistRequirement=50',
          ]
          for token in retired:
              if token in mono:
                  raise SystemExit(f'retired class unlock shadow ownership remains in dicebound.js: {token}')

          if len(re.findall(r'\bfunction\s+isClassUnlocked\s*\(',mono))!=1:
              raise SystemExit('dicebound.js must contain exactly one isClassUnlocked adapter')
          if len(re.findall(r'\bfunction\s+baseClassUnlocked\s*\(',mono))!=1:
              raise SystemExit('dicebound.js must contain exactly one baseClassUnlocked adapter')
          if len(re.findall(r'\bfunction\s+unlockClass\s*\(',mono))!=1:
              raise SystemExit('dicebound.js must contain exactly one unlockClass adapter')
          if len(re.findall(r'\bfunction\s+checkDynamicClassUnlocks\s*\(',mono))!=1:
              raise SystemExit('dicebound.js must contain exactly one checkDynamicClassUnlocks adapter')

          for token in ['"unlock": "Use 15 potions across all runs"','alchemist:{type:"lifetimeStat",stat:"potionsUsed",minimum:15}','"unlock": "Reach 10 Prestige points"','rouge:{type:"prestige",count:10}']:
              if token not in registry:
                  raise SystemExit(f'class registry not reconciled to shipped unlock truth: {token}')

          print('Class unlock extraction boundary PASS')
          '''.replace('\n          ','\n').lstrip(),encoding='utf-8')

          index=root/'runtime/index.html'
          text=index.read_text(encoding='utf-8')
          text=text.replace('Player / Run Initialization ownership extraction.','Class Unlock Resolution ownership extraction.')
          index.write_text(text,encoding='utf-8')
          PY

      - name: Stamp Beta 0.6.6.22 identity
        shell: bash
        run: |
          python tools/set_project_version.py --version 0.6.6.22 --channel Beta
          python tools/refresh_runtime_manifest.py --version 0.6.6.22 --channel Beta --development-state Unreleased

      - name: Remove temporary extraction scaffolding
        shell: bash
        run: |
          rm -f tools/tmp_extract_class_unlock_resolution.py
          rm -f .github/workflows/tmp-class-unlock-census.yml

      - name: Validate release candidate
        shell: bash
        run: |
          node tools/test_class_unlock_rules.js
          node tools/test_0631_progression_slime_gear.js
          python tools/test_class_unlock_extraction_boundary.py
          python tools/validate_runtime_architecture.py
          python tools/validate_asset_architecture.py
          python tools/validate_version_identity.py --version 0.6.6.22 --channel Beta
          node --check runtime/js/progression/class-unlock-rules.js
          node --check runtime/js/dicebound.js
          git diff --check
          echo "MONOLITH_BYTES=$(wc -c < runtime/js/dicebound.js)"
          echo "MONOLITH_LINES=$(wc -l < runtime/js/dicebound.js)"

      - name: Create clean release-candidate commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: extract class unlock resolution"
          echo "FINAL_CANDIDATE_SHA=$(git rev-parse HEAD)"
          git push origin HEAD:candidate-0.6.6.22-class-unlock-resolution
