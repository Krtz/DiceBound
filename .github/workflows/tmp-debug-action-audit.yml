name: Temporary canonical debug-action materializer

on:
  push:
    branches:
      - refactor/0.6.6.38-canonical-functions
    paths:
      - .github/workflows/tmp-debug-action-audit.yml
      - tools/test_canonical_debug_action.py

permissions:
  contents: read

jobs:
  materialize:
    runs-on: windows-latest
    steps:
      - name: Mint repository App token
        id: app
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.DICEBOUND_RELEASE_APP_ID }}
          private-key: ${{ secrets.DICEBOUND_RELEASE_APP_PRIVATE_KEY }}
          owner: Krtz
          repositories: DiceBound
          permission-contents: write
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.app.outputs.token }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rewrite and validate debugAction
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python tools/tmp_materialize_debug_action.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          # The old monolith contains a few whitespace-only separator lines. The
          # rewrite touches their surrounding regions, so normalize them rather
          # than carrying patch-era trailing whitespace into the canonical tree.
          @'
          from pathlib import Path
          import re
          path=Path('runtime/js/dicebound.js')
          text=path.read_text(encoding='utf-8')
          text=re.sub(r'(?m)^[ \t]+$', '', text)
          path.write_text(text,encoding='utf-8',newline='\n')
          '@ | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          python tools/set_project_version.py --version 0.6.6.38 --channel Beta
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/refresh_runtime_manifest.py --version 0.6.6.38 --channel Beta --development-state Unreleased
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          python tools/test_canonical_debug_action.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/test_historical_layer_census.py --markdown docs/HISTORICAL_LAYER_CENSUS.md
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check runtime/js/dicebound.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/validate_runtime_architecture.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/validate_version_identity.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Commit exact validated tree
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Remove-Item tools/tmp_materialize_debug_action.py
          Remove-Item .github/workflows/tmp-debug-action-audit.yml
          Remove-Item docs/DEBUG_ACTION_AUDIT.md
          git config user.name "dicebound-manifest-publisher[bot]"
          git config user.email "323488390+dicebound-manifest-publisher[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Beta 0.6.6.38: canonicalize debug-action history"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git push origin HEAD:refactor/0.6.6.38-canonical-functions
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
