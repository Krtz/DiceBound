name: Temporary Merchant stock probe

on:
  push:
    branches:
      - arch/0.6.6.24-merchant-stock-resolution
    paths:
      - tools/test_merchant_stock_resolution.js
      - tools/fixtures/merchant_stock_0_6_6_23.json
      - .github/workflows/tmp-merchant-stock-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify released Merchant stock oracle
        shell: pwsh
        run: node tools/test_merchant_stock_resolution.js
