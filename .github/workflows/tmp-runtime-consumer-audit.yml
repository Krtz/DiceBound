name: Temporary Runtime consumer audit

on:
  push:
    branches:
      - arch/0.6.6.35-runtime-oracle
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-runtime-consumers:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Inventory direct Runtime peer consumers
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          import json,re
          root=Path('runtime/js')
          peers=['DiceboundVersion','DiceboundPlatform','DiceboundStorage','DiceboundSave','DiceboundRunCheckpoint','DiceboundCoreState','DiceboundRuntimeServices','DiceboundMemoryDiagnostics']
          owner_paths={
            'DiceboundVersion':'version.js',
            'DiceboundPlatform':'platform.js',
            'DiceboundStorage':'storage.js',
            'DiceboundSave':'save-system.js',
            'DiceboundRunCheckpoint':'core/run-checkpoint.js',
            'DiceboundCoreState':'core/state.js',
            'DiceboundRuntimeServices':'core/runtime-services.js',
            'DiceboundMemoryDiagnostics':'core/memory-diagnostics.js',
          }
          facade='core/facade.js'
          hits=[]
          for path in sorted(root.rglob('*.js')):
              rel=path.relative_to(root).as_posix()
              text=path.read_text(encoding='utf-8')
              for peer in peers:
                  count=len(re.findall(rf'window\.{re.escape(peer)}\b',text))
                  if count and rel not in {owner_paths[peer],facade}:
                      hits.append((rel,peer,count))
          print('DIRECT_RUNTIME_PEER_CONSUMERS')
          for hit in hits: print(' | '.join(map(str,hit)))
          manifest=json.loads((root/'module-manifest.json').read_text(encoding='utf-8'))
          peer_ids={'version','platform','storage','save-system','run-checkpoint','core-state','runtime-services','memory-diagnostics'}
          print('MANIFEST_RUNTIME_PEER_DEPENDENCIES')
          for module in manifest['modules']:
              if module['id'] in peer_ids|{'runtime-facade','dicebound-monolith'}: continue
              direct=[req for req in module.get('requires',[]) if req in peer_ids]
              if direct: print(f"{module['id']} | {','.join(direct)}")
          print(f'DIRECT_HIT_COUNT={len(hits)}')
          '@ | python -
