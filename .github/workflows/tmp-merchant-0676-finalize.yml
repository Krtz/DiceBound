name: TEMP finalize 0.6.7.6 merchant fix

on:
  push:
    branches:
      - fix/0.6.7.6-merchant-interactions-ui

permissions:
  contents: write

jobs:
  finalize:
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Reapply Merchant source patch
        shell: pwsh
        run: |
          $workflow = Get-Content .github/workflows/tmp-merchant-0676-materialize.yml -Raw
          $match = [regex]::Match($workflow, "(?ms)^          @'\r?\n(.*?)^          '@ \| Set-Content")
          if (-not $match.Success) { throw "Could not extract the materializer Python patch." }
          $python = (($match.Groups[1].Value -split "\r?\n") | ForEach-Object { $_ -replace '^          ', '' }) -join "`n"
          $patch = Join-Path $env:RUNNER_TEMP "merchant0676.py"
          [IO.File]::WriteAllText($patch, $python, [Text.UTF8Encoding]::new($false))
          python $patch
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Update Merchant ownership guard for new facade capability
        shell: pwsh
        run: |
          $path = "tools/test_merchant_stock_extraction_boundary.py"
          $text = Get-Content $path -Raw
          $old = 'const api=Object.freeze({configure,catalog,price,makeGear,buildStock,render,open,inspect,testing,owner:OWNER});'
          $new = 'const api=Object.freeze({configure,catalog,price,makeGear,buildStock,render,open,bindRoadTileInteraction,inspect,testing,owner:OWNER});'
          if (-not $text.Contains($old)) { throw "Expected stale Merchant facade API guard was not found." }
          $text = $text.Replace($old, $new)
          [IO.File]::WriteAllText((Resolve-Path $path), $text, [Text.UTF8Encoding]::new($false))

      - name: Stamp Beta 0.6.7.6
        shell: pwsh
        run: |
          python tools/set_project_version.py --version 0.6.7.6 --channel Beta
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/refresh_runtime_manifest.py --version 0.6.7.6 --channel Beta --development-state Unreleased
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Validate focused Merchant responsibility
        shell: pwsh
        run: |
          node --check runtime/js/events/merchant-facade.js
          node --check runtime/js/ui/merchant.js
          node --check runtime/js/ui/equipment-heirlooms.js
          node tools/test_merchant_facade.js
          node tools/test_merchant_transaction.js
          node tools/test_merchant_stock_resolution.js
          python tools/test_merchant_ui_extraction_boundary.py
          python tools/test_merchant_stock_extraction_boundary.py
          python tools/validate_runtime_architecture.py
          python tools/validate_version_identity.py --version 0.6.7.6 --channel Beta
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Validate real Edge Merchant revisit and rarity UI
        shell: pwsh
        run: |
          node tools/test_merchant_browser.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Validate complete source suite
        shell: pwsh
        run: |
          Get-ChildItem runtime/js -Recurse -Filter *.js | ForEach-Object { node --check $_.FullName; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE } }
          Get-ChildItem tools -Filter test_*.js | Where-Object { $_.Name -ne 'test_merchant_browser.js' } | ForEach-Object { node $_.FullName; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE } }
          Get-ChildItem tools -Filter test_*.py | ForEach-Object { python $_.FullName; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE } }
          python tools/validate_runtime_architecture.py
          python tools/validate_asset_architecture.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Commit exact validated tree
        shell: pwsh
        run: |
          git rm .github/workflows/tmp-merchant-0676-materialize.yml .github/workflows/tmp-merchant-0676-finalize.yml
          git config user.name "dicebound-ci"
          git config user.email "dicebound-ci@users.noreply.github.com"
          git add runtime tools wrapper-source
          git status --short
          git commit -m "Beta 0.6.7.6: fix Merchant revisit secret and rarity names"
          $sha = git rev-parse HEAD
          Write-Host "VALIDATED_COMMIT=$sha"
          git push origin HEAD:fix/0.6.7.6-merchant-interactions-ui
