name: Temporary 0.6.6.38 runtime manifest refresh

on:
  push:
    branches:
      - refactor/0.6.6.38-canonical-functions
    paths:
      - .github/workflows/tmp-refresh-06638-runtime-manifest.yml

permissions:
  contents: read

jobs:
  refresh:
    runs-on: windows-latest
    steps:
      - name: Mint repository App token
        id: app
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.DICEBOUND_RELEASE_APP_ID }}
          private-key: ${{ secrets.DICEBOUND_RELEASE_APP_PRIVATE_KEY }}
          owner: Krtz
          repositories: DiceBound
          permission-contents: write
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.app.outputs.token }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Materialize final 0.6.6.38 runtime identity
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          python tools/set_project_version.py --version 0.6.6.38 --channel Beta
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/refresh_runtime_manifest.py --version 0.6.6.38 --channel Beta --development-state Unreleased
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/validate_version_identity.py --version 0.6.6.38 --channel Beta
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/test_canonical_debug_action.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/test_canonical_debug_ui.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/test_canonical_tile_meta.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/test_canonical_apply_run_theme.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/test_canonical_return_to_road.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/test_canonical_mythical_set_summary.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/validate_runtime_architecture.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/validate_asset_architecture.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check runtime/js/dicebound.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $info = Get-Content runtime/build-info.json -Raw | ConvertFrom-Json
          if ($info.version -ne '0.6.6.38' -or $info.channel -ne 'Beta' -or $info.developmentState -ne 'Unreleased') { throw 'Materialized build-info identity is wrong.' }
          Write-Host "Materialized source hash: $($info.sourceHash)"
      - name: Commit final manifest and remove one-shot workflow
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Remove-Item .github/workflows/tmp-refresh-06638-runtime-manifest.yml
          git config user.name "dicebound-manifest-publisher[bot]"
          git config user.email "323488390+dicebound-manifest-publisher[bot]@users.noreply.github.com"
          git add -A
          git commit -m "build: refresh 0.6.6.38 runtime manifest"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git push origin HEAD:refactor/0.6.6.38-canonical-functions
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
