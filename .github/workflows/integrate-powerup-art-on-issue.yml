name: Integrate staged powerup art

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  integrate:
    if: github.event.issue.title == '[automation] Integrate staged powerup art'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Integrate staged assets and runtime mappings
        run: python tools/powerup-art-import/patch_runtime.py

      - name: Validate JavaScript syntax
        run: |
          node --check runtime/js/assets.js
          node --check runtime/js/dicebound.js

      - name: Validate mapped files
        run: |
          python - <<'PY'
          from pathlib import Path
          expected = sorted([
              'powerup-barbed-armor.png',
              'powerup-executioner.png',
              'powerup-faint-echo.png',
              'powerup-field-alchemy.png',
              'powerup-field-surgeon.png',
              'powerup-fortune-broker.png',
              'powerup-heavy-purse-worn.png',
              'powerup-lucky-pebble.png',
              'powerup-monster-notes.png',
              'powerup-phoenix-feather.png',
              'powerup-scholars-sigil.png',
              'powerup-second-wind.png',
              'powerup-sharper-blade.png',
              'powerup-spiked-armor.png',
              'powerup-stout-heart.png',
              'powerup-strong-brew.png',
              'powerup-tempered-guard.png',
              'powerup-treasure-sense.png',
              'powerup-walking-fortress.png',
              'powerup-worldheart.png',
          ])
          root = Path('runtime/assets/ui/powerups')
          actual = sorted(p.name for p in root.glob('*.png'))
          if actual != expected:
              raise SystemExit(f'Powerup art mismatch. expected={expected} actual={actual}')
          assets = Path('runtime/js/assets.js').read_text()
          game = Path('runtime/js/dicebound.js').read_text()
          for name in expected:
              if name not in assets:
                  raise SystemExit(f'assets.js does not reference {name}')
          for key in [
              'powerupSecondWind','powerupFieldAlchemy','powerupSharperBlade',
              'powerupTemperedGuard','powerupStoutHeart','powerupFaintEcho',
              'powerupSpikedArmor','powerupMonsterNotes','powerupLuckyPebble',
              'powerupHeavyPurseWorn','powerupFieldSurgeon','powerupStrongBrew',
              'powerupExecutioner','powerupWalkingFortress','powerupWorldheart',
              'powerupPhoenixFeather','powerupFortuneBroker','powerupTreasureSense',
              'powerupBarbedArmor','powerupScholarsSigil',
          ]:
              if key not in assets or key not in game:
                  raise SystemExit(f'Missing runtime mapping for {key}')
          print('Validated all 20 generated powerup art assets and mappings.')
          PY

      - name: Commit integrated runtime
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runtime/assets/ui/powerups runtime/js/assets.js runtime/js/dicebound.js
          if git diff --cached --quiet; then
            echo 'Nothing to commit'
          else
            git commit -m 'Wire generated powerup artwork'
            git push
          fi

      - name: Close trigger issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue close "${{ github.event.issue.number }}" --comment "Powerup-art integration workflow completed."
