name: Road Events Lifecycle Migration

on:
  push:
    branches:
      - arch/0.6.6.26-road-events-oracle

permissions:
  contents: write

jobs:
  migrate-and-validate:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Drain Road Events lifecycle from monolith
        shell: pwsh
        run: |
          python tools/migrate_road_events_lifecycle.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/patch_road_events_lazy_bind.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/refresh_runtime_manifest.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          @'
          from pathlib import Path
          for name in [
              'runtime/build-info.json','runtime/build-manifest.json','runtime/index.html',
              'runtime/js/dicebound.js','runtime/js/module-manifest.json','runtime/js/events/lifecycle.js'
          ]:
              p=Path(name)
              p.write_bytes(p.read_bytes().replace(b'\r\n',b'\n'))
          '@ | python -

      - name: Validate full Road Events migration
        shell: pwsh
        run: |
          node --check runtime/js/events/lifecycle.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/test_road_events_lifecycle_shadow.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/test_road_events_facade.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/test_road_event_treasure.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/test_road_event_treasure_shadow.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/test_road_events_oracle.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/test_event_reward_policy.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/test_board_tile_dispatch.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/test_run_facade.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/test_run_checkpoint.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/test_powerup_services.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/test_loot_module.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/validate_runtime_architecture.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/test_runtime_manifest_hash.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Materialize validated Road Events lifecycle migration
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          @'
          import base64,json,os,subprocess,urllib.request
          from pathlib import Path
          repo=os.environ['GITHUB_REPOSITORY']
          token=os.environ['GH_TOKEN']
          parent=os.environ['GITHUB_SHA']
          api=f"https://api.github.com/repos/{repo}/git"
          def post(path,payload):
              req=urllib.request.Request(api+path,data=json.dumps(payload).encode(),headers={
                  'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json',
                  'X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json'},method='POST')
              with urllib.request.urlopen(req) as r:return json.load(r)
          changed=subprocess.check_output(['git','diff','--name-only','--diff-filter=ACMRT','HEAD'],text=True).splitlines()
          if not changed: raise SystemExit('no Road Events lifecycle migration changes produced')
          entries=[]
          for filename in changed:
              raw=Path(filename).read_bytes()
              blob=post('/blobs',{'content':base64.b64encode(raw).decode(),'encoding':'base64'})
              entries.append({'path':filename,'mode':'100644','type':'blob','sha':blob['sha']})
          tree=post('/trees',{'base_tree':subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip(),'tree':entries})
          commit=post('/commits',{'message':'architecture: extract remaining Road Events lifecycle','tree':tree['sha'],'parents':[parent]})
          print('CHANGED_FILES='+','.join(changed))
          print('REMOTE_COMMIT_SHA='+commit['sha'])
          '@ | python -
