name: Classes oracle materializer

on:
  push:
    branches:
      - arch/0.6.6.34-classes-oracle
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.7"

      - name: Materialize Classes characterization seam
        shell: pwsh
        run: |
          python tools/materialize_classes_oracle.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check runtime/js/dicebound.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check tools/test_classes_oracle.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Refresh runtime build metadata for exact oracle runtime
        shell: pwsh
        run: |
          python tools/refresh_runtime_manifest.py --version 0.6.6.33 --channel Beta --development-state Unreleased --notes "Materialized Classes oracle baseline for released Beta 0.6.6.33."
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Capture exact released 0.6.6.33 Classes fixture
        shell: pwsh
        run: |
          $env:DICEBOUND_CAPTURE_CLASSES = "1"
          $lines = @(node tools/test_classes_oracle.js)
          $exit = $LASTEXITCODE
          $env:DICEBOUND_CAPTURE_CLASSES = $null
          $lines | ForEach-Object { Write-Host $_ }
          if ($exit -ne 0) { exit $exit }
          $start = [Array]::IndexOf($lines, "CLASSES_FIXTURE_BEGIN")
          $end = [Array]::IndexOf($lines, "CLASSES_FIXTURE_END")
          if ($start -lt 0 -or $end -le $start) { throw "Classes fixture markers missing from capture output." }
          New-Item -ItemType Directory -Force tools/fixtures | Out-Null
          $json = ($lines[($start + 1)..($end - 1)] -join "`n") + "`n"
          [System.IO.File]::WriteAllText((Join-Path $PWD "tools/fixtures/classes_0_6_6_33.json"), $json, [System.Text.UTF8Encoding]::new($false))

      - name: Replay permanent Classes oracle
        shell: pwsh
        run: |
          node tools/test_classes_oracle.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run complete JavaScript and Python gate
        shell: pwsh
        run: |
          Get-ChildItem runtime/js -Recurse -Filter *.js | ForEach-Object { node --check $_.FullName; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE } }
          Get-ChildItem tools -Filter test_*.js | ForEach-Object { node $_.FullName; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE } }
          Get-ChildItem tools -Filter test_*.py | ForEach-Object { python $_.FullName; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE } }

      - name: Validate architecture and assets
        shell: pwsh
        run: |
          python tools/validate_runtime_architecture.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/validate_asset_architecture.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/validate_launcher_assets.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Validate installer Go sources
        shell: pwsh
        run: |
          go test .\installer\main_v2.go .\installer\http_policy.go .\installer\main_v2_test.go
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go vet .\installer\main_v2.go .\installer\http_policy.go .\installer\main_v2_test.go
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Materialize exact tested Classes oracle checkpoint
        shell: pwsh
        run: |
          Remove-Item tools/materialize_classes_oracle.py -Force
          Remove-Item .github/workflows/classes-oracle-materialize.yml -Force
          git status --short
          git diff --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git config user.name "dicebound-architecture-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "test: freeze released 0.6.6.33 Classes behavior"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $sha = git rev-parse HEAD
          Write-Host "CLASSES_ORACLE_COMMIT=$sha"
          git push origin "HEAD:arch/0.6.6.34-classes-oracle"
