name: TEMP 0.6.7.3 Road Dice materializer

on:
  push:
    branches:
      - fix/0.6.7.3-double-dice-roll-lock

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Materialize ownership cleanup
        run: python tools/tmp_materialize_0673.py
      - name: Materialize version identity
        run: |
          printf '%s\n' '# DiceBound Beta 0.6.7.3' '' '## Road Dice ownership cleanup' '' '- Fixed the 2d6 hard lock caused by invoking an already-resolved RNG number as a function.' '- DiceboundRunDice now owns both 1d6 and 2d6 road rolls, Fate choice UI, roll controls, Long Stride and Titanstep roll behavior.' '- Removed the old 1d6 implementation, Fate chooser state, duplicated dice faces and v2.5 rollDice replacement wrapper from dicebound.js.' '- Primary button and keyboard rolling now delegate directly to the canonical Run Dice owner.' '- Normalized lifetime roll accounting so every completed 1d6/2d6 road roll increments run and lifetime roll counters exactly once.' '- Added deterministic coverage for 1d6/2d6, Fate, Long Stride, Titanstep, failure recovery and monolith anti-return ownership.' > runtime/release-notes/0.6.7.3.md
          python tools/set_project_version.py --version 0.6.7.3 --channel Beta
          python tools/refresh_runtime_manifest.py --version 0.6.7.3 --channel Beta --development-state Unreleased
      - name: Validate
        run: |
          node --check runtime/js/run/dice.js
          node --check runtime/js/dicebound.js
          node tools/test_run_dice.js
          node tools/test_runtime_oracle.js
          python tools/validate_runtime_architecture.py
      - name: Commit materialized tree
        run: |
          git rm .github/workflows/tmp-0673-run-dice-test.yml tools/tmp_materialize_0673.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Beta 0.6.7.3 — canonicalize road dice ownership (#371)"
          git push origin HEAD:fix/0.6.7.3-double-dice-roll-lock
