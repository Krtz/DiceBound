name: TEMP materialize 0.6.7.6 merchant fix

on:
  push:
    branches:
      - fix/0.6.7.6-merchant-interactions-ui

permissions:
  contents: write

jobs:
  materialize:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply merchant ownership patch
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          def load(path): return Path(path).read_text(encoding='utf-8')
          def save(path,text): Path(path).write_text(text,encoding='utf-8',newline='\n')
          def once(text,old,new,label):
              if text.count(old)!=1:
                  raise SystemExit(f'{label}: expected exactly one match, got {text.count(old)}')
              return text.replace(old,new,1)

          # Canonical equipment rarity-name presentation helper.
          path='runtime/js/ui/equipment-heirlooms.js'; text=load(path)
          old='  function itemNameMarkup(item,klass=\'\'){const art=artMarkup(item,klass),name=`<span class="db-rarity-name db-rarity-${escapeHtml(String(item?.rarity||\'common\').toLowerCase())}">${escapeHtml(item?.name||\'Equipment\')}</span>`;return art?`${art}${name}`:`${escapeHtml(item?.icon||\'\')} ${name}`;}'
          new='''  function rarityNameMarkup(item){\n    const rarityId=escapeHtml(String(item?.rarity||"common").toLowerCase());\n    return `<span class="db-rarity-name db-rarity-${rarityId}">${escapeHtml(item?.name||"Equipment")}</span>`;\n  }\n  function itemNameMarkup(item,klass=''){const art=artMarkup(item,klass),name=rarityNameMarkup(item);return art?`${art}${name}`:`${escapeHtml(item?.icon||'')} ${name}`;}'''
          text=once(text,old,new,'equipment rarity helper')
          old='  const api=Object.freeze({configure,renderEquipment,renderLoot,renderCampStorage,renderEndGear,renderEndStorageManager,campView,inspect,owner:OWNER});'
          new='  const api=Object.freeze({configure,renderEquipment,renderLoot,renderCampStorage,renderEndGear,renderEndStorageManager,campView,rarityNameMarkup,inspect,owner:OWNER});'
          text=once(text,old,new,'equipment api')
          save(path,text)

          # Merchant UI consumes canonical rarity markup and escapes ordinary names.
          path='runtime/js/ui/merchant.js'; text=load(path)
          old='''  function isLegendaryChoiceOffer(item){\n    return !!item?.alphaChooseLegendary || /Sovereign Relic|Legendary Contract/i.test(item?.name || "");\n  }'''
          new='''  function isLegendaryChoiceOffer(item){\n    return !!item?.alphaChooseLegendary || /Sovereign Relic|Legendary Contract/i.test(item?.name || "");\n  }\n  function escapeHtml(value){return String(value??"").replace(/[&<>\'\"]/g,char=>({"&":"&amp;","<":"&lt;",">":"&gt;","\'":"&#39;","\\\"":"&quot;"}[char]));}'''
          text=once(text,old,new,'merchant escape helper')
          text=once(text,'"formatGearComparison","gearPowerScore","confirmWeakerGear"','"formatGearComparison","gearNameMarkup","gearPowerScore","confirmWeakerGear"','merchant required gear markup')
          old='''        const comparison=item.gear?`<div class="shop-compare">${services.formatGearComparison(item.gear,player.equipment[item.gear.slot])}</div>`:"";\n        btn.innerHTML=`<div class="shop-item-top"><span class="shop-item-icon">${item.icon}</span><span class="shop-price">${sold?"SOLD":price+"g"}</span></div><div class="shop-item-name">${item.name}</div><div class="shop-item-desc">${item.desc}</div>${comparison}`;'''
          new='''        const comparison=item.gear?`<div class="shop-compare">${services.formatGearComparison(item.gear,player.equipment[item.gear.slot])}</div>`:"";\n        const nameMarkup=item.gear?services.gearNameMarkup(item.gear):escapeHtml(item.name);\n        btn.innerHTML=`<div class="shop-item-top"><span class="shop-item-icon">${item.icon}</span><span class="shop-price">${sold?"SOLD":price+"g"}</span></div><div class="shop-item-name">${nameMarkup}</div><div class="shop-item-desc">${item.desc}</div>${comparison}`;'''
          text=once(text,old,new,'merchant item name presentation')
          text=text.replace('services.setNotice(`<b>${item.name} purchased.</b> Choose one Legendary power.`)','services.setNotice(`<b>${escapeHtml(item.name)} purchased.</b> Choose one Legendary power.`)')
          text=text.replace('else services.setNotice(`<b>${item.name} claimed:</b> ${chosen.name}.`);','else services.setNotice(`<b>${escapeHtml(item.name)} claimed:</b> ${escapeHtml(chosen.name)}.`);')
          text=text.replace('services.setNotice(`<b>Relic opened:</b> ${rarity.label} <b>${result.name}</b><br>${result.desc}`)','services.setNotice(`<b>Relic opened:</b> ${escapeHtml(rarity.label)} <b>${escapeHtml(result.name)}</b><br>${result.desc}`)')
          text=text.replace('services.setNotice(`Equipped <b>${item.gear.name}</b>.<br>${services.formatBonuses(item.gear)}`)','services.setNotice(`Equipped <b>${escapeHtml(item.gear.name)}</b>.<br>${services.formatBonuses(item.gear)}`)')
          save(path,text)

          # Merchant facade owns the secret road-tile interaction lifecycle.
          path='runtime/js/events/merchant-facade.js'; text=load(path)
          anchor='''  function render(){return requireUi().render();}\n  function open(){'''
          insert='''  function render(){return requireUi().render();}\n  function bindRoadTileInteraction(element,tile,index){\n    if(tile?.type!=="merchant"||!element?.querySelector)return false;\n    const face=element.querySelector(".tile-icon");\n    if(!face)return false;\n    const isFaceActivated=requireFn("secret","isFaceActivated");\n    face.title="Click every merchant face on this board for a secret.";\n    face.classList?.toggle?.("merchant-primed",!!isFaceActivated(index));\n    if(face.dataset?.merchantSecretBound==="1")return true;\n    if(face.dataset)face.dataset.merchantSecretBound="1";\n    face.addEventListener("click",event=>{\n      event.stopPropagation();\n      const result=requireFn("secret","activateFace")(index)||{};\n      face.classList?.add?.("merchant-primed");\n      requireFn("secret","toast")(`Merchant faces: ${Number(result.count)||0}/${Number(result.total)||0}`);\n      if(result.primedNow){\n        requireFn("secret","log")("Every merchant portrait smiles at once. <b>The next merchant is waiting for a fight.</b>");\n        requireFn("secret","toast")("🧔 Secret merchant boss primed!");\n      }\n    });\n    return true;\n  }\n  function open(){'''
          text=once(text,anchor,insert,'merchant road interaction owner')
          old="configured:Object.freeze({stock:!!stock,ui:!!ui,state:!!runtime.state}),"
          new="configured:Object.freeze({stock:!!stock,ui:!!ui,state:!!runtime.state,secret:!!runtime.secret}),"
          text=once(text,old,new,'merchant inspect secret')
          old='  const api=Object.freeze({configure,catalog,price,makeGear,buildStock,render,open,inspect,testing,owner:OWNER});'
          new='  const api=Object.freeze({configure,catalog,price,makeGear,buildStock,render,open,bindRoadTileInteraction,inspect,testing,owner:OWNER});'
          text=once(text,old,new,'merchant facade api')
          save(path,text)

          # Composition: no Merchant secret click implementation remains in dicebound.js.
          path='runtime/js/dicebound.js'; text=load(path)
          inline=''';if(tile.type==="merchant"){const face=el.querySelector(".tile-icon");face.title="Click every merchant face on this board for a secret.";face.addEventListener("click",ev=>{ev.stopPropagation();merchantFaceClicks.add(index);face.classList.add("merchant-primed");showToast(`Merchant faces: ${merchantFaceClicks.size}/${merchantFaceTotal}`);if(merchantFaceClicks.size>=merchantFaceTotal&&!merchantBossDefeatedThisBoard){merchantBossPrimed=true;addLog("Every merchant portrait smiles at once. <b>The next merchant is waiting for a fight.</b>");showToast("🧔 Secret merchant boss primed!");}});}board.appendChild'''
          text=once(text,inline,';dbMerchant?.bindRoadTileInteraction?.(el,tile,index);board.appendChild','remove inline merchant tile listener')
          old='''    el.innerHTML=`<span class="tile-number">${index+1}</span><span class="tile-icon">${icon}</span><span class="tile-label">${label}</span>`;\n  }'''
          new='''    el.innerHTML=`<span class="tile-number">${index+1}</span><span class="tile-icon">${icon}</span><span class="tile-label">${label}</span>`;\n    dbMerchant?.bindRoadTileInteraction?.(el,tile,index);\n  }'''
          text=once(text,old,new,'refreshTile rebind')
          old='      formatGearComparison:(item,current)=>dbItems.formatComparison(item,current),gearPowerScore:item=>dbItems.score(item),'
          new='      formatGearComparison:(item,current)=>dbItems.formatComparison(item,current),gearNameMarkup:item=>window.DiceboundEquipmentHeirlooms.rarityNameMarkup(item),gearPowerScore:item=>dbItems.score(item),'
          text=once(text,old,new,'merchant canonical gear names')
          old='''      rarityInfoFor:rarity=>rarityInfo[rarity],showToast:(...args)=>showToast(...args),updateHud:()=>updateHUD(),\n      openLegendaryChoice:(source,done)=>db0410OpenSovereignChoice(source,done),schedule:(fn,ms)=>setTimeout(fn,ms)\n    }\n  });'''
          new='''      rarityInfoFor:rarity=>rarityInfo[rarity],showToast:(...args)=>showToast(...args),updateHud:()=>updateHUD(),\n      openLegendaryChoice:(source,done)=>db0410OpenSovereignChoice(source,done),schedule:(fn,ms)=>setTimeout(fn,ms)\n    },\n    secret:{\n      isFaceActivated:index=>merchantFaceClicks.has(index),\n      activateFace:index=>{\n        const before=merchantFaceClicks.size;merchantFaceClicks.add(index);const count=merchantFaceClicks.size;\n        const primedNow=count>=merchantFaceTotal&&!merchantBossDefeatedThisBoard&&!merchantBossPrimed;\n        if(primedNow)merchantBossPrimed=true;\n        return {count,total:merchantFaceTotal,added:count>before,primedNow};\n      },\n      toast:(...args)=>showToast(...args),log:text=>addLog(text)\n    }\n  });'''
          text=once(text,old,new,'merchant secret composition')
          save(path,text)

          # Merchant facade deterministic road-interaction coverage.
          path='tools/test_merchant_facade.js'; text=load(path)
          old='''let items=[],notice="old",title="",subtitle="",visible=false;\nmerchant.configure({\n  stock:{random:()=>.5},\n  state:{getItems:()=>items,setItems:v=>{items=v;calls.push("state:items");},getNotice:()=>notice,setNotice:v=>{notice=v;calls.push("state:notice");},setTitle:v=>{title=v;calls.push("state:title");},setSubtitle:v=>{subtitle=v;calls.push("state:subtitle");},setVisible:v=>{visible=v;calls.push("state:visible");}},\n  ui:{$:()=>({})}\n});'''
          new='''let items=[],notice="old",title="",subtitle="",visible=false;\nconst activated=new Set(),secretMessages=[];let primed=false;\nmerchant.configure({\n  stock:{random:()=>.5},\n  state:{getItems:()=>items,setItems:v=>{items=v;calls.push("state:items");},getNotice:()=>notice,setNotice:v=>{notice=v;calls.push("state:notice");},setTitle:v=>{title=v;calls.push("state:title");},setSubtitle:v=>{subtitle=v;calls.push("state:subtitle");},setVisible:v=>{visible=v;calls.push("state:visible");}},\n  ui:{$:()=>({})},\n  secret:{\n    isFaceActivated:index=>activated.has(index),\n    activateFace:index=>{const before=activated.size;activated.add(index);const primedNow=activated.size>=2&&!primed;if(primedNow)primed=true;return {count:activated.size,total:2,added:activated.size>before,primedNow};},\n    toast:text=>secretMessages.push(`toast:${text}`),log:text=>secretMessages.push(`log:${text}`)\n  }\n});'''
          text=once(text,old,new,'facade test config')
          old='''const inspected=merchant.inspect();assert.equal(inspected.configured.stock,true);assert.equal(inspected.configured.ui,true);assert.equal(inspected.owner,"merchant/facade");\nconsole.log("Merchant facade ownership tests passed");'''
          new='''const inspected=merchant.inspect();assert.equal(inspected.configured.stock,true);assert.equal(inspected.configured.ui,true);assert.equal(inspected.configured.secret,true);assert.equal(inspected.owner,"merchant/facade");\nfunction fakeTile(){const classes=new Set(),listeners={};const face={title:"",dataset:{},classList:{add:c=>classes.add(c),toggle:(c,on)=>on?classes.add(c):classes.delete(c)},addEventListener:(type,fn)=>{listeners[type]=fn;}};return {element:{querySelector:s=>s===".tile-icon"?face:null},face,classes,listeners};}\nconst first=fakeTile();assert.equal(merchant.bindRoadTileInteraction(first.element,{type:"merchant"},3),true);assert.match(first.face.title,/secret/i);let stopped=0;first.listeners.click({stopPropagation:()=>stopped++});assert.equal(stopped,1);assert.deepEqual([...activated],[3]);\nconst revisited=fakeTile();merchant.bindRoadTileInteraction(revisited.element,{type:"merchant"},3);assert.equal(revisited.classes.has("merchant-primed"),true,"re-rendered Merchant face must restore activated presentation");revisited.listeners.click({stopPropagation(){}});assert.deepEqual([...activated],[3],"revisiting/clicking one Merchant face must not double-count it");\nconst second=fakeTile();merchant.bindRoadTileInteraction(second.element,{type:"merchant"},7);second.listeners.click({stopPropagation(){}});assert.deepEqual([...activated].sort((a,b)=>a-b),[3,7]);assert.equal(primed,true);assert.equal(secretMessages.filter(x=>x.includes("Secret merchant boss primed")).length,1,"secret boss should prime exactly once");\nconsole.log("Merchant facade ownership tests passed");'''
          text=once(text,old,new,'facade test secret interaction')
          save(path,text)

          # Anti-return + escaping/canonical rarity checks in Merchant transaction coverage.
          path='tools/test_merchant_transaction.js'; text=load(path)
          text=once(text,'require("../runtime/js/events/merchant-transaction.js");','require("../runtime/js/events/merchant-transaction.js");\nrequire("../runtime/js/ui/equipment-heirlooms.js");','load equipment presentation helper')
          anchor='const merchantFacade = fs.readFileSync("runtime/js/events/merchant-facade.js", "utf8");\n'
          insert='''const merchantFacade = fs.readFileSync("runtime/js/events/merchant-facade.js", "utf8");\nconst rarityMarkup=window.DiceboundEquipmentHeirlooms.rarityNameMarkup({name:'<img src=x onerror=1>Arc',rarity:'epic'});\nassert.match(rarityMarkup,/db-rarity-epic/);\nassert.doesNotMatch(rarityMarkup,/<img/,"canonical rarity-name presentation must escape equipment names");\nassert.match(rarityMarkup,/&lt;img/,"escaped equipment name should remain visible text");\n'''
          text=once(text,anchor,insert,'rarity presentation test')
          anchor='assert.match(merchantUi, /tx\\.settleChoice/, "Merchant UI owner must settle Legendary choices through the transaction owner");\n'
          insert='''assert.match(merchantUi, /tx\\.settleChoice/, "Merchant UI owner must settle Legendary choices through the transaction owner");\nassert.match(merchantUi, /services\\.gearNameMarkup\\(item\\.gear\\)/, "Merchant gear names must use canonical equipment rarity presentation");\nassert.match(merchantFacade, /function bindRoadTileInteraction\\(/, "Merchant facade must own the road-face interaction lifecycle");\nassert.match(monolith, /dbMerchant\\?\\.bindRoadTileInteraction\\?\\.\\(el,tile,index\\)/, "board render/refresh must route Merchant face binding through the Merchant facade");\nassert.doesNotMatch(monolith, /merchantFaceClicks\\.add\\(index\\);face\\.classList/, "inline Merchant secret click implementation returned to dicebound.js");\n'''
          text=once(text,anchor,insert,'merchant anti-return tests')
          save(path,text)

          # Real Edge regression: canonical rarity class + re-bound secret face after refresh/revisit.
          path='tools/test_merchant_browser.js'; text=load(path)
          old='''      const shop=[...document.querySelectorAll('#shopGrid .shop-item')],ordinary=shop.find(button=>!button.querySelector('.shop-compare')&&!button.disabled),goldBefore=Number(document.getElementById('merchantGold')?.textContent||0);\n      ordinary?.click();await new Promise(resolve=>setTimeout(resolve,100));\n      const debug=window.DiceboundDebugLog?.lines?.()||[];\n      return {version:window.DiceboundVersion?.version,merchantHidden:document.getElementById('merchantOverlay')?.classList.contains('hidden'),shopItems:shop.length,comparisons:document.querySelectorAll('#shopGrid .shop-compare').length,comparisonText:document.querySelector('#shopGrid .shop-compare')?.textContent||'',sold:document.querySelectorAll('#shopGrid .shop-item.sold').length,goldBefore,goldAfter:Number(document.getElementById('merchantGold')?.textContent||0),debug};'''
          new='''      const shop=[...document.querySelectorAll('#shopGrid .shop-item')],gearOffer=shop.find(button=>button.querySelector('.shop-compare')),rarityName=gearOffer?.querySelector('.shop-item-name .db-rarity-name'),ordinary=shop.find(button=>!button.querySelector('.shop-compare')&&!button.disabled),goldBefore=Number(document.getElementById('merchantGold')?.textContent||0);\n      ordinary?.click();await new Promise(resolve=>setTimeout(resolve,100));\n      document.getElementById('merchantContinueBtn')?.click();await new Promise(resolve=>setTimeout(resolve,80));\n      window.DiceboundBoardTileDispatch.dispatch();await new Promise(resolve=>setTimeout(resolve,80));\n      const refreshedFace=document.querySelector('.tile.current.merchant .tile-icon')||document.querySelector('.tile.merchant .tile-icon');refreshedFace?.click();await new Promise(resolve=>setTimeout(resolve,40));\n      const merchantState=window.DiceboundRunResumeTest.snapshot()?.run?.merchant||null;\n      const debug=window.DiceboundDebugLog?.lines?.()||[];\n      return {version:window.DiceboundVersion?.version,merchantHidden:document.getElementById('merchantOverlay')?.classList.contains('hidden'),shopItems:shop.length,comparisons:document.querySelectorAll('#shopGrid .shop-compare').length,comparisonText:document.querySelector('#shopGrid .shop-compare')?.textContent||'',rarityClass:rarityName?.className||'',sold:document.querySelectorAll('#shopGrid .shop-item.sold').length,goldBefore,goldAfter:Number(document.getElementById('merchantGold')?.textContent||0),merchantState,refreshedFacePrimed:refreshedFace?.classList.contains('merchant-primed')||false,debug};'''
          text=once(text,old,new,'merchant browser result')
          anchor='''    if(result.comparisons<1)throw new Error(`Merchant gear comparison did not render: ${JSON.stringify(result)}`);\n    if(result.sold<1||!(result.goldAfter<result.goldBefore))throw new Error(`Merchant purchase transaction did not complete: ${JSON.stringify(result)}`);'''
          insert='''    if(result.comparisons<1)throw new Error(`Merchant gear comparison did not render: ${JSON.stringify(result)}`);\n    if(!/db-rarity-/.test(result.rarityClass))throw new Error(`Merchant gear name did not use canonical rarity presentation: ${JSON.stringify(result)}`);\n    if(!result.refreshedFacePrimed||!result.merchantState?.bossPrimed||result.merchantState?.faceClicks?.length!==1)throw new Error(`Revisited Merchant face did not survive tile refresh/rebind: ${JSON.stringify(result)}`);\n    if(result.sold<1||!(result.goldAfter<result.goldBefore))throw new Error(`Merchant purchase transaction did not complete: ${JSON.stringify(result)}`);'''
          text=once(text,anchor,insert,'merchant browser assertions')
          save(path,text)

          Path('runtime/release-notes/0.6.7.6.md').write_text('''# Beta 0.6.7.6\n\n## Merchant interaction + rarity presentation\n\n- Fixed Merchant secret-boss face interactions disappearing after a Merchant tile refresh/revisit.\n- Merchant road-face binding now belongs to the canonical `DiceboundMerchant` facade and restores already-activated face presentation after re-render.\n- Duplicate clicks on one Merchant face remain idempotent and the secret boss primes only once.\n- Merchant equipment names now reuse canonical equipment rarity-name presentation, including safe HTML escaping.\n- Added deterministic facade/anti-return coverage and a real Edge regression for refresh/revisit activation plus rarity-colored Merchant gear names.\n''',encoding='utf-8',newline='\n')
          '@ | Set-Content -Encoding UTF8 $env:RUNNER_TEMP\merchant0676.py
          python $env:RUNNER_TEMP\merchant0676.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Stamp Beta 0.6.7.6
        shell: pwsh
        run: |
          python tools/set_project_version.py --version 0.6.7.6 --channel Beta
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/refresh_runtime_manifest.py --version 0.6.7.6 --channel Beta --development-state Unreleased
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Validate focused Merchant slice
        shell: pwsh
        run: |
          node --check runtime/js/events/merchant-facade.js
          node --check runtime/js/ui/merchant.js
          node --check runtime/js/ui/equipment-heirlooms.js
          node tools/test_merchant_facade.js
          node tools/test_merchant_transaction.js
          node tools/test_merchant_stock_resolution.js
          node tools/test_merchant_ui_extraction_boundary.py 2>$null
          if ($LASTEXITCODE -ne 0) { $global:LASTEXITCODE=0 }
          python tools/test_merchant_ui_extraction_boundary.py
          python tools/test_merchant_stock_extraction_boundary.py
          python tools/validate_runtime_architecture.py
          python tools/validate_version_identity.py --version 0.6.7.6 --channel Beta --release-notes runtime/release-notes/0.6.7.6.md
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Validate complete source suite
        shell: pwsh
        run: |
          Get-ChildItem runtime/js -Recurse -Filter *.js | ForEach-Object { node --check $_.FullName; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE } }
          Get-ChildItem tools -Filter test_*.js | Where-Object { $_.Name -ne 'test_merchant_browser.js' } | ForEach-Object { node $_.FullName; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE } }
          Get-ChildItem tools -Filter test_*.py | ForEach-Object { python $_.FullName; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE } }
          python tools/validate_runtime_architecture.py
          python tools/validate_asset_architecture.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Remove materializer and commit exact validated tree
        shell: pwsh
        run: |
          git rm .github/workflows/tmp-merchant-0676-materialize.yml
          git config user.name "dicebound-ci"
          git config user.email "dicebound-ci@users.noreply.github.com"
          git add runtime tools wrapper-source
          git status --short
          git commit -m "Beta 0.6.7.6: fix Merchant revisit secret and rarity names"
          $sha = git rev-parse HEAD
          Write-Host "VALIDATED_COMMIT=$sha"
          git push origin HEAD:fix/0.6.7.6-merchant-interactions-ui
