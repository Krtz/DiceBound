name: Temporary materialize 0.6.7.21

on:
  push:
    branches:
      - fix/0.6.7.21-career-visible-panel

permissions:
  contents: read

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/0.6.7.21-career-visible-panel
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Stamp and materialize
        shell: bash
        run: |
          set -euo pipefail
          python tools/set_project_version.py --version 0.6.7.21 --channel Beta
          python tools/refresh_runtime_manifest.py --version 0.6.7.21 --channel Beta --development-state Unreleased
          python tools/prepare_release.py
          mkdir -p materialized/runtime/js materialized/wrapper-source/config materialized/wrapper-source/wrappers/webview2/native-go materialized/wrapper-source/release/generated
          cp runtime/build-info.json materialized/runtime/build-info.json
          cp runtime/build-manifest.json materialized/runtime/build-manifest.json
          cp runtime/index.html materialized/runtime/index.html
          cp runtime/js/version.js materialized/runtime/js/version.js
          cp wrapper-source/config/project.json materialized/wrapper-source/config/project.json
          cp wrapper-source/wrappers/webview2/native-go/main.go materialized/wrapper-source/wrappers/webview2/native-go/main.go
          cp wrapper-source/release/generated/release-spec.json materialized/wrapper-source/release/generated/release-spec.json
          cp wrapper-source/release/generated/release-notes.md materialized/wrapper-source/release/generated/release-notes.md
      - uses: actions/upload-artifact@v4
        with:
          name: materialized-0.6.7.21
          path: materialized
