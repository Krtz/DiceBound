name: Temporary materialize 0.6.7.21

on:
  push:
    branches:
      - fix/0.6.7.21-career-visible-panel

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/0.6.7.21-career-visible-panel
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Stamp and materialize
        shell: bash
        run: |
          set -euo pipefail
          python tools/set_project_version.py --version 0.6.7.21 --channel Beta
          python tools/refresh_runtime_manifest.py --version 0.6.7.21 --channel Beta --development-state Unreleased
          python tools/prepare_release.py
          git rm .github/workflows/tmp-materialize-0.6.7.21.yml
          git status --short
      - name: Commit generated identity
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "release: materialize Beta 0.6.7.21"
          git push origin HEAD:fix/0.6.7.21-career-visible-panel
