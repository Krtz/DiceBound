name: Materialize Merchant release subtitle

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  materialize:
    if: github.head_ref == 'fix/merchant-tile-visit-state'
    runs-on: windows-2022
    steps:
      - name: Mint DiceBound release App token
        id: release_app
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.DICEBOUND_RELEASE_APP_ID }}
          private-key: ${{ secrets.DICEBOUND_RELEASE_APP_PRIVATE_KEY }}
          owner: Krtz
          repositories: DiceBound
          permission-contents: write
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          token: ${{ steps.release_app.outputs.token }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Materialize corrected subtitle
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          path = Path('runtime/index.html')
          text = path.read_text(encoding='utf-8')
          old = 'Beta v0.6.6.18 · Info/Guide shadow-ownership cleanup.'
          new = 'Beta v0.6.6.18 · Merchant tile hotfix.'
          if old in text:
              path.write_text(text.replace(old, new, 1), encoding='utf-8')
          elif new not in text:
              raise SystemExit('Expected release subtitle was not found')
          '@ | Set-Content -Encoding utf8 .\fix_subtitle.py
          python .\fix_subtitle.py
          Remove-Item .\fix_subtitle.py
          python tools/refresh_runtime_manifest.py --version 0.6.6.18 --channel Beta --development-state Unreleased
      - name: Commit corrected identity
        shell: pwsh
        run: |
          git config user.name "dicebound-release-bot"
          git config user.email "actions@users.noreply.github.com"
          git add runtime/index.html runtime/build-info.json runtime/build-manifest.json
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { exit 0 }
          git commit -m "Correct Beta 0.6.6.18 Merchant release subtitle"
          git push origin HEAD:${{ github.head_ref }}