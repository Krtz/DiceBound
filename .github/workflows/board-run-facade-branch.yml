name: Board Run Facade Branch Helper

on:
  push:
    branches:
      - arch/0.6.6.25-board-run-facade

permissions:
  contents: write

jobs:
  wire-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Wire facade into authoritative load graph
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          manifest_path = Path('runtime/js/module-manifest.json')
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))

          if 'run-facade' not in manifest['loadOrder']:
              at = manifest['loadOrder'].index('run-completion') + 1
              manifest['loadOrder'].insert(at, 'run-facade')

          if not any(module['id'] == 'run-facade' for module in manifest['modules']):
              facade = {
                  'id': 'run-facade',
                  'path': 'js/run/facade.js',
                  'domain': 'run/public-board-and-run-subsystem-facade',
                  'status': 'extracted',
                  'requires': [
                      'board-registry',
                      'board-movement',
                      'board-tile-dispatch',
                      'board-generation',
                      'board-transition',
                      'run-player-initialization',
                      'run-lifecycle',
                      'run-completion',
                  ],
                  'provides': ['DiceboundRun'],
              }
              at = next(i for i, module in enumerate(manifest['modules']) if module['id'] == 'run-completion') + 1
              manifest['modules'].insert(at, facade)

          manifest_path.write_text(json.dumps(manifest, indent=2) + '\n', encoding='utf-8')

          index_path = Path('runtime/index.html')
          index = index_path.read_text(encoding='utf-8')
          marker = '  <script src="js/run/completion.js"></script>\n'
          facade_tag = '  <script src="js/run/facade.js"></script>\n'
          if facade_tag not in index:
              if marker not in index:
                  raise SystemExit('Could not locate run/completion.js script tag')
              index = index.replace(marker, marker + facade_tag, 1)
              index_path.write_text(index, encoding='utf-8')
          PY

      - name: Focused Board and Run tests
        run: |
          node tools/test_run_facade.js
          node tools/test_board_generation.js
          node tools/test_board_movement.js
          node tools/test_board_tile_dispatch.js
          node tools/test_board_transition.js
          node tools/test_player_initialization.js
          node tools/test_run_lifecycle.js
          node tools/test_run_completion.js
          python tools/test_shadow_ownership_drain.py
          python tools/validate_runtime_architecture.py

      - name: Materialize validated commit object
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64
          import json
          import os
          import subprocess
          import urllib.request
          from pathlib import Path

          repo = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GH_TOKEN']
          parent = os.environ['GITHUB_SHA']
          api_root = f'https://api.github.com/repos/{repo}/git'

          def post(path, payload):
              req = urllib.request.Request(
                  api_root + path,
                  data=json.dumps(payload).encode('utf-8'),
                  headers={
                      'Authorization': f'Bearer {token}',
                      'Accept': 'application/vnd.github+json',
                      'X-GitHub-Api-Version': '2022-11-28',
                      'Content-Type': 'application/json',
                  },
                  method='POST',
              )
              with urllib.request.urlopen(req) as response:
                  return json.load(response)

          entries = []
          for path in ('runtime/js/module-manifest.json', 'runtime/index.html'):
              raw = Path(path).read_bytes()
              blob = post('/blobs', {
                  'content': base64.b64encode(raw).decode('ascii'),
                  'encoding': 'base64',
              })
              entries.append({'path': path, 'mode': '100644', 'type': 'blob', 'sha': blob['sha']})

          base_tree = subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}'], text=True).strip()
          tree = post('/trees', {'base_tree': base_tree, 'tree': entries})
          commit = post('/commits', {
              'message': 'architecture: wire Board and Run facade load graph',
              'tree': tree['sha'],
              'parents': [parent],
          })
          print(f"REMOTE_COMMIT_SHA={commit['sha']}")
          PY
