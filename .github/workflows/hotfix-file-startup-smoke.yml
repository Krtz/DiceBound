name: Hotfix local-file Camp startup smoke

on:
  push:
    branches:
      - hotfix/0.6.5.16-local-camp-startup
    paths:
      - .github/workflows/hotfix-file-startup-smoke.yml
      - tools/test_file_startup_browser.js
      - runtime/**

permissions:
  contents: read

jobs:
  smoke:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reproduce local file startup
        run: node tools/test_file_startup_browser.js
