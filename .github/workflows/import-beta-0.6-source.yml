name: Import recovered Beta 0.6 source

on:
  release:
    types: [published]
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-beta-0.6-source.yml'
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag containing the recovered runtime-source ZIP
        required: true
        default: beta-0.6-recovery-source

permissions:
  contents: write

jobs:
  import-source:
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event.release.tag_name == 'beta-0.6-recovery-source' }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Resolve recovery release tag
        id: release
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "release" ]]; then
            TAG="${{ github.event.release.tag_name }}"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="beta-0.6-recovery-source"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Using recovery release: $TAG"

      - name: Download recovered runtime source archive
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/dicebound-recovery"
          gh release download "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern '*RUNTIME_SOURCE*.zip' \
            --dir "$RUNNER_TEMP/dicebound-recovery"

          mapfile -t archives < <(find "$RUNNER_TEMP/dicebound-recovery" -maxdepth 1 -type f -name '*RUNTIME_SOURCE*.zip' -print)
          if [[ ${#archives[@]} -ne 1 ]]; then
            echo "Expected exactly one *RUNTIME_SOURCE*.zip release asset, found ${#archives[@]}." >&2
            printf '%s\n' "${archives[@]}" >&2
            exit 1
          fi

          echo "DICEBOUND_RECOVERY_ZIP=${archives[0]}" >> "$GITHUB_ENV"

      - name: Verify recovered Beta 0.6 archive
        shell: bash
        run: |
          set -euo pipefail
          expected='1cdf6ad425c1ab18bd2934f9c6e719ef0eaa826e22ab7884e9312e4cb2c401a9'
          actual="$(sha256sum "$DICEBOUND_RECOVERY_ZIP" | awk '{print $1}')"
          echo "Expected SHA-256: $expected"
          echo "Actual SHA-256:   $actual"
          if [[ "$actual" != "$expected" ]]; then
            echo 'Recovery archive checksum mismatch; refusing to import.' >&2
            exit 1
          fi

      - name: Extract authoritative runtime and wrapper source
        shell: bash
        run: |
          set -euo pipefail
          extract="$RUNNER_TEMP/dicebound-extracted"
          rm -rf "$extract"
          mkdir -p "$extract"
          unzip -q "$DICEBOUND_RECOVERY_ZIP" -d "$extract"

          src="$(find "$extract" -mindepth 1 -maxdepth 1 -type d -name 'Dicebound_Beta_0_6_RUNTIME_SOURCE*' -print -quit)"
          if [[ -z "$src" ]]; then
            echo 'Could not locate the recovered source root.' >&2
            exit 1
          fi

          test -f "$src/runtime/index.html"
          test -f "$src/runtime/js/dicebound.js"
          test -f "$src/wrapper-source/tools/build_launcher.py"
          test -f "$src/README_SOURCE_STATUS.txt"

          rm -rf runtime wrapper-source
          cp -a "$src/runtime" ./runtime
          cp -a "$src/wrapper-source" ./wrapper-source
          mkdir -p docs/recovery
          cp "$src/README_SOURCE_STATUS.txt" docs/recovery/BETA_0_6_SOURCE_STATUS.txt

      - name: Validate imported source markers
        shell: bash
        run: |
          set -euo pipefail
          grep -q '0.6' runtime/build-info.json
          grep -q 'dicebound-0.6-49974c0d6ca04ded' runtime/build-info.json
          grep -q '0.6' wrapper-source/config/project.json

          echo "Runtime files: $(find runtime -type f | wc -l)"
          echo "Wrapper files: $(find wrapper-source -type f | wc -l)"
          du -sh runtime wrapper-source

      - name: Commit recovered game source to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'DiceBound Recovery Bot'
          git config user.email 'actions@users.noreply.github.com'

          git add runtime wrapper-source docs/recovery/BETA_0_6_SOURCE_STATUS.txt

          if git diff --cached --quiet; then
            echo 'Recovered source is already present; nothing to commit.'
            exit 0
          fi

          git commit -m 'Import recovered DiceBound Beta 0.6 source'
          git push origin HEAD:main
