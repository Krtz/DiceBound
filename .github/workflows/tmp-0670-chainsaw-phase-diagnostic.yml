name: Temporary 0.6.7.0 chainsaw phase diagnostic

on:
  push:
    branches:
      - refactor/0.6.7.0-monolith-chainsaw
  workflow_dispatch:

permissions:
  contents: read

jobs:
  semantic-startup-owners:
    name: semantic startup-owner surgery
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - name: Check out diagnostic tools
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reset runtime to released 0.6.6.39
        shell: pwsh
        run: |
          git checkout db7e6f423caaa06b5d8939dbf113da3a1236ccdb -- runtime
          if (Test-Path runtime/js/combat/element-content.js) { Remove-Item runtime/js/combat/element-content.js -Force }
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply hook-safe chainsaw and semantic owner repair
        shell: pwsh
        env:
          CHAINSAW_PHASE: dead+element+delegates+support
          CHAINSAW_SUPPORT_NAMES: v16Talents
        run: |
          $ErrorActionPreference = 'Stop'
          python -m pip install --disable-pip-version-check tree-sitter tree-sitter-javascript
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/tmp_diagnose_0670_chainsaw_phases.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/tmp_fix_0670_startup_owners.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/tmp_normalize_0670_source.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check runtime/js/dicebound.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check runtime/js/combat/element-content.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check runtime/js/progression/lifecycle.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/test_monolith_chainsaw.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run focused owner and frozen-behavior gates
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          node tools/test_classes_oracle.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/test_progression_oracle.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/test_progression_owner.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/test_combat_view_oracle.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/test_guardian_registry.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/test_board_generation.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/test_powerups_oracle.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/test_canonical_tile_meta.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
