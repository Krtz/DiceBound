name: Temporary 0.6.7.0 chainsaw phase diagnostic

on:
  push:
    branches:
      - refactor/0.6.7.0-monolith-chainsaw
  workflow_dispatch:

permissions:
  contents: read

jobs:
  support-candidates:
    name: support (${{ matrix.label }})
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: none
            names: ''
          - label: guardian-art
            names: 'db060GuardianArt'
          - label: gate-rewards
            names: 'db0512GateRewards'
          - label: v16-talents
            names: 'v16Talents'
          - label: all-three
            names: 'db060GuardianArt,db0512GateRewards,v16Talents'
    steps:
      - name: Check out diagnostic tools
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reset runtime to released 0.6.6.39
        shell: pwsh
        run: |
          git checkout db7e6f423caaa06b5d8939dbf113da3a1236ccdb -- runtime
          if (Test-Path runtime/js/combat/element-content.js) { Remove-Item runtime/js/combat/element-content.js -Force }
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply safe chainsaw plus exact support candidate
        shell: pwsh
        env:
          CHAINSAW_PHASE: ${{ matrix.names == '' && 'dead+element+delegates' || 'dead+element+delegates+support' }}
          CHAINSAW_SUPPORT_NAMES: ${{ matrix.names }}
        run: |
          python -m pip install --disable-pip-version-check tree-sitter tree-sitter-javascript
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/tmp_diagnose_0670_chainsaw_phases.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check runtime/js/dicebound.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check runtime/js/combat/element-content.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run exact Classes oracle
        shell: pwsh
        run: node tools/test_classes_oracle.js
