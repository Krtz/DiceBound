name: Temporary generic Dodge materializer

on:
  push:
    branches:
      - fix/0.6.7.5-generic-dodge-presentation
    paths:
      - .github/workflows/temp-dodge-materialize.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply generic Dodge ownership cleanup
        shell: pwsh
        run: python tools/temp_dodge_materialize.py

      - name: Stamp Beta 0.6.7.5
        shell: pwsh
        run: |
          python tools/set_project_version.py --version 0.6.7.5 --channel Beta
          python tools/refresh_runtime_manifest.py --version 0.6.7.5 --channel Beta --development-state Unreleased

      - name: Focused validation
        shell: pwsh
        run: |
          node tools/test_combat_turn_resolution.js
          node tools/test_combat_presentation.js
          node tools/test_combat_view_facade.js
          python tools/validate_runtime_architecture.py
          python tools/validate_version_identity.py
          if (git grep -n "dbFriendSuccessfulDodgePresentation" -- runtime/js) { throw "retired monolith Dodge helper still exists" }
          if (git grep -n "successfulDodgePresentation" -- runtime/js) { throw "path-specific Dodge presentation capability still exists" }
          exit 0

      - name: Remove temporary materializer and commit validated tree
        shell: pwsh
        run: |
          Remove-Item .github/workflows/temp-dodge-materialize.yml
          Remove-Item tools/temp_dodge_materialize.py
          git config user.name "dicebound-materializer[bot]"
          git config user.email "323488390+dicebound-materializer[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: canonicalize generic dodge presentation"
          Write-Host "MATERIALIZED_COMMIT=$(git rev-parse HEAD)"
          git status --short

      - name: Push exact validated tree
        shell: pwsh
        run: git push origin "HEAD:$env:GITHUB_REF_NAME"
