name: Materialize Beta 0.6.5.12 board transition

on:
  push:
    branches:
      - refactor/0.6.5.12-board-transition

permissions:
  contents: read

jobs:
  materialize:
    if: github.actor != 'dicebound-manifest-publisher[bot]'
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - name: Check out rescue branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Finish release-facing text
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          changelog = Path('CHANGELOG.md')
          text = changelog.read_text(encoding='utf-8')
          marker = '## Beta 0.6.5.11\n'
          entry = '''## Beta 0.6.5.12

          ### Board transition ownership (#40, #209)
          - Replaced the historical `advanceToNextBoard` reassignment chain with `runtime/js/board/transition.js`, the single owner for completed-Board transition orchestration.
          - The owner preserves encounter reset, Board increment, road rebuild, published entry recovery, Board announcement and the 350 ms movement unlock, including the exact legacy Board 5 -> 6 pre-transition HP/potion result.
          - Board generation, combat victory resolution, final-run completion, saves/checkpoints, UI and RNG remain in their existing owners; `dicebound.js` keeps only the narrow composition contract and historical forwarding name.

          '''
          if '## Beta 0.6.5.12\n' not in text:
              if marker not in text:
                  raise SystemExit('CHANGELOG insertion marker not found')
              text = text.replace(marker, entry + marker, 1)
              changelog.write_text(text, encoding='utf-8', newline='\n')

          patch = Path('runtime/PATCH_NOTES.md')
          text = patch.read_text(encoding='utf-8')
          old_header = '# Unreleased — Beta 0.6.5.11\n'
          new_header = '# Unreleased — Beta 0.6.5.12\n'
          section = '''
          ## Beta 0.6.5.12 Board transition ownership (#40, #209)
          - Board-to-board advancement now has one owner: `board/transition.js` resets encounter state, advances and rebuilds the road, applies published entry recovery, announces the next Board and performs the existing delayed movement unlock.
          - The exact Board 5 -> 6 pre-transition HP/potion result is preserved. Board generation, combat victory, final-run completion, saves/checkpoints, UI, gameplay values and RNG remain unchanged, and the historical transition reassignment chain is retired.
          '''
          if '## Beta 0.6.5.12 Board transition ownership' not in text:
              if old_header not in text:
                  raise SystemExit('PATCH_NOTES header marker not found')
              text = text.replace(old_header, new_header + section + '\n', 1)
              patch.write_text(text, encoding='utf-8', newline='\n')

          index = Path('runtime/index.html')
          text = index.read_text(encoding='utf-8')
          stale = 'Beta v0.6.5.12 · Board tile-dispatch ownership.'
          fresh = 'Beta v0.6.5.12 · Board transition ownership.'
          if stale not in text and fresh not in text:
              raise SystemExit('runtime/index.html transition subtitle marker not found')
          index.write_text(text.replace(stale, fresh, 1), encoding='utf-8', newline='\n')
          '@ | python -

      - name: Regenerate canonical Beta 0.6.5.12 identity
        shell: pwsh
        run: |
          python tools/set_project_version.py --version 0.6.5.12 --channel Beta
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/refresh_runtime_manifest.py --version 0.6.5.12 --channel Beta --development-state Unreleased
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/prepare_release.py --output-dir wrapper-source/release/generated
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/validate_version_identity.py --version 0.6.5.12 --channel Beta --release-spec wrapper-source/release/generated/release-spec.json --release-notes wrapper-source/release/generated/release-notes.md
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Validate transition extraction
        shell: pwsh
        run: |
          node --check runtime/js/board/transition.js
          node tools/test_board_transition.js
          node tools/test_board_movement.js
          node tools/test_board_tile_dispatch.js
          python tools/validate_runtime_architecture.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Mint repo-scoped write token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.DICEBOUND_RELEASE_APP_ID }}
          private-key: ${{ secrets.DICEBOUND_RELEASE_APP_PRIVATE_KEY }}
          owner: Krtz
          repositories: DiceBound
          permission-contents: write

      - name: Commit canonical rescue result and remove materializer
        shell: pwsh
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          Remove-Item .github/workflows/transition-0.6.5.12-materialize.yml
          git config user.name 'dicebound-manifest-publisher[bot]'
          git config user.email '323488390+dicebound-manifest-publisher[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'refactor(board): finish transition extraction'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git remote set-url origin "https://x-access-token:$env:GH_TOKEN@github.com/Krtz/DiceBound.git"
          git push origin HEAD:refactor/0.6.5.12-board-transition
