name: Temporary 0.6.6.2 combat presentation audit

on:
  push:
    branches:
      - arch/0.6.6.2-combat-presentation

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arch/0.6.6.2-combat-presentation
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check presentation module
        run: |
          node --check runtime/js/combat/presentation.js
          node tools/test_combat_presentation.js
      - name: Audit combat presentation ownership
        run: python tools/audit_combat_presentation.py
