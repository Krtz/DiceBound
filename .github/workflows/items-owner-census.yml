name: Items Owner Census

on:
  push:
    branches:
      - arch/0.6.6.27-items-oracle

jobs:
  census:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Print Items owner blocks
        shell: pwsh
        run: python tools/diag_items_owner_blocks.py
