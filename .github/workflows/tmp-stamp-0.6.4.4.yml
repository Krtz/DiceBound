name: Temporary Beta 0.6.4.4 stamp

on:
  push:
    branches:
      - fix/0.6.4.4-lunch-playtest-followups

permissions:
  contents: write

jobs:
  stamp:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Stamp Beta 0.6.4.4 and refresh deterministic metadata
        shell: bash
        run: |
          set -euo pipefail
          python tools/set_project_version.py --version 0.6.4.4 --channel Beta
          python - <<'PY'
          from pathlib import Path

          version = Path('runtime/js/version.js')
          text = version.read_text(encoding='utf-8')
          old = 'const RELEASE_SUMMARY="resumable active runs with deterministic safe-state checkpoints and backup recovery.";'
          new = 'const RELEASE_SUMMARY="lunch-playtest polish for packs, loot comparison, footsteps, Camp feedback and recurring Slimes.";'
          if old not in text:
              raise SystemExit('Expected 0.6.4.3 release summary was not found')
          version.write_text(text.replace(old, new, 1), encoding='utf-8')

          changelog = Path('CHANGELOG.md')
          text = changelog.read_text(encoding='utf-8')
          if '## Beta 0.6.4.4' not in text:
              marker = 'This file starts the durable Git-era release history. Earlier Alpha/Beta history exists in recovered project notes; Beta 0.6 is the first release established as the repository baseline.\n\n'
              section = '''## Beta 0.6.4.4\n\n### Lunch playtest follow-ups (#156)\n- Tightened mixed authored/placeholder enemy-pack presentation without changing pack mechanics, targeting, stats or RNG.\n- Added final-stat loot comparison deltas and stacked Keep/Equip and Sell decisions for faster equipment reads.\n- Added presentation-only footsteps to traversed ordinary road spaces while deliberately leaving Merchant spaces unmarked; active-run resume restores the trail.\n- Added restrained hover/focus feedback and tighter hit areas for Camp interactions.\n- Kept Slime in the early road pool across Boards 1–6 using the correct Board-specific art.\n- Standard Slimes now gain 5% Radiation proc chance per earlier Slime killed in the current run, capped at 100%, with the count reset on new runs and preserved by active-run checkpoints.\n\n'''
              if marker not in text:
                  raise SystemExit('Changelog insertion marker was not found')
              changelog.write_text(text.replace(marker, marker + section, 1), encoding='utf-8')

          patch = Path('runtime/PATCH_NOTES.md')
          text = patch.read_text(encoding='utf-8')
          if not text.startswith('# Beta 0.6.4.4'):
              section = '''# Beta 0.6.4.4\n\n## Lunch playtest follow-ups (#156)\n- Mixed enemy packs keep authored art and fallback combatants aligned in a more consistent row without changing combat mechanics.\n- Found gear keeps the current/new side-by-side comparison and now adds compact final-stat deltas with vertically stacked Keep/Equip and Sell controls.\n- Traversed ordinary road spaces leave subtle footsteps that survive Continue Run; Merchant spaces intentionally stay unmarked.\n- Camp interactions use restrained hover/focus lift and glow feedback with tighter clickable regions around visible artwork.\n- Slime remains an early-road enemy on Boards 1–6 and uses the matching Board-specific progression art.\n- Standard Slime Radiation chance is 5% per earlier Slime kill this run, safely capped at 100%; the run counter resets on a new run and survives active-run checkpoint/resume.\n\n---\n\n'''
              patch.write_text(section + text, encoding='utf-8')
          PY
          python tools/refresh_runtime_manifest.py --version 0.6.4.4 --channel Beta --development-state Unreleased

      - name: Commit the stamp and remove this temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/tmp-stamp-0.6.4.4.yml
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Stamp Beta 0.6.4.4'
          git push origin HEAD:fix/0.6.4.4-lunch-playtest-followups
