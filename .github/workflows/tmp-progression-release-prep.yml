name: Temporary Progression 0.6.6.29 release prep

on:
  push:
    branches:
      - arch/0.6.6.29-progression-oracle

permissions:
  contents: write

jobs:
  prepare-progression-release:
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - name: Check out Progression branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Stamp Beta 0.6.6.29 candidate
        shell: pwsh
        run: |
          python tools/tmp_prepare_progression_release.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/set_project_version.py --version 0.6.6.29 --channel Beta
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Remove-Item tools/tmp_prepare_progression_release.py
          Remove-Item .github/workflows/tmp-progression-release-prep.yml
          python tools/refresh_runtime_manifest.py --version 0.6.6.29 --channel Beta --development-state Unreleased
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Validate release identity and Progression behavior
        shell: pwsh
        run: |
          python tools/validate_version_identity.py --version 0.6.6.29 --channel Beta
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/validate_pr_version.py --base-ref origin/main
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/test_version_identity.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/test_progression_owner.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/test_progression_class_unlock_owner.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/test_progression_oracle.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/test_prestige_moon.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/validate_runtime_architecture.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/validate_asset_architecture.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/validate_launcher_assets.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Materialize exact release candidate
        shell: pwsh
        run: |
          git config user.name "DiceBound Progression Release Prep"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Beta 0.6.6.29: Progression subsystem facade candidate"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $sha = git rev-parse HEAD
          Write-Host "PROGRESSION_RELEASE_CANDIDATE=$sha"
          "PROGRESSION_RELEASE_CANDIDATE=$sha" >> $env:GITHUB_ENV

      - name: Try to advance protected branch
        shell: pwsh
        run: |
          git push origin HEAD:refs/heads/arch/0.6.6.29-progression-oracle
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Protected branch push rejected as expected; release candidate object was uploaded."
            exit 0
          }
          Write-Host "Branch advanced directly to $env:PROGRESSION_RELEASE_CANDIDATE."
