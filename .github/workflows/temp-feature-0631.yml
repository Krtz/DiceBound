name: Temporary 0.6.3.1 feature source commit

on:
  push:
    branches:
      - feat/0.6.3.1-progression-slime-gear-browser
    paths:
      - .github/workflows/temp-feature-0631.yml

permissions:
  contents: write

jobs:
  commit-source:
    runs-on: windows-2022
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/0.6.3.1-progression-slime-gear-browser
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Materialize verified 0.6.3.1 source
        shell: pwsh
        run: |
          python tools/patch_0631_progression_slime_gear.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/patch_0631_metadata.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/patch_0631_changelog.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/refresh_0631_snapshots.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/refresh_runtime_manifest.py --version 0.6.3.1 --channel Beta --development-state Unreleased
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          git diff --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/test_0631_progression_slime_gear.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/test_class_registry.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/test_core_state.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/validate_version_identity.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/validate_runtime_architecture.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Commit only real feature source and tests
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- `
            CHANGELOG.md `
            runtime/PATCH_NOTES.md `
            runtime/build-info.json `
            runtime/build-manifest.json `
            runtime/index.html `
            runtime/js/classes/registry.js `
            runtime/js/core/state.js `
            runtime/js/dicebound.js `
            runtime/js/items/equipment.js `
            runtime/js/module-manifest.json `
            runtime/js/version.js `
            runtime/js/powerups/borrowing.js `
            runtime/js/progression/class-unlock-rules.js `
            tools/test_0631_progression_slime_gear.js `
            tools/test_class_registry.js `
            tools/test_core_state.js `
            wrapper-source/config/project.json `
            wrapper-source/wrappers/webview2/native-go/main.go
          git diff --cached --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git commit -m "feat: implement 0.6.3.1 progression slime and gear rules"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git push origin HEAD:feat/0.6.3.1-progression-slime-gear-browser
