name: Classes runtime owner materializer

on:
  push:
    branches:
      - arch/0.6.6.34-classes-oracle
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: windows-2022
    timeout-minutes: 50
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.7"

      - name: Materialize Classes runtime identity owner
        shell: pwsh
        run: |
          python tools/materialize_classes_runtime_owner.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check runtime/js/classes/registry.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check runtime/js/classes/runtime.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check runtime/js/dicebound.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check tools/test_classes_runtime.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Refresh exact runtime metadata
        shell: pwsh
        run: |
          python tools/refresh_runtime_manifest.py --version 0.6.6.33 --channel Beta --development-state Unreleased --notes "Classes identity/capability runtime owner checkpoint on released Beta 0.6.6.33 behavior."
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run focused Classes ownership gates
        shell: pwsh
        run: |
          node tools/test_classes_runtime.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/test_classes_oracle.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/test_class_registry.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/test_player_initialization.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/test_invoker.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run complete JavaScript and Python gate
        shell: pwsh
        run: |
          Get-ChildItem runtime/js -Recurse -Filter *.js | ForEach-Object { node --check $_.FullName; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE } }
          Get-ChildItem tools -Filter test_*.js | ForEach-Object { node $_.FullName; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE } }
          Get-ChildItem tools -Filter test_*.py | ForEach-Object { python $_.FullName; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE } }

      - name: Validate architecture and assets
        shell: pwsh
        run: |
          python tools/validate_runtime_architecture.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/validate_asset_architecture.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/validate_launcher_assets.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Validate installer Go sources
        shell: pwsh
        run: |
          go test .\installer\main_v2.go .\installer\http_policy.go .\installer\main_v2_test.go
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go vet .\installer\main_v2.go .\installer\http_policy.go .\installer\main_v2_test.go
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Materialize exact tested Classes owner checkpoint
        shell: pwsh
        run: |
          Remove-Item tools/materialize_classes_runtime_owner.py -Force
          Remove-Item .github/workflows/classes-runtime-owner-materialize.yml -Force
          git status --short
          git diff --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git config user.name "dicebound-architecture-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "architecture: route Class identity through DiceboundClasses"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $sha = git rev-parse HEAD
          Write-Host "CLASSES_RUNTIME_OWNER_COMMIT=$sha"
          git push origin "HEAD:arch/0.6.6.34-classes-oracle"
