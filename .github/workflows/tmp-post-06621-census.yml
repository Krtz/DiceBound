name: Temporary post-0.6.6.21 monolith census

on:
  push:
    branches:
      - arch/0.6.6.21-player-run-initialization
    paths:
      - .github/workflows/tmp-post-06621-census.yml

permissions:
  contents: read

jobs:
  census:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Semantic wrapper census
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          from collections import Counter, defaultdict

          p=Path('runtime/js/dicebound.js')
          text=p.read_text(encoding='utf-8')
          lines=text.splitlines()
          print(f'MONOLITH bytes={p.stat().st_size} lines={len(lines)}')

          # Named function declarations and last-definition-wins reassignments.
          decl=defaultdict(list)
          assign=defaultdict(list)
          captures=defaultdict(list)
          for i,line in enumerate(lines,1):
              for m in re.finditer(r'\b(?:async\s+)?function\s+([A-Za-z_$][\w$]*)\s*\(', line):
                  decl[m.group(1)].append(i)
              for m in re.finditer(r'\b([A-Za-z_$][\w$]*)\s*=\s*(?:async\s+)?function\b', line):
                  assign[m.group(1)].append(i)
              for m in re.finditer(r'\bconst\s+([A-Za-z_$][\w$]*)\s*=\s*([A-Za-z_$][\w$]*)\s*;', line):
                  cap,target=m.groups()
                  if re.search(r'(?:Base|V\d|Patch|Old|Prev|Legacy)', cap, re.I):
                      captures[target].append((i,cap))

          names=set(decl)|set(assign)|set(captures)
          ranked=[]
          for n in names:
              layers=len(decl[n])+len(assign[n])+len(captures[n])
              if layers>=2:
                  ranked.append((layers,len(assign[n]),len(captures[n]),len(decl[n]),n))
          ranked.sort(reverse=True)

          print('\nTOP LIVE-CHAIN CANDIDATES (layers assign captures decl name):')
          for layers,a,c,d,n in ranked[:45]:
              print(f'{layers:3d} {a:3d} {c:3d} {d:3d} {n} decl={decl[n]} assign={assign[n]} captures={[x for x in captures[n]]}')

          focus=['updateHUD','renderMerchant','openMerchant','updateMetaUI','saveMeta','openStartScreen','openRoad','renderBoard','renderRoad','rollDice','startRun','resetPlayer','applyTalentBonuses','renderMap','renderInventory','updateBoard','updateRoad','renderTile','startCombat','damageEnemy','showToast','addLog']
          print('\nFOCUS CONTEXT:')
          for n in focus:
              locs=sorted(set(decl[n]+assign[n]+[i for i,_ in captures[n]]))
              if not locs: continue
              print(f'===== {n}: {locs} =====')
              for i in locs:
                  a=max(1,i-2);b=min(len(lines),i+4)
                  for j in range(a,b+1): print(f'{j:05d}: {lines[j-1]}')
                  print()

          print('\nALL BASE/CAPTURE TARGETS:')
          for n,v in sorted(captures.items(), key=lambda kv:(-len(kv[1]),kv[0])):
              print(f'{n}: {len(v)} -> {v}')
          PY
