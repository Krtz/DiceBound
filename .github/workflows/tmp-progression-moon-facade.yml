name: Temporary Progression Prestige Moon ownership gate

on:
  push:
    branches:
      - arch/0.6.6.29-progression-oracle

permissions:
  contents: write

jobs:
  progression-moon-owner:
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - name: Check out Progression branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply final Prestige Moon facade slice
        shell: pwsh
        run: |
          python tools/tmp_progression_moon_facade.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/tmp_progression_moon_test_fix.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Remove-Item tools/tmp_progression_moon_facade.py
          Remove-Item tools/tmp_progression_moon_test_fix.py
          Remove-Item .github/workflows/tmp-progression-moon-facade.yml
          python tools/refresh_runtime_manifest.py --version 0.6.6.28 --channel Beta --development-state Unreleased
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run focused Progression gate
        shell: pwsh
        run: |
          node --check runtime/js/progression/lifecycle.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check runtime/js/dicebound.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/test_progression_owner.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/test_progression_oracle.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/test_prestige_moon.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/test_06515_prestige_heirloom_ui.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/test_player_initialization.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/test_info_guide_ui.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run repository JavaScript regression gate
        shell: pwsh
        run: |
          Get-ChildItem tools -Filter test_*.js | ForEach-Object {
            Write-Host "Running $($_.Name)"
            node $_.FullName
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Run architecture validators
        shell: pwsh
        run: |
          python tools/validate_runtime_architecture.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/validate_asset_architecture.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/validate_launcher_assets.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Materialize exact tested candidate commit
        shell: pwsh
        run: |
          git config user.name "DiceBound Progression Moon Owner"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "architecture: route Prestige Moon through DiceboundProgression"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $sha = git rev-parse HEAD
          Write-Host "PROGRESSION_MOON_OWNER_COMMIT=$sha"
          "PROGRESSION_MOON_OWNER_COMMIT=$sha" >> $env:GITHUB_ENV

      - name: Try to advance protected branch
        shell: pwsh
        run: |
          git push origin HEAD:refs/heads/arch/0.6.6.29-progression-oracle
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Protected branch push rejected as expected; tested commit object was uploaded."
            exit 0
          }
          Write-Host "Branch advanced directly to $env:PROGRESSION_MOON_OWNER_COMMIT."
