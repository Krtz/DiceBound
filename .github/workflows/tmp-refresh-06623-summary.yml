name: Temporary 0.6.6.23 summary refresh

on:
  push:
    branches:
      - arch/0.6.6.23-merchant-ui
    paths:
      - .github/workflows/tmp-refresh-06623-summary.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh canonical runtime metadata
        shell: pwsh
        run: |
          python tools/refresh_runtime_manifest.py --version 0.6.6.23 --channel Beta --development-state Unreleased
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/prepare_release.py --version 0.6.6.23 --channel Beta --output-dir wrapper-source/release/generated
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/validate_version_identity.py --version 0.6.6.23 --channel Beta --release-spec wrapper-source/release/generated/release-spec.json --release-notes wrapper-source/release/generated/release-notes.md
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/test_merchant_transaction.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/test_merchant_ui_extraction_boundary.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/validate_runtime_architecture.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/test_merchant_browser.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Remove-Item .github/workflows/tmp-refresh-06623-summary.yml
          git diff --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Commit refreshed candidate
        shell: pwsh
        run: |
          git config user.name "dicebound-materializer"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Beta 0.6.6.23: refresh Merchant UI release metadata"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git push origin HEAD:arch/0.6.6.23-merchant-ui
