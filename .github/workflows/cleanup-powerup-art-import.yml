name: Cleanup powerup art importer

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  cleanup:
    if: github.event.issue.title == '[automation] Cleanup powerup art importer'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify integrated runtime before cleanup
        run: |
          python - <<'PY'
          from pathlib import Path
          root = Path('runtime/assets/ui/powerups')
          files = sorted(p.name for p in root.glob('*.png'))
          if len(files) != 20:
              raise SystemExit(f'Expected 20 integrated PNG assets, found {len(files)}')
          assets = Path('runtime/js/assets.js').read_text()
          game = Path('runtime/js/dicebound.js').read_text()
          for name in files:
              if name not in assets:
                  raise SystemExit(f'assets.js does not reference {name}')
          keys = [
              'powerupSecondWind','powerupFieldAlchemy','powerupSharperBlade',
              'powerupTemperedGuard','powerupStoutHeart','powerupFaintEcho',
              'powerupSpikedArmor','powerupMonsterNotes','powerupLuckyPebble',
              'powerupHeavyPurseWorn','powerupFieldSurgeon','powerupStrongBrew',
              'powerupExecutioner','powerupWalkingFortress','powerupWorldheart',
              'powerupPhoenixFeather','powerupFortuneBroker','powerupTreasureSense',
              'powerupBarbedArmor','powerupScholarsSigil',
          ]
          for key in keys:
              if key not in assets or key not in game:
                  raise SystemExit(f'Missing runtime mapping for {key}')
          print('Integrated runtime verified before cleanup.')
          PY
          node --check runtime/js/assets.js
          node --check runtime/js/dicebound.js

      - name: Replace validation note with final repository state
        run: |
          cat > docs/POWERUP_ART_VALIDATION.md <<'EOF'
          # Powerup Art Validation

          The first post-Beta-0.6 powerup-art batch is committed directly to the authoritative runtime.

          Final validation:

          - **20 PNG assets** exist under `runtime/assets/ui/powerups/`.
          - The committed PNG files match the generated source files used for the import.
          - `runtime/js/assets.js` registers and preloads every powerup-art path.
          - `runtime/js/dicebound.js` maps the intended powerup names to the registered asset keys.
          - `node --check runtime/js/assets.js` passes.
          - `node --check runtime/js/dicebound.js` passes.

          See `docs/POWERUP_ART_MAPPING.md` for the semantic powerup-to-art mapping.
          EOF

      - name: Remove one-shot import machinery
        run: |
          rm -rf tools/powerup-art-import
          rm -f .github/workflows/import-powerup-art.yml
          rm -f .github/workflows/integrate-powerup-art-on-issue.yml
          rm -f docs/POWERUP_ART_TRIGGER_NOTE.md
          rm -f docs/POWERUP_ART_IMPORT_NOTE.md
          rm -f .github/workflows/cleanup-powerup-art-import.yml

      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo 'Nothing to commit'
          else
            git commit -m 'Clean up powerup art import machinery'
            git push
          fi

      - name: Close trigger issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue close "${{ github.event.issue.number }}" --comment "Powerup-art importer cleanup completed after runtime validation."
