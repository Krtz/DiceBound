name: Temporary 0.6.7.14 Demon identity materializer

on:
  push:
    branches:
      - feature/0.6.7.14-demon-identity

permissions:
  contents: read

jobs:
  materialize:
    if: github.ref == 'refs/heads/feature/0.6.7.14-demon-identity'
    runs-on: windows-2022
    steps:
      - name: Mint DiceBound release App token
        id: release_app
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.DICEBOUND_RELEASE_APP_ID }}
          private-key: ${{ secrets.DICEBOUND_RELEASE_APP_PRIVATE_KEY }}
          owner: Krtz
          repositories: DiceBound
          permission-contents: write

      - uses: actions/checkout@v4
        with:
          ref: feature/0.6.7.14-demon-identity
          fetch-depth: 0
          token: ${{ steps.release_app.outputs.token }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Stamp Beta 0.6.7.14 and materialize runtime identity
        shell: pwsh
        run: |
          git fetch origin main --no-tags
          python tools/set_project_version.py --version 0.6.7.14 --channel Beta
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          @'
          from pathlib import Path
          import re

          version = "0.6.7.14"
          summary = "Demon identity, semantic Fire behavior & preserved battle art."

          version_path = Path("runtime/js/version.js")
          text = version_path.read_text(encoding="utf-8")
          text, count = re.subn(
              r'const RELEASE_SUMMARY="[^"]*";',
              f'const RELEASE_SUMMARY="{summary}";',
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit("expected exactly one RELEASE_SUMMARY")
          version_path.write_text(text, encoding="utf-8")

          index_path = Path("runtime/index.html")
          text = index_path.read_text(encoding="utf-8")
          text, count = re.subn(
              rf'<p>Beta v{re.escape(version)} · [^<]*</p>',
              f'<p>Beta v{version} · {summary}</p>',
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit("expected exactly one stamped runtime subtitle")
          index_path.write_text(text, encoding="utf-8")

          notes = """# DiceBound Beta 0.6.7.14

          ## Ordinary Demon identity — #158
          - The ordinary `Devil` family is now canonically `demon` / **Demon**.
          - **The Pale Devil** remains a distinct special `pale-devil` identity and is unchanged.
          - Ordinary Demon Fire behavior now keys from the stable semantic family ID instead of parsing the display name.
          - Existing Board 1–6 ordinary battle art is preserved through the new Demon identity; legacy physical `devil-board-*.png` filenames remain implementation detail.
          - The existing `demon.png` road marker remains canonical.

          ## Regression protection
          - Frozen enemy-scaling characterization keeps exact numeric stats and RNG behavior across the identity migration.
          - Focused policy, marker and battle-art tests require canonical Demon identity while allowing legacy ordinary Devil labels only as art-resolution compatibility input.
          - No spawn rates, elemental odds, weakness behavior, balance values or save schema change in this slice.

          ## Scope
          - This release completes only the focused ordinary Devil → Demon semantic migration.
          - The broader bounded elemental-name composer remains open on #158 for later design/work.
          """
          notes = "\n".join(line[10:] if line.startswith("          ") else line for line in notes.splitlines()).strip() + "\n"
          notes_path = Path("runtime/release-notes/0.6.7.14.md")
          notes_path.write_text(notes, encoding="utf-8")
          '@ | Set-Content -Encoding utf8 .\materialize_06714.py
          python .\materialize_06714.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Remove-Item .\materialize_06714.py

          python tools/refresh_runtime_manifest.py --version 0.6.7.14 --channel Beta --development-state Unreleased
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/prepare_release.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/validate_pr_version.py --base-ref origin/main
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/validate_version_identity.py --version 0.6.7.14 --channel Beta --release-spec wrapper-source/release/generated/release-spec.json --release-notes wrapper-source/release/generated/release-notes.md
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/test_version_identity_validator.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/test_version_identity.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          node tools/test_enemy_battle_art_registry.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/test_enemy_marker_registry.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/test_enemy_policy.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/test_enemy_scaling_resolution.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/validate_asset_architecture.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Commit materialized 0.6.7.14 identity
        shell: pwsh
        run: |
          git config user.name "DiceBound CI materializer"
          git config user.email "actions@users.noreply.github.com"
          git add runtime/build-info.json runtime/build-manifest.json runtime/index.html runtime/js/version.js runtime/release-notes/0.6.7.14.md wrapper-source/config/project.json wrapper-source/wrappers/webview2/native-go/main.go
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { exit 0 }
          git commit -m "release: materialize Beta 0.6.7.14 Demon identity"
          git push origin HEAD:feature/0.6.7.14-demon-identity
