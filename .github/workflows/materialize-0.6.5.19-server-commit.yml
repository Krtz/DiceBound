name: Materialize validated Beta 0.6.5.19 server commit

on:
  push:
    branches:
      - cleanup/0.6.5.19-shadow-ownership-drain
    paths:
      - .github/workflows/materialize-0.6.5.19-server-commit.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: windows-2022
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Reproduce exact proven spring-clean transform
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          import subprocess, re
          workflow=Path('.github/workflows/materialize-0.6.5.19-shadow-drain-v4.yml').read_text(encoding='utf-8')
          start="          @'\n          from pathlib import Path\n          import re, subprocess, tempfile\n"
          end="          '@ | Set-Content -Encoding UTF8 $env:RUNNER_TEMP\\spring_clean.py"
          a=workflow.find(start); b=workflow.find(end,a+len(start))
          if a<0 or b<0: raise SystemExit('Could not extract proven v4 transform')
          payload=workflow[a+len("          @'\n"):b]
          payload='\n'.join(line[10:] if line.startswith('          ') else line for line in payload.splitlines())+'\n'
          temp=Path('_spring_clean_v4.py'); temp.write_text(payload,encoding='utf-8')
          try: subprocess.run(['python',str(temp)],check=True)
          finally: temp.unlink(missing_ok=True)
          p=Path('runtime/js/dicebound.js'); raw=p.read_bytes(); crlf=b'\r\n' in raw
          text=raw.decode('utf-8').replace('\r\n','\n')
          text=re.sub(r'(?m)^[ \t]+$','',text)
          p.write_bytes((text.replace('\n','\r\n') if crlf else text).encode('utf-8'))
          '@ | Set-Content -Encoding UTF8 $env:RUNNER_TEMP\reuse.py
          python $env:RUNNER_TEMP\reuse.py

      - name: Add permanent guard and stamp Beta 0.6.5.19
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          import re
          root=Path(__file__).resolve().parents[1]
          mono=(root/'runtime/js/dicebound.js').read_text(encoding='utf-8')
          assert re.search(r'renderInfo\s*=\s*function\s*\([^)]*\)\s*\{\s*return\s+dbInfoGuide\.render\(\)',mono)
          for name in ['renderInfoBase','renderInfoV13','renderInfoV14Base','renderInfoV15Patch','renderInfoV16Base','renderInfoV18Base','renderInfoV19Base','renderInfoV24Base','renderInfoV24PresentationBase','renderInfoV27Base','buildAISim','DiceboundAITest']:
              assert not re.search(rf'(?<![\w$]){re.escape(name)}(?![\w$])',mono),name
          print('Monolith spring-clean guard PASS')
          '@ | Set-Content -Encoding UTF8 tools\test_shadow_ownership_drain.py
          python tools/set_project_version.py --version 0.6.5.19 --channel Beta
          @'
          from pathlib import Path
          p=Path('runtime/PATCH_NOTES.md'); t=p.read_text(encoding='utf-8'); old='# Unreleased — Beta 0.6.5.18\n\n'
          if old not in t: raise SystemExit('patch-note anchor drifted')
          sec='''# Unreleased — Beta 0.6.5.19\n\n## Beta 0.6.5.19 Monolith spring clean (#40, #209)\n- Drained the historical Info/Guide renderer ladder beneath `ui/info-guide.js`, leaving only hoist-safe compatibility shims before the extracted owner takes over.\n- Removed the production-embedded AI simulation harness, unconsumed historical test/debug exports, and newly orphaned declaration-only helpers. Current browser/native smoke hooks remain.\n- The internally coupled DB235 Career harness is deliberately deferred to its own follow-up instead of weakening the safety gates. Gameplay, balance, RNG order, saves/checkpoints and current UI ownership are unchanged.\n\n'''
          p.write_text(t.replace(old,sec,1),encoding='utf-8')
          p=Path('CHANGELOG.md'); t=p.read_text(encoding='utf-8'); anchor='## Beta 0.6.5.18\n'
          if anchor not in t: raise SystemExit('changelog anchor drifted')
          sec='''## Beta 0.6.5.19\n\n### Monolith spring clean (#40, #209)\n- Removed the shadowed Info renderer stack, obsolete embedded AI simulator, unconsumed historical runtime test/debug exports and newly orphaned helpers. Current smoke hooks and extracted owners remain intact.\n\n'''
          p.write_text(t.replace(anchor,sec+anchor,1),encoding='utf-8')
          '@ | Set-Content -Encoding UTF8 $env:RUNNER_TEMP\notes.py
          python $env:RUNNER_TEMP\notes.py
          python tools/refresh_runtime_manifest.py --version 0.6.5.19 --channel Beta --development-state Unreleased

      - name: Remove all temporary materializer workflows from candidate
        shell: pwsh
        run: |
          Remove-Item .github/workflows/materialize-0.6.5.19-shadow-drain.yml -Force -ErrorAction SilentlyContinue
          Remove-Item .github/workflows/materialize-0.6.5.19-shadow-drain-v2.yml -Force -ErrorAction SilentlyContinue
          Remove-Item .github/workflows/materialize-0.6.5.19-shadow-drain-v3.yml -Force -ErrorAction SilentlyContinue
          Remove-Item .github/workflows/materialize-0.6.5.19-shadow-drain-v4.yml -Force -ErrorAction SilentlyContinue
          Remove-Item .github/workflows/materialize-0.6.5.19-shadow-drain-v5.yml -Force -ErrorAction SilentlyContinue
          Remove-Item .github/workflows/materialize-0.6.5.19-candidate-artifact.yml -Force -ErrorAction SilentlyContinue
          Remove-Item .github/workflows/materialize-0.6.5.19-server-commit.yml -Force -ErrorAction SilentlyContinue

      - name: Validate exact candidate again
        shell: pwsh
        run: |
          node --check runtime/js/dicebound.js
          Get-ChildItem runtime/js -Recurse -Filter *.js | ForEach-Object { node --check $_.FullName; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE } }
          Get-ChildItem tools -Filter test_*.js | ForEach-Object { node $_.FullName; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE } }
          Get-ChildItem tools -Filter test_*.py | ForEach-Object { python $_.FullName; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE } }
          python tools/validate_runtime_architecture.py
          python tools/validate_asset_architecture.py
          python tools/validate_version_identity.py --version 0.6.5.19 --channel Beta
          git diff --check
          node tools/test_file_startup_browser.js
          node tools/smoke_run_resume_browser.js

      - name: Stage exact candidate
        shell: pwsh
        run: |
          git add -A
          git diff --cached --check
          git diff --cached --stat
          git diff --cached --name-status

      - name: Create GitHub blobs tree and commit without moving any ref
        id: server_commit
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PARENT_SHA: ${{ github.sha }}
        run: |
          @'
          import base64,json,os,subprocess,urllib.request
          from pathlib import Path

          repo=os.environ['REPO']; token=os.environ['GH_TOKEN']; parent=os.environ['PARENT_SHA']
          api='https://api.github.com/repos/'+repo
          headers={'Authorization':'Bearer '+token,'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'dicebound-candidate-materializer'}
          def request(method,url,payload=None):
              data=None if payload is None else json.dumps(payload).encode()
              req=urllib.request.Request(url,data=data,headers=headers,method=method)
              with urllib.request.urlopen(req,timeout=60) as r:return json.loads(r.read().decode())
          base_tree=subprocess.check_output(['git','rev-parse',parent+'^{tree}'],text=True).strip()
          out=subprocess.check_output(['git','diff','--cached','--name-status','-z'],text=False)
          parts=out.split(b'\0'); entries=[];i=0
          changed=[]
          while i<len(parts) and parts[i]:
              status=parts[i].decode();i+=1
              if status.startswith('R') or status.startswith('C'):
                  old=parts[i].decode();new=parts[i+1].decode();i+=2
                  path=new; changed.append((status,old,new))
              else:
                  path=parts[i].decode();i+=1; changed.append((status,path))
              if status.startswith('D'):
                  entries.append({'path':path,'mode':'100644','type':'blob','sha':None});continue
              raw=Path(path).read_bytes()
              blob=request('POST',api+'/git/blobs',{'content':base64.b64encode(raw).decode(),'encoding':'base64'})
              mode=subprocess.check_output(['git','ls-files','-s','--',path],text=True).split()[0]
              entries.append({'path':path,'mode':mode,'type':'blob','sha':blob['sha']})
          tree=request('POST',api+'/git/trees',{'base_tree':base_tree,'tree':entries})
          commit=request('POST',api+'/git/commits',{'message':'cleanup(runtime): aggressively drain monolith shadows','tree':tree['sha'],'parents':[parent]})
          print('BASE_TREE='+base_tree)
          print('CANDIDATE_TREE='+tree['sha'])
          print('CANDIDATE_SERVER_COMMIT='+commit['sha'])
          print('CANDIDATE_PARENT='+parent)
          print('CANDIDATE_ENTRY_COUNT='+str(len(entries)))
          print('CANDIDATE_CHANGED='+json.dumps(changed,separators=(',',':')))
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as f:
              f.write('sha='+commit['sha']+'\n')
              f.write('tree='+tree['sha']+'\n')
          '@ | Set-Content -Encoding UTF8 $env:RUNNER_TEMP\server_commit.py
          python $env:RUNNER_TEMP\server_commit.py

      - name: Record server commit identity
        shell: pwsh
        run: |
          "candidate_commit=${{ steps.server_commit.outputs.sha }}" | Set-Content -Encoding ascii candidate-server-commit.txt
          "candidate_tree=${{ steps.server_commit.outputs.tree }}" | Add-Content -Encoding ascii candidate-server-commit.txt
          "parent=${{ github.sha }}" | Add-Content -Encoding ascii candidate-server-commit.txt
          Get-FileHash runtime/js/dicebound.js -Algorithm SHA256 | Format-List
          Get-Content candidate-server-commit.txt

      - name: Upload server commit identity
        uses: actions/upload-artifact@v4
        with:
          name: beta-0.6.5.19-server-commit
          path: candidate-server-commit.txt
          if-no-files-found: error
          retention-days: 7
