name: Materialize Beta 0.6.6.13 Elements

on:
  push:
    branches:
      - candidate-0.6.6.13-element-resolution

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-2022
    steps:
      - name: Check out candidate
        uses: actions/checkout@v4
        with:
          ref: candidate-0.6.6.13-element-resolution
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Materialize extraction and release identity
        shell: pwsh
        run: |
          python tools/fix_0_6_6_13_materializer.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/materialize_0_6_6_13_elements.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Validate JavaScript and deterministic contracts
        shell: pwsh
        run: |
          Get-ChildItem runtime/js -Recurse -Filter *.js | ForEach-Object { node --check $_.FullName; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE } }
          Get-ChildItem tools -Filter test_*.js | ForEach-Object { node $_.FullName; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE } }

      - name: Validate Python contracts
        shell: pwsh
        run: |
          Get-ChildItem tools -Filter test_*.py | ForEach-Object { python $_.FullName; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE } }

      - name: Validate architecture assets launcher and version identity
        shell: pwsh
        run: |
          python tools/validate_runtime_architecture.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/validate_asset_architecture.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/validate_launcher_assets.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/prepare_release.py --output-dir wrapper-source/release/generated
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/validate_version_identity.py --version 0.6.6.13 --channel Beta --release-spec wrapper-source/release/generated/release-spec.json --release-notes wrapper-source/release/generated/release-notes.md
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Publish exact validated commit object
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          Copy-Item tools/publish_detached_validated_commit.py "$env:RUNNER_TEMP/publish_detached_validated_commit.py"
          git rm .github/workflows/materialize-0.6.6.13-elements.yml tools/materialize_0_6_6_13_elements.py tools/fix_0_6_6_13_materializer.py tools/publish_detached_validated_commit.py
          git add -A
          git config user.name "DiceBound Architecture Bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Beta 0.6.6.13 — extract Elemental Proc / Effect resolution"
          python "$env:RUNNER_TEMP/publish_detached_validated_commit.py"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
