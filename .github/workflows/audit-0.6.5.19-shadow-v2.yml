name: Audit Beta 0.6.5.19 aggressive cleanup

on:
  push:
    branches:
      - validation/0.6.5.19-shadow-audit-v2b
    paths:
      - .github/workflows/audit-0.6.5.19-shadow-v2.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: a45e820317280c98449ef91bf2ca0bd9b84138ff
          fetch-depth: 0
      - name: Inspect exact owner wiring and dead declarations
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('runtime/js/dicebound.js')
          src=p.read_text(encoding='utf-8')
          lines=src.splitlines()

          marker='const dbInfoGuide=window.DiceboundInfoGuide;'
          pos=src.index(marker)
          print('=== INFO OWNER WINDOW ===')
          line=src.count('\n',0,pos)+1
          for n in range(max(1,line-6), min(len(lines),line+70)+1):
              if 'renderInfo' in lines[n-1] or 'dbInfoGuide' in lines[n-1] or n in range(line-2,line+8):
                  print(f'{n}: {lines[n-1]}')
          print('\n=== POST-MARKER renderInfo ASSIGNMENTS ===')
          tail=src[pos:]
          for m in re.finditer(r'(?<![\w$])renderInfo\s*=\s*([^;]{0,300});',tail,re.S):
              print('line',line+tail.count('\n',0,m.start()),'::',' '.join(m.group(0).split()))

          print('\n=== HARNESS EXTERNAL CONSUMERS ===')
          for token in ['DiceboundAITest','buildAISim','DiceboundCareerTest','buildDiceboundHumanHarness235','v235HumanHarness']:
              hits=[]
              for root in [Path('runtime'),Path('tools'),Path('wrapper-source')]:
                  if not root.exists(): continue
                  for f in root.rglob('*'):
                      if not f.is_file() or f==p or f.suffix.lower() not in {'.js','.py','.html','.ps1','.json','.go'}: continue
                      try:t=f.read_text(encoding='utf-8',errors='ignore')
                      except:continue
                      if token in t:hits.append(str(f))
              print(token,sorted(set(hits)))

          def mask(text):
              out=list(text);i=0;n=len(text)
              while i<n:
                  if text.startswith('//',i):
                      j=text.find('\n',i+2);j=n if j<0 else j
                      for k in range(i,j):out[k]=' '
                      i=j;continue
                  if text.startswith('/*',i):
                      j=text.find('*/',i+2);j=n-2 if j<0 else j
                      for k in range(i,j+2):
                          if text[k]!='\n':out[k]=' '
                      i=j+2;continue
                  if text[i] in "'\"`":
                      q=text[i];j=i+1;esc=False
                      while j<n:
                          c=text[j]
                          if esc:esc=False
                          elif c=='\\':esc=True
                          elif c==q:j+=1;break
                          j+=1
                      for k in range(i,min(j,n)):
                          if text[k]!='\n':out[k]=' '
                      i=j;continue
                  i+=1
              return ''.join(out)
          code=mask(src)
          print('\n=== DECLARATION-ONLY NAMED FUNCTIONS ===')
          seen=[]
          for m in re.finditer(r'\bfunction\s+([A-Za-z_$][\w$]*)\s*\(',code):
              name=m.group(1)
              count=len(re.findall(rf'(?<![\w$]){re.escape(name)}(?![\w$])',code))
              rawcount=len(re.findall(rf'(?<![\w$]){re.escape(name)}(?![\w$])',src))
              if count==1 and rawcount==1:
                  seen.append((src.count('\n',0,m.start())+1,name))
          print('count',len(seen))
          for item in seen[:200]:print(item)
          PY
