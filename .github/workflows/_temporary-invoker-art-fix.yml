name: Temporary 0.6.6.15 branch materializer

on:
  push:
    branches:
      - fix/0.6.6.15-invoker-battle-art

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/0.6.6.15-invoker-battle-art
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply focused fix and regression guard
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path('.')
          source_path = root / 'runtime/js/dicebound.js'
          source = source_path.read_text(encoding='utf-8')
          pattern = r'const DB054_CLASS_ART_IDS=Object\.freeze\(\[[^;]*?\]\);'
          replacement = 'const DB054_CLASS_ART_IDS=Object.freeze(Object.keys(CLASSES));'
          source, count = re.subn(pattern, replacement, source, count=1, flags=re.S)
          if count != 1:
              raise SystemExit(f'Expected exactly one DB054 class-art allowlist, replaced {count}.')
          source_path.write_text(source, encoding='utf-8', newline='\n')

          test = r'''from pathlib import Path
          import json
          import re

          ROOT = Path(__file__).resolve().parents[1]
          monolith = (ROOT / "runtime/js/dicebound.js").read_text(encoding="utf-8")
          assets = (ROOT / "runtime/js/assets.js").read_text(encoding="utf-8")

          expected = "const DB054_CLASS_ART_IDS=Object.freeze(Object.keys(CLASSES));"
          assert expected in monolith, "Class-art compatibility allowlist must derive from the authoritative class registry."
          assert not re.search(r"const DB054_CLASS_ART_IDS=Object\.freeze\(\[", monolith), "A hand-maintained class-art allowlist must not return."

          match = re.search(r"const CLASSES=(\[[^;]+\]);", assets)
          assert match, "Could not locate the canonical asset class list."
          class_ids = json.loads(match.group(1))
          assert "invoker" in class_ids, "Invoker must be registered by the canonical asset registry."
          assert "dragoon" in class_ids, "Dragoon must remain registered by the canonical asset registry."
          for class_id in class_ids:
              for role in ("campsite", "battle", "markers"):
                  path = ROOT / "runtime/assets/characters/classes" / role / f"{class_id}.png"
                  assert path.is_file(), f"Missing canonical {role} art for registered class {class_id}: {path}"
          print(f"Class-art registry sync OK for {len(class_ids)} registered classes, including Invoker.")
          '''
          # Strip workflow indentation from the generated Python file.
          test = '\n'.join(line[10:] if line.startswith('          ') else line for line in test.splitlines()) + '\n'
          (root / 'tools/test_class_art_registry_sync.py').write_text(test, encoding='utf-8', newline='\n')

          patch_path = root / 'runtime/PATCH_NOTES.md'
          patch = patch_path.read_text(encoding='utf-8')
          old_head = '# Unreleased — Beta 0.6.6.14'
          if old_head not in patch:
              raise SystemExit('Expected 0.6.6.14 PATCH_NOTES heading was not found.')
          patch = patch.replace(old_head, '# Unreleased — Beta 0.6.6.15', 1)
          marker = '# Unreleased — Beta 0.6.6.15\n'
          section = '''\n## Beta 0.6.6.15 Invoker battle-art fix (#300)\n- Fixed the combat class-art compatibility resolver so it derives valid class IDs from the authoritative class registry instead of a stale hand-maintained allowlist. Invoker now resolves its approved full-body battle art rather than falling back to Ranger, and future registered classes inherit the same protection.\n- Added a registry-sync regression test covering canonical campsite, battle and marker art for every registered class. No gameplay, RNG, save, combat-math or progression behavior changes.\n'''
          patch = patch.replace(marker, marker + section, 1)
          patch_path.write_text(patch, encoding='utf-8', newline='\n')

          changelog_path = root / 'CHANGELOG.md'
          changelog = changelog_path.read_text(encoding='utf-8')
          anchor = 'This file starts the durable Git-era release history. Earlier Alpha/Beta history exists in recovered project notes; Beta 0.6 is the first release established as the repository baseline.\n'
          if anchor not in changelog:
              raise SystemExit('CHANGELOG insertion anchor was not found.')
          section = '''\n## Beta 0.6.6.15\n\n### Invoker battle-art fix (#300)\n- Replaced the stale hand-maintained combat class-art allowlist with IDs derived from the authoritative class registry, fixing Invoker incorrectly falling back to Ranger in battle and preventing the same failure mode for future registered classes.\n- Added a focused class-art registry-sync guard; gameplay and RNG are unchanged.\n'''
          changelog = changelog.replace(anchor, anchor + section, 1)
          changelog_path.write_text(changelog, encoding='utf-8', newline='\n')
          PY

          python tools/set_project_version.py --version 0.6.6.15 --channel Beta
          python tools/refresh_runtime_manifest.py --version 0.6.6.15 --channel Beta --development-state Unreleased
          python tools/test_class_art_registry_sync.py
          node --check runtime/js/dicebound.js
          git diff --check
      - name: Commit materialized branch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/_temporary-invoker-art-fix.yml
          git add CHANGELOG.md runtime/PATCH_NOTES.md runtime/js/dicebound.js runtime/js/version.js runtime/build-info.json runtime/build-manifest.json wrapper-source/config/project.json tools/test_class_art_registry_sync.py
          git add -u
          git commit -m 'fix: resolve Invoker battle art from class registry'
          git push origin HEAD:fix/0.6.6.15-invoker-battle-art
