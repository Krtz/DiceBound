# Retry after aligning normal Edge smoke with the current Prestige and Camp contracts.
name: Materialize Beta 0.6.5.16 Camp startup hotfix

on:
  push:
    branches:
      - hotfix/0.6.5.16-local-camp-startup
    paths:
      - .github/workflows/materialize-0.6.5.16-hotfix.yml

permissions:
  contents: read

jobs:
  materialize:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - name: Mint protected-ref App token
        id: app_token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.DICEBOUND_RELEASE_APP_ID }}
          private-key: ${{ secrets.DICEBOUND_RELEASE_APP_PRIVATE_KEY }}
          owner: Krtz
          repositories: DiceBound
          permission-contents: write

      - name: Check out hotfix branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.app_token.outputs.token }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Materialize and browser-smoke hotfix
        run: python tools/materialize_06516.py

      - name: Remove temporary materializers
        shell: pwsh
        run: |
          Remove-Item tools/materialize_06516.py -ErrorAction SilentlyContinue
          Remove-Item .github/workflows/hotfix-file-startup-smoke.yml -ErrorAction SilentlyContinue
          Remove-Item .github/workflows/materialize-0.6.5.16-hotfix.yml -ErrorAction SilentlyContinue

      - name: Commit exact tested hotfix
        shell: pwsh
        run: |
          git config user.name "dicebound-manifest-publisher[bot]"
          git config user.email "323488390+dicebound-manifest-publisher[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: restore local Camp startup"
          git push origin HEAD:hotfix/0.6.5.16-local-camp-startup
