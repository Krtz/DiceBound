name: Road Events Facade Branch Validation

on:
  push:
    branches:
      - arch/0.6.6.26-road-events-oracle

permissions:
  contents: write

jobs:
  wire-and-validate:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Wire DiceboundRoadEvents into runtime composition
        shell: pwsh
        run: |
          @'
          import json
          from pathlib import Path

          def one(text, old, new, label):
              count=text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly 1 match, got {count}")
              return text.replace(old,new,1)

          monolith_path=Path("runtime/js/dicebound.js")
          text=monolith_path.read_text(encoding="utf-8")
          anchor='  const dbRun=window.DiceboundRun;\n  if(!dbRun)throw new Error("dicebound.js requires DiceboundRun before loading.");\n'
          configured=anchor + '''  const dbRoadEvents=window.DiceboundRoadEvents;\n  if(!dbRoadEvents)throw new Error("dicebound.js requires DiceboundRoadEvents before loading.");\n  dbRoadEvents.configure({\n    openSlot:()=>openEvent(),\n    openWheel:()=>openWheelEvent(),\n    openTreasure:()=>openTreasure(),\n    openBlessing:()=>openBlessing(),\n    openMystic:()=>openMystic(),\n    openBloodwell:()=>openBloodwell(),\n    openGambler:()=>openGambler()\n  });\n'''
          text=one(text,anchor,configured,"Road Events facade bootstrap")
          routes={
            'openEvent:()=>openEvent()':'openEvent:()=>dbRoadEvents.openSlot()',
            'openWheelEvent:()=>openWheelEvent()':'openWheelEvent:()=>dbRoadEvents.openWheel()',
            'openTreasure:()=>openTreasure()':'openTreasure:()=>dbRoadEvents.openTreasure()',
            'openBlessing:()=>openBlessing()':'openBlessing:()=>dbRoadEvents.openBlessing()',
            'openMystic:()=>openMystic()':'openMystic:()=>dbRoadEvents.openMystic()',
            'openBloodwell:()=>openBloodwell()':'openBloodwell:()=>dbRoadEvents.openBloodwell()',
            'openGambler:()=>openGambler()':'openGambler:()=>dbRoadEvents.openGambler()',
          }
          for old,new in routes.items():
              text=one(text,old,new,f"tile dispatch route {old}")
          monolith_path.write_text(text,encoding="utf-8")

          manifest_path=Path("runtime/js/module-manifest.json")
          manifest=json.loads(manifest_path.read_text(encoding="utf-8"))
          if any(m.get("id")=="road-events-facade" for m in manifest["modules"]):
              raise SystemExit("road-events-facade unexpectedly already registered")
          event_index=next(i for i,m in enumerate(manifest["modules"]) if m.get("id")=="event-rewards")
          manifest["modules"].insert(event_index+1,{
              "id":"road-events-facade",
              "path":"js/events/facade.js",
              "domain":"events/public-road-events-subsystem-facade",
              "status":"extracted",
              "requires":["event-rewards"],
              "provides":["DiceboundRoadEvents"],
          })
          mono=next(m for m in manifest["modules"] if m.get("id")=="dicebound-monolith")
          if "road-events-facade" in mono["requires"]:
              raise SystemExit("monolith unexpectedly already requires road-events-facade")
          pos=mono["requires"].index("event-rewards")+1
          mono["requires"].insert(pos,"road-events-facade")
          load=manifest["loadOrder"]
          if "road-events-facade" in load:
              raise SystemExit("loadOrder unexpectedly already contains road-events-facade")
          load.insert(load.index("event-rewards")+1,"road-events-facade")
          manifest_path.write_text(json.dumps(manifest,indent=2)+"\n",encoding="utf-8")

          index_path=Path("runtime/index.html")
          index=index_path.read_text(encoding="utf-8")
          index=one(index,'<script src="js/events/reward-policy.js"></script>','<script src="js/events/reward-policy.js"></script>\n<script src="js/events/facade.js"></script>',"runtime index Road Events facade script")
          index_path.write_text(index,encoding="utf-8")
          '@ | python -

          python tools/refresh_runtime_manifest.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Validate facade seam and frozen behavior
        shell: pwsh
        run: |
          node tools/test_road_events_facade.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/test_road_events_oracle.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/test_event_reward_policy.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/test_board_tile_dispatch.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/test_run_facade.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/validate_runtime_architecture.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/test_runtime_manifest_hash.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Materialize validated facade wiring commit object
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          @'
          import base64,json,os,subprocess,urllib.request
          from pathlib import Path
          repo=os.environ["GITHUB_REPOSITORY"]; token=os.environ["GH_TOKEN"]; parent=os.environ["GITHUB_SHA"]
          api=f"https://api.github.com/repos/{repo}/git"
          def post(path,payload):
              req=urllib.request.Request(api+path,data=json.dumps(payload).encode(),headers={"Authorization":f"Bearer {token}","Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28","Content-Type":"application/json"},method="POST")
              with urllib.request.urlopen(req) as r:return json.load(r)
          changed=subprocess.check_output(["git","diff","--name-only","--diff-filter=ACMRT","HEAD"],text=True).splitlines()
          if not changed: raise SystemExit("no Road Events facade wiring changes produced")
          entries=[]
          for filename in changed:
              raw=Path(filename).read_bytes(); blob=post("/blobs",{"content":base64.b64encode(raw).decode(),"encoding":"base64"})
              entries.append({"path":filename,"mode":"100644","type":"blob","sha":blob["sha"]})
          tree=post("/trees",{"base_tree":subprocess.check_output(["git","rev-parse","HEAD^{tree}"],text=True).strip(),"tree":entries})
          commit=post("/commits",{"message":"architecture: route Board and Run through Road Events facade","tree":tree["sha"],"parents":[parent]})
          print("CHANGED_FILES="+",".join(changed)); print("REMOTE_COMMIT_SHA="+commit["sha"])
          '@ | python -
