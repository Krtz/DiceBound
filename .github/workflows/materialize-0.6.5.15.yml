name: Materialize Beta 0.6.5.15

on:
  push:
    branches:
      - fix/0.6.5.15-prestige-heirlooms-camp
    paths:
      - .github/workflows/materialize-0.6.5.15.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Materialize patch and run targeted tests
        run: python tools/materialize_06515.py

      - name: Remove temporary materializer
        run: |
          rm -f tools/materialize_06515.py
          rm -f .github/workflows/materialize-0.6.5.15.yml

      - name: Commit patch
        run: |
          git config user.name "dicebound-materializer[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: move Heirloom progression to Prestige Moon"
          git push origin HEAD:fix/0.6.5.15-prestige-heirlooms-camp
