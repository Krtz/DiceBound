name: Materialize 0.6.7.4 traversal footprints v3

on:
  push:
    branches:
      - feature/0.6.7.4-board-traversal-footprints
    paths:
      - .github/workflows/materialize-0.6.7.4-v3.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply corrected focused patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess, textwrap
          workflow=Path('.github/workflows/materialize-0.6.7.4.yml').read_text(encoding='utf-8')
          marker="          python - <<'PY'\n"
          start=workflow.index(marker)+len(marker)
          end=workflow.index("\n          PY",start)
          code=textwrap.dedent(workflow[start:end])
          code=code.replace("'''    el.className=`tile ${tile.type}`;'''","'''el.className=`tile ${tile.type}`;'''")
          exec(compile(code,'materialize-0.6.7.4.py','exec'),{'__name__':'__main__'})
          subprocess.run(['python','tools/set_project_version.py','--version','0.6.7.4','--channel','Beta'],check=True)
          subprocess.run(['python','tools/refresh_runtime_manifest.py','--version','0.6.7.4','--channel','Beta','--development-state','Unreleased'],check=True)
          PY
      - name: Focused source validation
        shell: bash
        run: |
          node --check runtime/js/board/movement.js
          node --check runtime/js/board/presentation.js
          node --check runtime/js/dicebound.js
          node tools/test_board_movement.js
          node tools/test_board_presentation_oracle.js
          node tools/test_run_checkpoint.js
          python tools/test_canonical_tile_meta.py
          python tools/validate_runtime_architecture.py
      - name: Publish exact validated commit object
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add runtime tools wrapper-source
          git commit -m 'Beta 0.6.7.4: add traversal footprints'
          python - <<'PY'
          import base64, json, os, subprocess, urllib.request

          repo=os.environ['GITHUB_REPOSITORY']
          token=os.environ['GITHUB_TOKEN']
          parent=os.environ['GITHUB_SHA']
          api='https://api.github.com/repos/'+repo

          def post(path,payload):
              req=urllib.request.Request(api+path,data=json.dumps(payload).encode(),method='POST',headers={
                  'Authorization':'Bearer '+token,
                  'Accept':'application/vnd.github+json',
                  'X-GitHub-Api-Version':'2022-11-28',
                  'Content-Type':'application/json',
              })
              with urllib.request.urlopen(req) as r:
                  return json.loads(r.read().decode())

          changed=subprocess.check_output(['git','diff','--name-only',parent,'HEAD'],text=True).splitlines()
          entries=[]
          for path in changed:
              raw=subprocess.check_output(['git','show',f'HEAD:{path}'])
              blob=post('/git/blobs',{'content':base64.b64encode(raw).decode(),'encoding':'base64'})
              mode=subprocess.check_output(['git','ls-tree','HEAD',path],text=True).split()[0]
              entries.append({'path':path,'mode':mode,'type':'blob','sha':blob['sha']})
          base_tree=subprocess.check_output(['git','rev-parse',parent+'^{tree}'],text=True).strip()
          tree=post('/git/trees',{'base_tree':base_tree,'tree':entries})
          commit=post('/git/commits',{'message':'Beta 0.6.7.4: add traversal footprints','tree':tree['sha'],'parents':[parent]})
          print('MATERIALIZED_SERVER_COMMIT='+commit['sha'])
          print('MATERIALIZED_SERVER_TREE='+tree['sha'])
          print('MATERIALIZED_CHANGED_FILES='+str(len(changed)))
          PY
