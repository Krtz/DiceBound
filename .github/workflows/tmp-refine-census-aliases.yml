name: Temporary historical alias census refinement

on:
  push:
    branches:
      - refactor/0.6.6.38-canonical-functions
    paths:
      - .github/workflows/tmp-refine-census-aliases.yml

permissions:
  contents: read

jobs:
  refine:
    runs-on: windows-latest
    steps:
      - name: Mint repository App token
        id: app
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.DICEBOUND_RELEASE_APP_ID }}
          private-key: ${{ secrets.DICEBOUND_RELEASE_APP_PRIVATE_KEY }}
          owner: Krtz
          repositories: DiceBound
          permission-contents: write
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.app.outputs.token }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refine alias detection and regenerate census
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          @'
          from pathlib import Path
          p=Path('tools/test_historical_layer_census.py')
          text=p.read_text(encoding='utf-8')
          old='''CAPTURE_RE = re.compile(\n    r"(?<![.\\w$])([A-Za-z_$][\\w$]*(?:Base|Orig|Original|Previous|Prev|Legacy|Old)[A-Za-z0-9_$]*)\\s*=\\s*([A-Za-z_$][\\w$]*)\\b",\n    re.IGNORECASE,\n)\n'''
          new='''CAPTURE_RE = re.compile(\n    r"(?<![.\\w$])([A-Za-z_$][\\w$]*)\\s*=\\s*([A-Za-z_$][\\w$]*)\\b"\n)\nHISTORY_ALIAS_RE = re.compile(\n    r"^(?:(?:old|legacy|previous|prev|base|orig(?:inal)?|compat|wrapper|override|historical|superseded)(?=$|[A-Z0-9_$])|.*(?:Base|Orig(?:inal)?|Previous|Prev|Legacy|Old|Compat|Wrapper|Override|Historical|Superseded)(?=$|[A-Z0-9_$]))"\n)\n'''
          if old not in text:
              raise SystemExit('expected CAPTURE_RE block not found')
          text=text.replace(old,new,1)
          old2='''HISTORY_NAME_RE = re.compile(\n    r"(?:Base$|Orig(?:inal)?|Previous|Prev|Legacy|Old|Compat|Wrapper|Override|Historical|Superseded)",\n    re.IGNORECASE,\n)\n'''
          if old2 not in text:
              raise SystemExit('expected HISTORY_NAME_RE block not found')
          text=text.replace(old2,'HISTORY_NAME_RE = HISTORY_ALIAS_RE\n',1)
          old3='    raw_captures = list(CAPTURE_RE.finditer(code))\n'
          new3='    raw_captures = [match for match in CAPTURE_RE.finditer(code) if HISTORY_ALIAS_RE.search(match.group(1))]\n'
          if old3 not in text:
              raise SystemExit('expected raw_captures line not found')
          text=text.replace(old3,new3,1)
          p.write_text(text,encoding='utf-8',newline='\n')
          '@ | Set-Content -Encoding UTF8 .tmp_refine_census.py
          python .tmp_refine_census.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Remove-Item .tmp_refine_census.py
          python -c "from pathlib import Path; from tools.test_historical_layer_census import analyze; p=(Path.cwd()/'.tmp_census_probe.js').resolve(); p.write_text('async function f(){ const oldResponse=resolveEnemyResponse; resolveEnemyResponse=async()=>{}; try{} finally{resolveEnemyResponse=oldResponse;} }',encoding='utf-8'); r=analyze(p); p.unlink(); assert r['temporary_overrides']==1 and r['captures']==0 and r['repeated']==0, r; print('oldResponse save/override/restore probe PASS',r)"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/test_historical_layer_census.py --markdown docs/HISTORICAL_LAYER_CENSUS.md
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/test_canonical_debug_action.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/test_canonical_debug_ui.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/test_canonical_tile_meta.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check runtime/js/dicebound.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/validate_runtime_architecture.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/validate_version_identity.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Commit refinement and remove one-shot workflow
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Remove-Item .github/workflows/tmp-refine-census-aliases.yml
          git config user.name "dicebound-manifest-publisher[bot]"
          git config user.email "323488390+dicebound-manifest-publisher[bot]@users.noreply.github.com"
          git add -A
          git commit -m "tools: refine historical alias detection"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git push origin HEAD:refactor/0.6.6.38-canonical-functions
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
