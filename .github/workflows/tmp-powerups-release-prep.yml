name: Temporary Powerups 0.6.6.33 release prep

on:
  push:
    branches:
      - arch/0.6.6.33-powerups-oracle
    paths:
      - tools/tmp_powerups_release_prep.py
      - .github/workflows/tmp-powerups-release-prep.yml

permissions:
  contents: write

jobs:
  release-prep:
    runs-on: windows-2022
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.7'

      - name: Stage Beta 0.6.6.33 identity and notes
        shell: pwsh
        run: |
          python tools/set_project_version.py --version 0.6.6.33 --channel Beta
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/tmp_powerups_release_prep.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/refresh_runtime_manifest.py --version 0.6.6.33 --channel Beta --development-state Unreleased
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Enforce unique four-component version against main
        shell: pwsh
        run: python tools/validate_pr_version.py --base-ref origin/main

      - name: Syntax-check runtime JavaScript
        shell: pwsh
        run: |
          Get-ChildItem runtime/js -Recurse -Filter *.js | Sort-Object FullName | ForEach-Object {
            node --check $_.FullName
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Run all JavaScript tests
        shell: pwsh
        run: |
          Get-ChildItem tools -Filter 'test_*.js' | Sort-Object Name | ForEach-Object {
            Write-Host "==> $($_.Name)"
            node $_.FullName
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Run all Python tests
        shell: pwsh
        run: |
          Get-ChildItem tools -Filter 'test_*.py' | Sort-Object Name | ForEach-Object {
            Write-Host "==> $($_.Name)"
            python $_.FullName
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Validate runtime architecture
        shell: pwsh
        run: python tools/validate_runtime_architecture.py

      - name: Validate asset architecture
        shell: pwsh
        run: python tools/validate_asset_architecture.py

      - name: Validate version identity
        shell: pwsh
        run: python tools/validate_version_identity.py

      - name: Validate launcher assets
        shell: pwsh
        run: python tools/validate_launcher_assets.py

      - name: Test and vet installer Go sources
        shell: pwsh
        run: |
          go test .\installer\main_v2.go .\installer\http_policy.go .\installer\main_v2_test.go
          if ($LASTEXITCODE -eq 0) { go vet .\installer\main_v2.go .\installer\http_policy.go .\installer\main_v2_test.go }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Check patch cleanliness
        shell: pwsh
        run: git diff --check

      - name: Materialize exact 0.6.6.33 release candidate
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp-powerups-release-prep.yml
          git rm tools/tmp_powerups_release_prep.py
          git add -A
          git commit -m "release: stage Beta 0.6.6.33 Powerups"
          $checkpoint = git rev-parse HEAD
          Write-Host "POWERUPS_RELEASE_CANDIDATE=$checkpoint"
          git push origin HEAD:arch/0.6.6.33-powerups-oracle
