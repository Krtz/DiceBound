name: Items Generation Owner Migration

on:
  push:
    branches:
      - arch/0.6.6.27-items-oracle

permissions:
  contents: write

jobs:
  migrate-and-validate:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Stage generation owner migration
        shell: pwsh
        run: |
          python tools/migrate_items_generation_owner.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/refresh_runtime_manifest.py --version 0.6.6.26 --channel Beta --development-state Unreleased
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          @'
          from pathlib import Path
          for name in ('runtime/index.html','runtime/js/module-manifest.json','runtime/js/dicebound.js','runtime/build-info.json','runtime/build-manifest.json'):
              path=Path(name); text=path.read_text(encoding='utf-8'); path.write_text(text,encoding='utf-8',newline='\n')
          '@ | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Validate exact Items behavior and ownership
        shell: pwsh
        run: |
          node tools/test_items_generation_owner.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/test_items_facade.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/test_items_oracle.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/test_ordinary_equipment_generation.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/test_equipment_identity_registry.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/test_loot_module.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/test_artifacts_module.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/test_road_event_treasure.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/test_road_events_facade.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/test_merchant_stock_resolution_browser.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/test_player_initialization.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/test_run_facade.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/validate_runtime_architecture.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/test_runtime_manifest_hash.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Materialize exact validated migration
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/materialize_items_generation_owner.py
