name: Road Events Treasure Migration

on:
  push:
    branches:
      - arch/0.6.6.26-road-events-oracle

permissions:
  contents: write

jobs:
  migrate-and-validate:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Migrate Treasure ownership
        shell: pwsh
        run: |
          @'
          import json
          from pathlib import Path

          def cut(text,start,end,label):
              a=text.find(start)
              if a<0: raise SystemExit(f"{label}: start marker missing")
              b=text.find(end,a+len(start))
              if b<0: raise SystemExit(f"{label}: end marker missing")
              return text[:a]+text[b:]

          p=Path('runtime/js/dicebound.js')
          raw=p.read_bytes()
          text=raw.decode('utf-8')
          eol='\r\n' if '\r\n' in text else '\n'

          # Route the facade's Treasure entry directly into the extracted owner runtime.
          old='    openTreasure:()=>openTreasure(),'
          if text.count(old)!=1: raise SystemExit(f"Treasure facade adapter count {text.count(old)}")
          treasure_cfg=eol.join([
            '    treasure:{',
            '      getPlayer:()=>player,',
            '      getBoardLevel:()=>boardLevel,',
            '      getTiles:()=>tiles,',
            '      currentTileCount:()=>currentTileCount(),',
            '      isHell:()=>hellMode,',
            '      isNightmare:()=>nightmareMode,',
            '      random:()=>random(),',
            '      rand:(a,b)=>rand(a,b),',
            '      modifiedGold:value=>modifiedGold(value),',
            '      clamp:(value,min,max)=>clamp(value,min,max),',
            '      refreshTile:index=>refreshTile(index),',
            '      coin:()=>sfx.coin(),',
            '      addLog:text=>addLog(text),',
            '      showToast:(...args)=>showToast(...args),',
            '      updateHUD:()=>updateHUD(),',
            '      returnToRoad:()=>returnToRoad(),',
            '      rollGearRarity:bonus=>rollGearRarity(bonus),',
            '      generateEquipment:rarity=>generateEquipment(rarity),',
            '      openLoot:(item,done)=>openLoot(item,done),',
            '      generateLegendary:(slot,preferUndiscovered)=>db060GenerateLegendary(slot,preferUndiscovered)',
            '    },'
          ])
          text=text.replace(old,treasure_cfg,1)

          # Remove every historical Treasure implementation layer. The extracted owner
          # contains the final 0.6 behavior and intentionally omits the retired v24 cache.
          text=cut(text,'  function openTreasure(){','  function useCamp(){','base Treasure')
          text=cut(text,'  openTreasure=function(){const progress=','  // ---- Summoner & Pokémon Trainer runtime','scaled Treasure')
          text=cut(text,'  const openTreasureV24Base=openTreasure;','  /* MODULE: Artifact-tier Impossible Road','v24 Treasure wrapper')
          text=cut(text,'  // MEMORY CACHE ------------------------------------------------------------','  // ARTIFACT LOOT TABLE -----------------------------------------------------','0.6 Treasure wrapper')
          p.write_bytes(text.encode('utf-8'))

          manifest_path=Path('runtime/js/module-manifest.json')
          manifest=json.loads(manifest_path.read_text(encoding='utf-8'))
          if not any(m.get('id')=='road-event-treasure' for m in manifest['modules']):
              facade_index=next(i for i,m in enumerate(manifest['modules']) if m.get('id')=='road-events-facade')
              manifest['modules'].insert(facade_index,{
                  'id':'road-event-treasure',
                  'path':'js/events/treasure.js',
                  'domain':'events/treasure-lifecycle-and-memory-cache',
                  'status':'extracted',
                  'requires':[],
                  'provides':['DiceboundRoadEventTreasure']
              })
          facade=next(m for m in manifest['modules'] if m.get('id')=='road-events-facade')
          if 'road-event-treasure' not in facade['requires']:
              facade['requires'].append('road-event-treasure')
          load=manifest['loadOrder']
          if 'road-event-treasure' not in load:
              load.insert(load.index('road-events-facade'),'road-event-treasure')
          manifest_path.write_text(json.dumps(manifest,indent=2)+'\n',encoding='utf-8')

          index_path=Path('runtime/index.html')
          index=index_path.read_text(encoding='utf-8')
          if 'js/events/treasure.js' not in index:
              marker='<script src="js/events/facade.js"></script>'
              if index.count(marker)!=1: raise SystemExit('facade script marker not unique')
              index=index.replace(marker,'<script src="js/events/treasure.js"></script>\n'+marker,1)
          index_path.write_text(index,encoding='utf-8')
          '@ | python -

          python tools/refresh_runtime_manifest.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Validate Treasure migration
        shell: pwsh
        run: |
          node tools/test_road_event_treasure.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/test_road_event_treasure_shadow.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/test_road_events_facade.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/test_road_events_oracle.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/test_event_reward_policy.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/test_loot_module.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/test_ordinary_equipment_generation.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/test_board_tile_dispatch.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/test_run_facade.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/test_run_checkpoint.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/validate_runtime_architecture.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/test_runtime_manifest_hash.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Materialize validated Treasure migration
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          @'
          import base64,json,os,subprocess,urllib.request
          from pathlib import Path
          repo=os.environ['GITHUB_REPOSITORY']; token=os.environ['GH_TOKEN']; parent=os.environ['GITHUB_SHA']
          api=f"https://api.github.com/repos/{repo}/git"
          def post(path,payload):
              req=urllib.request.Request(api+path,data=json.dumps(payload).encode(),headers={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json'},method='POST')
              with urllib.request.urlopen(req) as r:return json.load(r)
          changed=subprocess.check_output(['git','diff','--name-only','--diff-filter=ACMRT','HEAD'],text=True).splitlines()
          if not changed: raise SystemExit('no Treasure migration changes produced')
          entries=[]
          for filename in changed:
              raw=Path(filename).read_bytes(); blob=post('/blobs',{'content':base64.b64encode(raw).decode(),'encoding':'base64'})
              entries.append({'path':filename,'mode':'100644','type':'blob','sha':blob['sha']})
          tree=post('/trees',{'base_tree':subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip(),'tree':entries})
          commit=post('/commits',{'message':'architecture: extract Road Event Treasure lifecycle','tree':tree['sha'],'parents':[parent]})
          print('CHANGED_FILES='+','.join(changed)); print('REMOTE_COMMIT_SHA='+commit['sha'])
          '@ | python -
