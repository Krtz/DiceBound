name: Pets owner seam

on:
  push:
    branches:
      - arch/0.6.6.28-pets-oracle

permissions:
  contents: write

jobs:
  validate-and-materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch Pet owner seam
        shell: pwsh
        run: |
          python tools/patch_pets_owner_seam.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/refresh_runtime_manifest.py --version 0.6.6.27 --channel Beta --development-state Unreleased
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Validate Pet ownership and frozen behavior
        shell: pwsh
        run: |
          Get-ChildItem runtime/js/pets -Filter *.js | ForEach-Object { node --check $_.FullName; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE } }
          node --check runtime/js/dicebound.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/test_pets_lifecycle.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/test_pets_oracle.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/test_pet_chooser.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/test_combat_pet_turn_resolution.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/test_player_initialization.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/test_class_registry.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/test_content_registries.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/test_static_registries.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/test_run_checkpoint.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/validate_runtime_architecture.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/test_runtime_manifest_hash.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Materialize exact tested Pet owner seam
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add runtime/index.html runtime/js/module-manifest.json runtime/js/dicebound.js runtime/build-info.json runtime/build-manifest.json
          if (git diff --cached --quiet) { Write-Host 'No materialization changes.'; exit 0 }
          git commit -m 'architecture: route Pet lifecycle through DiceboundPets'
          git push origin HEAD:arch/0.6.6.28-pets-oracle
