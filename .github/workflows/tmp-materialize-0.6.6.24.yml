name: Temporary materialize Beta 0.6.6.24

on:
  push:
    branches:
      - arch/0.6.6.24-merchant-stock-resolution
    paths:
      - tools/tmp_materialize_0_6_6_24.py
      - .github/workflows/tmp-materialize-0.6.6.24.yml

permissions:
  contents: read

jobs:
  materialize:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Materialize release identity and notes
        shell: pwsh
        run: |
          python tools/tmp_materialize_0_6_6_24.py
          python tools/set_project_version.py --version 0.6.6.24 --channel Beta
          python tools/refresh_runtime_manifest.py --version 0.6.6.24 --channel Beta --development-state Unreleased
          python tools/prepare_release.py --output-dir wrapper-source/release/generated
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/validate_version_identity.py --version 0.6.6.24 --channel Beta --release-spec wrapper-source/release/generated/release-spec.json --release-notes wrapper-source/release/generated/release-notes.md
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Mint release app token
        id: release_app_token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.DICEBOUND_RELEASE_APP_ID }}
          private-key: ${{ secrets.DICEBOUND_RELEASE_APP_PRIVATE_KEY }}
          owner: Krtz
          repositories: DiceBound
          permission-contents: write
      - name: Commit materialized Beta 0.6.6.24
        shell: pwsh
        env:
          APP_TOKEN: ${{ steps.release_app_token.outputs.token }}
        run: |
          Remove-Item tools/tmp_materialize_0_6_6_24.py -Force
          Remove-Item .github/workflows/tmp-materialize-0.6.6.24.yml -Force
          if (Test-Path wrapper-source/release/generated) { Remove-Item wrapper-source/release/generated -Recurse -Force }
          git config user.name "DiceBound Release App"
          git config user.email "release-app@users.noreply.github.com"
          git add -A
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { throw "Materialization produced no committed changes." }
          git commit -m "Beta 0.6.6.24: materialize Merchant stock extraction release"
          git config --local --unset-all http.https://github.com/.extraheader
          git remote set-url origin "https://x-access-token:$env:APP_TOKEN@github.com/Krtz/DiceBound.git"
          git push origin HEAD:arch/0.6.6.24-merchant-stock-resolution
