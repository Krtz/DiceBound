name: TEMP 0.6.7.3 final road dice cleanup

on:
  push:
    branches:
      - fix/0.6.7.3-double-dice-roll-lock

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Remove final road-dice sediment
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('runtime/js/dicebound.js')
          text=p.read_text(encoding='utf-8')
          old='''  // Double Dice UI and roll sequencing live in runtime/js/run/dice.js.\n  setTimeout(()=>{v22EnsureDebugUnlockButtons();dbRunDice.ensureButton();v22UpdateCamp();},0);'''
          new='''  // Debug/Camp refresh remains here; road-dice controls are initialized once by DiceboundRunDice composition above.\n  setTimeout(()=>{v22EnsureDebugUnlockButtons();v22UpdateCamp();},0);'''
          if text.count(old)!=1:
              raise SystemExit(f'expected one late Double Dice initialization block, found {text.count(old)}')
          p.write_text(text.replace(old,new,1),encoding='utf-8')
          PY
          python tools/refresh_runtime_manifest.py --version 0.6.7.3 --channel Beta --development-state Unreleased
      - name: Validate final road-dice owner
        run: |
          node --check runtime/js/run/dice.js
          node --check runtime/js/dicebound.js
          node tools/test_run_dice.js
          node tools/test_runtime_oracle.js
          python tools/validate_runtime_architecture.py
          python tools/validate_version_identity.py --version 0.6.7.3 --channel Beta
      - name: Commit validated final tree
        run: |
          git rm .github/workflows/tmp-0673-final-dice-cleanup.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Beta 0.6.7.3 — finish canonical road dice cleanup (#371)"
          git push origin HEAD:fix/0.6.7.3-double-dice-roll-lock
