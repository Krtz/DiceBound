name: Temporary monolith shadow audit

on:
  push:
    branches:
      - audit/monolith-shadow-dead-code

permissions:
  contents: write

jobs:
  audit:
    runs-on: windows-2022
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate and validate audit
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m py_compile tools/audit_monolith_shadow_ownership.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/audit_monolith_shadow_ownership.py --markdown docs/MONOLITH_SHADOW_AUDIT.md
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/test_historical_layer_census.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Commit audit checkpoint
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name "dicebound-audit[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/DESIGN_RULES.md docs/MONOLITH_SHADOW_AUDIT.md tools/audit_monolith_shadow_ownership.py
          git rm .github/workflows/tmp-monolith-shadow-audit.yml
          git diff --cached --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (git diff --cached --quiet)) {
            git commit -m "docs: checkpoint monolith shadow ownership audit"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            git push origin HEAD:audit/monolith-shadow-dead-code
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
