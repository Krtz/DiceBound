name: Temporary 0.6.7.0 class oracle bisect

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  classes-oracle:
    name: classes-oracle (${{ matrix.label }})
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: released-main
            ref: db7e6f423caaa06b5d8939dbf113da3a1236ccdb
          - label: first-checkpoint
            ref: 8004ed651b1f405bc1c0a0a802b6d9dce77c9458
    steps:
      - name: Check out candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}
          fetch-depth: 0
      - name: Run exact Classes oracle
        shell: pwsh
        run: node tools/test_classes_oracle.js
