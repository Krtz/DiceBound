name: Temporary Combat View oracle materializer

on:
  push:
    branches:
      - arch/0.6.6.32-combat-view-oracle
    paths:
      - tools/test_combat_view_oracle.js
      - .github/workflows/tmp-combat-view-oracle.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: windows-2022
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Syntax check oracle
        shell: pwsh
        run: node --check tools/test_combat_view_oracle.js

      - name: Materialize released 0.6.6.31 fixture
        shell: pwsh
        run: |
          $env:DB_UPDATE_COMBAT_VIEW_ORACLE = '1'
          node tools/test_combat_view_oracle.js
          Remove-Item Env:DB_UPDATE_COMBAT_VIEW_ORACLE

      - name: Verify exact fixture replay
        shell: pwsh
        run: node tools/test_combat_view_oracle.js

      - name: Verify focused Combat View suites
        shell: pwsh
        run: |
          node tools/test_combat_presentation.js
          node tools/test_combat_vfx.js
          node tools/test_combat_ui_layout.js

      - name: Verify architecture baseline
        shell: pwsh
        run: python tools/validate_runtime_architecture.py

      - name: Materialize exact oracle checkpoint
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/fixtures/combat_view_0_6_6_31.json
          git rm .github/workflows/tmp-combat-view-oracle.yml
          git commit -m "test: freeze 0.6.6.31 Combat View behavior"
          $checkpoint = git rev-parse HEAD
          Write-Host "COMBAT_VIEW_ORACLE_CHECKPOINT=$checkpoint"
          git push origin HEAD:arch/0.6.6.32-combat-view-oracle
