name: Temporary 0.6.6.39 canonical materializer

on:
  push:
    branches:
      - refactor/0.6.6.39-canonical-functions-2
    paths:
      - .github/workflows/tmp-materialize-06639.yml

permissions:
  contents: read

jobs:
  materialize:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - name: Mint repository App token
        id: app
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.DICEBOUND_RELEASE_APP_ID }}
          private-key: ${{ secrets.DICEBOUND_RELEASE_APP_PRIVATE_KEY }}
          owner: Krtz
          repositories: DiceBound
          permission-contents: write
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.app.outputs.token }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Materialize canonical Powerup presentation and release hardening
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python tools/tmp_materialize_06639.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          @'
          from pathlib import Path
          p = Path('runtime/js/dicebound.js')
          s = p.read_text(encoding='utf-8')
          old = 'levelChoices:()=>v18LevelChoices().map(dbPowerupsOracleSummary)'
          new = 'levelChoices:()=>dbPowerups.levelChoices().map(dbPowerupsOracleSummary)'
          if s.count(old) != 1:
              raise SystemExit(f'expected one Powerups oracle v18LevelChoices reference, found {s.count(old)}')
          s = s.replace(old, new, 1)

          bridge = 'function powerupDisplayDesc(up){return dbPowerups.describe(up);}'
          bridge_count = s.count(bridge)
          if bridge_count > 1:
              raise SystemExit(f'expected at most one powerupDisplayDesc bridge, found {bridge_count}')
          if bridge_count == 1:
              s = s.replace(bridge, '', 1)
          marker = 'function choiceHTML(up){'
          if s.count(marker) != 1:
              raise SystemExit(f'expected one canonical choiceHTML marker, found {s.count(marker)}')
          s = s.replace(marker, bridge + '\n\n  ' + marker, 1)
          s = '\n'.join(line.rstrip(' \t') for line in s.split('\n'))
          p.write_text(s, encoding='utf-8', newline='\n')

          release_test = Path('tools/test_release_workflow.py')
          release_source = release_test.read_text(encoding='utf-8')
          old_assert = 'assert source.count(safe_manifest_get) == 2, "both manifest GETs must delimit $manifestPath before the query string"'
          new_assert = 'assert source.count(safe_manifest_get) == 3, "all manifest GETs must delimit $manifestPath before the query string"'
          if release_source.count(old_assert) != 1:
              raise SystemExit(f'expected one legacy safe-manifest GET count assertion, found {release_source.count(old_assert)}')
          release_test.write_text(release_source.replace(old_assert, new_assert, 1), encoding='utf-8', newline='\n')

          test = Path('tools/test_canonical_powerup_presentation.py')
          test.write_text(r'''from pathlib import Path
          import re

          ROOT = Path(__file__).resolve().parents[1]
          SOURCE = (ROOT / "runtime/js/dicebound.js").read_text(encoding="utf-8")
          FACADE = (ROOT / "runtime/js/powerups/facade.js").read_text(encoding="utf-8")

          for token in [
              "openLevelUpV16Base", "showPowerupChoiceV16Base", "openLevelUpV26Base",
              "showLegendaryChoiceV27Base", "db0511ChoiceHTMLBase", "attachPowerupRerollV16",
              "v18LevelChoices",
          ]:
              if token in SOURCE:
                  raise SystemExit(f"historical Powerup presentation token returned: {token}")

          for retired in ["openLevelUp", "showPowerupChoice", "showLegendaryChoice"]:
              if f"function {retired}(" in SOURCE:
                  raise SystemExit(f"monolith {retired} declaration returned")
              if re.search(rf"(?<![.\w$]){re.escape(retired)}\s*=\s*function\b", SOURCE):
                  raise SystemExit(f"monolith {retired} replacement returned")

          for canonical in ["powerupDisplayDesc", "choiceHTML", "attachPowerupReroll", "renderLevelUpChoices", "renderPowerupChoiceOverlay", "renderLegendaryChoice"]:
              count = SOURCE.count(f"function {canonical}(")
              if count != 1:
                  raise SystemExit(f"expected one canonical {canonical}, found {count}")

          required_source = [
              "function powerupDisplayDesc(up){return dbPowerups.describe(up);}",
              "if(pendingLevelUps>0)dbPowerups.openLevelUp(onComplete);",
              "attachPowerupReroll(grid,()=>dbPowerups.openLevelUp(onComplete));",
              "attachPowerupReroll(grid,()=>dbPowerups.openChoice(source,onComplete,filter,subtitle));",
              "if(String(source).toLowerCase().includes('miniboss'))return v27ShowMinibossReward(source,onComplete);",
              "Every eligible Legendary is exhausted. Choose an Epic power instead.",
              "Legendary pool exhausted",
              "The guardian yields. Choose one guaranteed Legendary powerup.",
              "renderLevelUp:onComplete=>renderLevelUpChoices(onComplete)",
              "renderPowerupChoice:(source,onComplete,filter,subtitle)=>renderPowerupChoiceOverlay(source,onComplete,filter,subtitle)",
              "renderLegendaryChoice:(source,onComplete)=>renderLegendaryChoice(source,onComplete)",
              "return dbPowerups.openLegendary(source,onComplete);",
              "levelChoices:()=>dbPowerups.levelChoices().map(dbPowerupsOracleSummary)",
          ]
          for marker in required_source:
              if marker not in SOURCE:
                  raise SystemExit(f"canonical Powerup presentation missing {marker!r}")

          if "if(call(\"isGameStarted\")&&p.v26ExpandedHorizons)p.levelChoiceBonus=1;" not in FACADE:
              raise SystemExit("Expanded Horizons policy no longer lives in DiceboundPowerups.openLevelUp")

          print("Canonical Powerup presentation PASS: chooser/reroll/Legendary history collapsed behind DiceboundPowerups with one renderer per responsibility")
          ''', encoding='utf-8', newline='\n')
          '@ | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/set_project_version.py --version 0.6.6.39 --channel Beta
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/refresh_runtime_manifest.py --version 0.6.6.39 --channel Beta --development-state Unreleased
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/test_historical_layer_census.py --markdown docs/HISTORICAL_LAYER_CENSUS.md
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/test_canonical_powerup_presentation.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/test_powerups_facade.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/test_powerups_oracle.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/test_release_workflow.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check runtime/js/dicebound.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/validate_runtime_architecture.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/validate_version_identity.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/validate_pr_version.py --base-ref origin/main
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Commit exact tested tree and remove one-shot materializer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Remove-Item tools/tmp_materialize_06639.py
          Remove-Item .github/workflows/tmp-materialize-06639.yml
          git diff --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git config user.name "dicebound-manifest-publisher[bot]"
          git config user.email "323488390+dicebound-manifest-publisher[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Beta 0.6.6.39: canonicalize Powerup presentation"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git push origin HEAD:refactor/0.6.6.39-canonical-functions-2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
