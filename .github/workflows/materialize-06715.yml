name: Materialize 0.6.7.15 candidate

on:
  push:
    branches:
      - feature/0.6.7.15-heirloom-progression
    paths:
      - .github/workflows/materialize-06715.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/0.6.7.15-heirloom-progression
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Materialize release identity
        shell: pwsh
        run: |
          python tools/set_project_version.py --version 0.6.7.15 --channel Beta
          python tools/refresh_runtime_manifest.py --version 0.6.7.15 --channel Beta --development-state Unreleased
          python tools/prepare_release.py --version 0.6.7.15 --channel Beta
      - name: Run focused #330 tests
        shell: pwsh
        run: |
          node tools/test_prestige_module.js
          node tools/test_heirloom_progression.js
          node tools/test_06515_prestige_heirloom_ui.js
          node tools/test_items_facade.js
          node tools/test_talent_registry.js
          node tools/test_progression_owner.js
      - name: Commit generated candidate metadata
        shell: pwsh
        run: |
          git config user.name "dicebound-materializer[bot]"
          git config user.email "dicebound-materializer[bot]@users.noreply.github.com"
          git add -A
          if (git diff --cached --quiet) {
            Write-Host "No materialized changes."
          } else {
            git commit -m "release: materialize Beta 0.6.7.15 candidate"
            git push origin HEAD:feature/0.6.7.15-heirloom-progression
          }
