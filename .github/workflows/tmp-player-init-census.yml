name: Temporary player initialization census

on:
  push:
    branches:
      - arch/0.6.6.21-player-run-initialization
    paths:
      - .github/workflows/tmp-player-init-census.yml

permissions:
  contents: read

jobs:
  census:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify new owner against frozen oracle
        shell: bash
        run: node tools/test_player_initialization.js
