name: Temporary player initialization materializer

on:
  push:
    branches:
      - arch/0.6.6.21-player-run-initialization
    paths:
      - .github/workflows/tmp-player-init-census.yml

permissions:
  contents: read

jobs:
  materialize:
    runs-on: windows-latest
    steps:
      - name: Mint repository App token
        id: app
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.DICEBOUND_RELEASE_APP_ID }}
          private-key: ${{ secrets.DICEBOUND_RELEASE_APP_PRIVATE_KEY }}
          owner: Krtz
          repositories: DiceBound
          permission-contents: write
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.app.outputs.token }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Materialize extraction and validate
        shell: pwsh
        run: |
          python tools/tmp_materialize_player_init.py
          python tools/set_project_version.py --version 0.6.6.21 --channel Beta
          python tools/refresh_runtime_manifest.py --version 0.6.6.21 --channel Beta --development-state Unreleased
          node tools/test_player_initialization.js
          python tools/validate_runtime_architecture.py
          python tools/validate_version_identity.py
          node --check runtime/js/run/player-initialization.js
          node --check runtime/js/dicebound.js
      - name: Commit extraction
        shell: pwsh
        run: |
          git config user.name "dicebound-manifest-publisher[bot]"
          git config user.email "323488390+dicebound-manifest-publisher[bot]@users.noreply.github.com"
          git add runtime tools CHANGELOG.md wrapper-source
          git commit -m "Beta 0.6.6.21: extract player run initialization"
          git push origin HEAD:arch/0.6.6.21-player-run-initialization
