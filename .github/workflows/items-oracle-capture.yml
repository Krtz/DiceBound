name: Items Oracle Capture

on:
  push:
    branches:
      - arch/0.6.6.27-items-oracle

permissions:
  contents: write

jobs:
  capture-and-validate:
    runs-on: windows-2022
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Stage test-only runtime surface
        shell: pwsh
        run: |
          python tools/patch_items_oracle_test_surface.py
          python tools/refresh_runtime_manifest.py --version 0.6.6.26 --channel Beta --development-state Unreleased
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Capture frozen 0.6.6.26 Items fixture
        shell: pwsh
        run: |
          $env:DICEBOUND_CAPTURE_ITEMS='1'
          node tools/test_items_oracle.js | Tee-Object -FilePath items-capture.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Remove-Item Env:DICEBOUND_CAPTURE_ITEMS
          @'
          from pathlib import Path
          text=Path('items-capture.txt').read_text(encoding='utf-8')
          start='ITEMS_FIXTURE_BEGIN\n'; end='\nITEMS_FIXTURE_END'
          if start not in text or end not in text:
              raise SystemExit('Items fixture markers missing from capture output')
          payload=text.split(start,1)[1].split(end,1)[0]
          out=Path('tools/fixtures/items_0_6_6_26.json')
          out.write_text(payload.strip()+'\n',encoding='utf-8',newline='\n')
          print(f'Captured {out} ({out.stat().st_size} bytes)')
          '@ | python -
      - name: Validate frozen Items slice
        shell: pwsh
        run: |
          node tools/test_items_oracle.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/test_ordinary_equipment_generation.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/test_equipment_identity_registry.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/test_loot_module.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/test_artifacts_module.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/test_road_event_treasure.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/test_merchant_stock_resolution_browser.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/validate_runtime_architecture.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/test_runtime_manifest_hash.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Materialize exact validated oracle
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/materialize_items_oracle.py
