name: Temporary 0.6.4.5 unlock validation

on:
  push:
    branches:
      - feat/0.6.4.5-class-unlock-reveals

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Stamp 0.6.4.5 release-facing source
        shell: pwsh
        run: |
          python tools/set_project_version.py --version 0.6.4.5 --channel Beta
          @'
          from pathlib import Path
          version=Path('runtime/js/version.js')
          text=version.read_text(encoding='utf-8')
          marker='const RELEASE_SUMMARY="lunch-playtest polish for packs, loot comparison, footsteps, Camp feedback and recurring Slimes.";'
          replacement='const RELEASE_SUMMARY="clear class-unlock reasons and queued post-run Camp reveal cards.";'
          if marker not in text:
              raise SystemExit('Expected 0.6.4.4 release summary not found')
          version.write_text(text.replace(marker,replacement,1),encoding='utf-8')

          changelog=Path('CHANGELOG.md')
          text=changelog.read_text(encoding='utf-8')
          if '## Beta 0.6.4.5' not in text:
              marker='This file starts the durable Git-era release history. Earlier Alpha/Beta history exists in recovered project notes; Beta 0.6 is the first release established as the repository baseline.\n\n'
              section='''## Beta 0.6.4.5\n\n### Class unlock feedback and Camp reveals (#116)\n- Class-unlock toasts now explain the completed trigger in natural player-facing language instead of only naming the unlocked class.\n- Compound and career-wide unlocks reuse the authoritative class requirement metadata, so Rogue, Vampire, Paladin, Pokémon Trainer and other multi-part unlocks explain the complete achievement accurately.\n- Newly unlocked classes are queued for a dedicated Camp reveal with canonical class art, a short class identity, a compact gameplay summary and the reason it unlocked.\n- Multiple reveals are shown one at a time and acknowledgements persist so the same reveal does not repeat forever.\n- Hidden-class conditions remain absent from locked-class UI; the richer explanation is only surfaced after an actual unlock notification.\n\n'''
              if marker not in text: raise SystemExit('Changelog marker missing')
              changelog.write_text(text.replace(marker,marker+section,1),encoding='utf-8')

          patch=Path('runtime/PATCH_NOTES.md')
          text=patch.read_text(encoding='utf-8')
          if not text.startswith('# Beta 0.6.4.5'):
              section='''# Beta 0.6.4.5\n\n## Class unlock feedback and Camp reveals (#116)\n- Unlock toasts now tell you what you actually did, such as healing the required amount or completing a Gold + guardian condition.\n- Newly unlocked classes wait until Camp for a richer reveal using the class artwork, identity, defining gameplay loop and completed unlock requirement.\n- If several classes unlock during one expedition, their Camp reveals queue cleanly instead of stacking. Acknowledged reveals stay acknowledged.\n- Unlock wording comes from the same authoritative class requirement registry used by progression rather than a second hand-maintained list.\n- Secret requirements are not advertised before the class actually unlocks.\n\n---\n\n'''
              patch.write_text(section+text,encoding='utf-8')
          '@ | python
          python tools/refresh_runtime_manifest.py --version 0.6.4.5 --channel Beta --development-state Unreleased
      - name: Run focused and architecture tests
        shell: pwsh
        run: |
          node tools/test_class_unlock_feedback.js
          node tools/test_0631_progression_slime_gear.js
          Get-ChildItem runtime/js -Recurse -Filter *.js | ForEach-Object { node --check $_.FullName; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE } }
          python tools/validate_runtime_architecture.py
          python tools/validate_asset_architecture.py
          python tools/validate_version_identity.py --version 0.6.4.5 --channel Beta
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Collect generated stamp
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force generated-stamp/runtime/js | Out-Null
          New-Item -ItemType Directory -Force generated-stamp/wrapper-source/config | Out-Null
          New-Item -ItemType Directory -Force generated-stamp/wrapper-source/wrappers/webview2/native-go | Out-Null
          Copy-Item CHANGELOG.md generated-stamp/CHANGELOG.md
          Copy-Item runtime/PATCH_NOTES.md generated-stamp/runtime/PATCH_NOTES.md
          Copy-Item runtime/index.html generated-stamp/runtime/index.html
          Copy-Item runtime/js/version.js generated-stamp/runtime/js/version.js
          Copy-Item runtime/build-info.json generated-stamp/runtime/build-info.json
          Copy-Item runtime/build-manifest.json generated-stamp/runtime/build-manifest.json
          Copy-Item wrapper-source/config/project.json generated-stamp/wrapper-source/config/project.json
          Copy-Item wrapper-source/wrappers/webview2/native-go/main.go generated-stamp/wrapper-source/wrappers/webview2/native-go/main.go
      - uses: actions/upload-artifact@v4
        with:
          name: unlock-0.6.4.5-generated-stamp
          path: generated-stamp
          retention-days: 1
