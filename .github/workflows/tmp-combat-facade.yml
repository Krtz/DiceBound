name: Temporary Combat facade materializer

on:
  push:
    branches:
      - arch/0.6.6.31-combat-facade-oracle
    paths:
      - tools/tmp_combat_facade_patch_v2.py
      - .github/workflows/tmp-combat-facade.yml

permissions:
  contents: write

jobs:
  materialize-combat-facade:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - name: Check out Combat branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"

      - name: Apply Combat facade wiring
        shell: pwsh
        run: |
          python tools/tmp_combat_facade_patch_v2.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/refresh_runtime_manifest.py --version 0.6.6.30 --channel Beta --development-state Unreleased
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run complete source validation
        shell: pwsh
        run: |
          Get-ChildItem runtime/js -Recurse -Filter *.js | ForEach-Object { node --check $_.FullName; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE } }
          Get-ChildItem tools -Filter test_*.js | ForEach-Object { node $_.FullName; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE } }
          Get-ChildItem tools -Filter test_*.py | ForEach-Object { python $_.FullName; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE } }
          python tools/validate_runtime_architecture.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/validate_asset_architecture.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/validate_launcher_assets.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go test .\installer\main_v2.go .\installer\http_policy.go .\installer\main_v2_test.go
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go vet .\installer\main_v2.go .\installer\http_policy.go .\installer\main_v2_test.go
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Report architecture
        shell: pwsh
        run: |
          python tools/validate_runtime_architecture.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Materialize exact tested Combat facade checkpoint
        shell: pwsh
        run: |
          Remove-Item tools/tmp_combat_facade_patch.py -Force -ErrorAction SilentlyContinue
          Remove-Item tools/tmp_combat_facade_patch_v2.py -Force
          Remove-Item .github/workflows/tmp-combat-facade.yml -Force
          git add -A
          git diff --cached --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git config user.name "DiceBound Combat Facade"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "arch: expose Combat engine facade"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $sha = git rev-parse HEAD
          Write-Host "COMBAT_FACADE_CHECKPOINT=$sha"
          git push origin "HEAD:refs/heads/arch/0.6.6.31-combat-facade-oracle"
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Protected branch push rejected as expected; facade checkpoint object was uploaded."
            exit 0
          }
