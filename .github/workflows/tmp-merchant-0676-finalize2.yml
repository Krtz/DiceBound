name: TEMP finalize2 0.6.7.6 merchant fix

on:
  push:
    branches:
      - fix/0.6.7.6-merchant-interactions-ui

permissions:
  contents: write

jobs:
  finalize:
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Reapply Merchant source patch
        shell: pwsh
        run: |
          $workflow = Get-Content .github/workflows/tmp-merchant-0676-materialize.yml -Raw
          $match = [regex]::Match($workflow, "(?ms)^          @'\r?\n(.*?)^          '@ \| Set-Content")
          if (-not $match.Success) { throw "Could not extract the materializer Python patch." }
          $python = (($match.Groups[1].Value -split "\r?\n") | ForEach-Object { $_ -replace '^          ', '' }) -join "`n"
          $patch = Join-Path $env:RUNNER_TEMP "merchant0676.py"
          [IO.File]::WriteAllText($patch, $python, [Text.UTF8Encoding]::new($false))
          python $patch
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Correct ownership guard and browser regression bookkeeping
        shell: pwsh
        run: |
          $guardPath = "tools/test_merchant_stock_extraction_boundary.py"
          $guard = Get-Content $guardPath -Raw
          $oldApi = 'const api=Object.freeze({configure,catalog,price,makeGear,buildStock,render,open,inspect,testing,owner:OWNER});'
          $newApi = 'const api=Object.freeze({configure,catalog,price,makeGear,buildStock,render,open,bindRoadTileInteraction,inspect,testing,owner:OWNER});'
          if (-not $guard.Contains($oldApi)) { throw "Expected stale Merchant facade API guard was not found." }
          $guard = $guard.Replace($oldApi, $newApi)
          [IO.File]::WriteAllText((Resolve-Path $guardPath), $guard, [Text.UTF8Encoding]::new($false))

          $browserPath = "tools/test_merchant_browser.js"
          $browser = Get-Content $browserPath -Raw
          $oldClick = '      ordinary?.click();await new Promise(resolve=>setTimeout(resolve,100));' + "`n" + '      document.getElementById(''merchantContinueBtn'')?.click();'
          $newClick = '      ordinary?.click();await new Promise(resolve=>setTimeout(resolve,100));const soldAfterPurchase=document.querySelectorAll(''#shopGrid .shop-item.sold'').length;' + "`n" + '      document.getElementById(''merchantContinueBtn'')?.click();'
          if (-not $browser.Contains($oldClick)) { throw "Expected Merchant browser purchase/revisit sequence was not found." }
          $browser = $browser.Replace($oldClick, $newClick)
          $oldSold = 'sold:document.querySelectorAll(''#shopGrid .shop-item.sold'').length'
          if (-not $browser.Contains($oldSold)) { throw "Expected post-revisit sold query was not found." }
          $browser = $browser.Replace($oldSold, 'sold:soldAfterPurchase')
          [IO.File]::WriteAllText((Resolve-Path $browserPath), $browser, [Text.UTF8Encoding]::new($false))

          $txPath = "tools/test_merchant_transaction.js"
          $tx = Get-Content $txPath -Raw
          $needle = 'assert.match(rarityMarkup,/&lt;img/,"escaped equipment name should remain visible text");'
          $extra = $needle + "`n" + 'for(const rarity of ["poor","common","uncommon","rare","epic","legendary","artifact","mythical","omega"]){const markup=window.DiceboundEquipmentHeirlooms.rarityNameMarkup({name:`${rarity} blade`,rarity});assert.match(markup,new RegExp(`db-rarity-${rarity}`),`canonical Merchant/equipment rarity class missing for ${rarity}`);}'
          if (-not $tx.Contains($needle)) { throw "Expected canonical rarity markup assertion was not found." }
          $tx = $tx.Replace($needle, $extra)
          [IO.File]::WriteAllText((Resolve-Path $txPath), $tx, [Text.UTF8Encoding]::new($false))

      - name: Stamp Beta 0.6.7.6
        shell: pwsh
        run: |
          python tools/set_project_version.py --version 0.6.7.6 --channel Beta
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/refresh_runtime_manifest.py --version 0.6.7.6 --channel Beta --development-state Unreleased
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Validate Merchant responsibility and Edge behavior
        shell: pwsh
        run: |
          node tools/test_merchant_facade.js
          node tools/test_merchant_transaction.js
          node tools/test_merchant_stock_resolution.js
          python tools/test_merchant_ui_extraction_boundary.py
          python tools/test_merchant_stock_extraction_boundary.py
          python tools/validate_runtime_architecture.py
          python tools/validate_version_identity.py --version 0.6.7.6 --channel Beta
          node tools/test_merchant_browser.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Validate complete source suite
        shell: pwsh
        run: |
          Get-ChildItem runtime/js -Recurse -Filter *.js | ForEach-Object { node --check $_.FullName; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE } }
          Get-ChildItem tools -Filter test_*.js | Where-Object { $_.Name -ne 'test_merchant_browser.js' } | ForEach-Object { node $_.FullName; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE } }
          Get-ChildItem tools -Filter test_*.py | ForEach-Object { python $_.FullName; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE } }
          python tools/validate_runtime_architecture.py
          python tools/validate_asset_architecture.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Commit exact validated tree
        shell: pwsh
        run: |
          git rm .github/workflows/tmp-merchant-0676-materialize.yml .github/workflows/tmp-merchant-0676-finalize.yml .github/workflows/tmp-merchant-0676-finalize2.yml
          git config user.name "dicebound-ci"
          git config user.email "dicebound-ci@users.noreply.github.com"
          git add runtime tools wrapper-source
          git status --short
          git commit -m "Beta 0.6.7.6: fix Merchant revisit secret and rarity names"
          $sha = git rev-parse HEAD
          Write-Host "VALIDATED_COMMIT=$sha"
          git push origin HEAD:fix/0.6.7.6-merchant-interactions-ui
