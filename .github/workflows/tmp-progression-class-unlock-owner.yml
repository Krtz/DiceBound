name: Temporary Progression class-unlock ownership gate

on:
  push:
    branches:
      - arch/0.6.6.29-progression-oracle

permissions:
  contents: write

jobs:
  class-unlock-owner:
    runs-on: windows-2022
    steps:
      - name: Check out Progression branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply class-unlock ownership slice
        shell: pwsh
        run: |
          python tools/tmp_fix_progression_class_unlock_patcher.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/tmp_progression_class_unlock_owner.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Remove-Item tools/tmp_fix_progression_class_unlock_patcher.py
          Remove-Item tools/tmp_progression_class_unlock_owner.py
          Remove-Item .github/workflows/tmp-progression-class-unlock-owner.yml
          python tools/refresh_runtime_manifest.py --version 0.6.6.28 --channel Beta --development-state Unreleased
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run focused Progression class-unlock gate
        shell: pwsh
        run: |
          node --check runtime/js/progression/lifecycle.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check runtime/js/dicebound.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/test_progression_owner.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/test_progression_class_unlock_owner.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/test_progression_oracle.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/test_class_unlock_rules.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/test_class_unlock_feedback.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/test_class_chooser.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/test_run_lifecycle.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run repository JavaScript regression gate
        shell: pwsh
        run: |
          Get-ChildItem tools -Filter test_*.js | ForEach-Object {
            Write-Host "Running $($_.Name)"
            node $_.FullName
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Run architecture validators
        shell: pwsh
        run: |
          python tools/validate_runtime_architecture.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/validate_asset_architecture.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/validate_launcher_assets.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Materialize exact tested candidate commit
        shell: pwsh
        run: |
          git config user.name "DiceBound Progression Class Unlock Owner"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "architecture: move class unlock orchestration behind DiceboundProgression"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $sha = git rev-parse HEAD
          Write-Host "PROGRESSION_CLASS_UNLOCK_OWNER_COMMIT=$sha"
          "PROGRESSION_CLASS_UNLOCK_OWNER_COMMIT=$sha" >> $env:GITHUB_ENV

      - name: Try to advance protected branch
        shell: pwsh
        run: |
          git push origin HEAD:refs/heads/arch/0.6.6.29-progression-oracle
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Protected branch push rejected as expected; tested commit object was uploaded."
            exit 0
          }
          Write-Host "Branch advanced directly to $env:PROGRESSION_CLASS_UNLOCK_OWNER_COMMIT."
