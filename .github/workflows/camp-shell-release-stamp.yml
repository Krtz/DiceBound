name: Camp shell release stamp

on:
  push:
    branches:
      - arch/0.6.6.36-camp-shell-oracle
    paths:
      - tools/stamp_camp_shell_release.py
      - .github/workflows/camp-shell-release-stamp.yml

permissions:
  contents: write

jobs:
  stamp-and-validate:
    runs-on: windows-2022
    steps:
      - name: Check out exact owner checkpoint
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.7'
          cache: false

      - name: Stamp Beta 0.6.6.36
        shell: pwsh
        run: |
          python tools/stamp_camp_shell_release.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/validate_version_identity.py --version 0.6.6.36 --channel Beta
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Final owner release-candidate gates
        shell: pwsh
        run: |
          node tools/test_camp_shell_owner.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/test_camp_shell_oracle.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/test_camp_ui.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/test_file_startup_browser.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/test_info_guide_ui.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/test_runtime_oracle.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/test_classes_oracle.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/validate_runtime_architecture.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/validate_asset_architecture.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/validate_launcher_assets.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go test .\installer\main_v2.go .\installer\http_policy.go .\installer\main_v2_test.go
          if ($LASTEXITCODE -eq 0) { go vet .\installer\main_v2.go .\installer\http_policy.go .\installer\main_v2_test.go }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Materialize exact release candidate
        shell: pwsh
        run: |
          Remove-Item tools/stamp_camp_shell_release.py
          Remove-Item .github/workflows/camp-shell-release-stamp.yml
          git config user.name "dicebound-release-bot"
          git config user.email "dicebound-release-bot@users.noreply.github.com"
          git add -A
          git diff --cached --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git commit -m "release: stamp Beta 0.6.6.36 Camp App Shell owner"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $sha = git rev-parse HEAD
          Write-Host "CAMP_SHELL_RELEASE_CANDIDATE=$sha"
          git push origin HEAD:refs/heads/arch/0.6.6.36-camp-shell-oracle
